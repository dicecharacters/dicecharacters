            if (typeof adventuringGearList !== 'undefined') {
                const packData = adventuringGearList.find(g => g.translationLabel === item.label);

                if (packData && packData.packConent && Array.isArray(packData.packConent)) {
                    packData.packConent.forEach(contentString => {
                        const parsed = parsePackContentString(contentString);
                        flattened.push({
                            // Menge multiplizieren (Pack-Menge * Inhalt-Menge)
                            amount: parsed.amount * (item.amount || 1), 
                            label: parsed.label,
                            selectedVaries: null,
                            typeLabel: 'singleItemLabel' 
                        });
                    });
                } else {
                    flattened.push(item);
                }
            } else {
                flattened.push(item);
            }
        } else {
            flattened.push(item);
        }
    });

    return flattened;
}

/**
 * Hilfsfunktion: Zerlegt "5xrationsLabel" in {amount: 5, label: "rationsLabel"}
 */
function parsePackContentString(str) {
    const match = str.match(/^(\d+)x(.+)$/);
    if (match) {
        return {
            amount: parseInt(match[1], 10),
            label: match[2].trim()
        };
    }
    return {
        amount: 1,
        label: str
    };
}

// --- HELPER: Kapazität berechnen ---
function getCapacityString(itemLabel) {
    if (!itemLabel) return "-";

    if (typeof mountList !== 'undefined') {
        const mount = mountList.find(m => m.translationLabel === itemLabel);
        if (mount && mount.carryingCapacity) {
            const kg = Math.round(mount.carryingCapacity * 0.453592);
            return `${kg} kg`; 
        }
    }

    if (typeof shipList !== 'undefined') {
        const ship = shipList.find(s => s.translationLabel === itemLabel);
        if (ship && ship.cargo) {
            return `${ship.cargo} t`; 
        }
    }

    return "-";
}


// BEREICH: PHYSISCHE ANGRIFFE (LOGIK & RENDERING)

/** Physische-Angriffe-Tabelle (Seite 2) — eindeutig, nicht Inventar/Glaube. */
function getPhysicalAttacksTable() {
    return document.querySelector('[data-dc-table-id="physical_attacks"]')
        || document.getElementById("th_weapon_attack")?.closest("table")
        || null;
}

/**
 * Zeile als manuell überschrieben markieren (Export + Schutz vor Auto-Regenerierung).
 * @param {HTMLTableRowElement} row
 */
function markPhysicalAttackRowManual(row) {
    if (!row) return;
    row.setAttribute("data-attack-manual", "1");
}

/**
 * Manuelle Markierung entfernen, wenn die Zeile komplett leer ist.
 * @param {HTMLTableRowElement} row
 */
function clearPhysicalAttackRowManualIfEmpty(row) {
    if (!row || !row.hasAttribute("data-attack-manual")) return;
    const hasContent = Array.from(row.querySelectorAll("input")).some(inp => (inp.value || "").trim() !== "");
    if (!hasContent) row.removeAttribute("data-attack-manual");
}

/**
 * Wird aufgerufen, wenn eine Waffe im Inventar "equipped" (angehakt) wird.
 * Liest alle gecheckten Waffen aus und füllt die obere Tabelle.
 */
/** Anzeigenamen einer Inventarzeile (Vollname + optional Kurzform in Klammern). */
function getInventoryItemDisplayNameVariants(translationLabel, shortLabel) {
    const lang = (typeof currentLanguage !== "undefined" && currentLanguage)
        ? currentLanguage
        : ((typeof currentLang !== "undefined" && currentLang) ? currentLang : "de");
    const t = (typeof translations !== "undefined" && translations[lang]) ? translations[lang] : {};
    const full = String(t[translationLabel] || translationLabel).trim();
    const names = full ? [full] : [];
    if (shortLabel && shortLabel !== 0) {
        const short = String(t[shortLabel] || shortLabel).trim();
        if (short) names.push(`${full} (${short})`);
    }
    return names;
}

/** Rüstung anhand des Inventar-Anzeigenamens finden (Creator- und manuelle Zeilen). */
function findArmorDataByInventoryDisplayName(displayName) {
    if (!displayName || typeof armorList === "undefined") return null;
    const trimmedLower = String(displayName).trim().toLowerCase();
    if (!trimmedLower) return null;
    for (const armor of armorList) {
        const variants = getInventoryItemDisplayNameVariants(armor.translationLabel, armor.translationShortLabel);
        if (variants.some(v => {
            const vLower = v.toLowerCase();
            return trimmedLower === vLower || trimmedLower.startsWith(vLower + " ");
        })) return armor;
    }
    return null;
}

/** Waffe anhand des Inventar-Anzeigenamens finden (Creator- und manuelle Zeilen). */
function findWeaponDataByInventoryDisplayName(displayName) {
    if (!displayName || typeof weaponList === "undefined") return null;
    const trimmedLower = String(displayName).trim().toLowerCase();
    if (!trimmedLower) return null;
    for (const weapon of weaponList) {
        const variants = getInventoryItemDisplayNameVariants(weapon.translationLabel, weapon.translationShortLabel);
        if (variants.some(v => {
            const vLower = v.toLowerCase();
            return trimmedLower === vLower || trimmedLower.startsWith(vLower + " ");
        })) return weapon;
    }
    return null;
}

/** RK einer Körperrüstung (ohne Schild) berechnen. */
function computeBodyArmorAc(armorData, dexMod) {
    const baseVal = parseInt(armorData.armorClassValue, 10) || 10;
    let modVal = 0;
    if (armorData.armorClassMod === "dexMod") {
        let applicableDexMod = dexMod;
        const catNum = armorData.armorCategoryNumber;
        if (catNum === 2) {
            let maxDex = 2;
            const dexScore = parseInt(document.getElementById("dexterityScore")?.value, 10) || 10;
            if (window.hasMediumArmorMaster === true && dexScore >= 16) maxDex = 3;
            if (applicableDexMod > maxDex) applicableDexMod = maxDex;
        } else if (catNum === 3) {
            applicableDexMod = 0;
        }
        modVal = applicableDexMod;
    }
    let ac = baseVal + modVal;
    if (window.hasDefenseStyle === true) ac += 1;
    return ac;
}

function getEquippedArmorDisplayLabel(armorData, itemLabel) {
    if (armorData.translationShortLabel && armorData.translationShortLabel !== 0) {
        return (translations[currentLanguage] && translations[currentLanguage][armorData.translationShortLabel])
            ? translations[currentLanguage][armorData.translationShortLabel]
            : armorData.translationShortLabel;
    }
    return (translations[currentLanguage] && translations[currentLanguage][itemLabel])
        ? translations[currentLanguage][itemLabel]
        : itemLabel;
}

function updatePhysicalAttacks() {
    const attackTable = getPhysicalAttacksTable();
    if (!attackTable) return;
    const attackRows = attackTable.querySelectorAll('tbody tr');
    
    const inventoryHeader = document.getElementById('th_amount_1');
    if (!inventoryHeader) return;
    const inventoryRows = inventoryHeader.closest('table').querySelector('tbody').querySelectorAll('tr');

    // 1. SCHRITT: Welche Datenbank-Waffen sind aktuell im Inventar markiert?
    const charData = loadCharacterDataFromStorage();
    let processedWeapons = expandInventoryPacks(charData.equipment.weapons || []);
    processedWeapons = mergeDuplicateItems(processedWeapons);

    const activeDbWeapons = [];
    inventoryRows.forEach(iRow => {
        const cb = iRow.querySelector('input[type="checkbox"]');
        if (!cb || !cb.checked) return;

        if (cb.hasAttribute("data-creator-bound")) {
            validateInventoryCreatorRowBinding(iRow, 1, { skipRefresh: true });
        }

        if (cb.hasAttribute("data-creator-bound")) {
            const index = parseInt(cb.getAttribute('data-index'), 10);
            const item = processedWeapons[index];
            if (!item) return;
            const wData = typeof weaponList !== 'undefined'
                ? weaponList.find(w => w.translationLabel === item.label)
                : null;
            if (wData) activeDbWeapons.push({ item, wData });
            return;
        }

        // Manuelle Inventarzeile: Anzeigename gegen Waffenliste matchen
        const nameInput = iRow.querySelectorAll("input")[1];
        const rowName = (nameInput?.value || "").trim();
        if (!rowName) return;
        const wData = findWeaponDataByInventoryDisplayName(rowName);
        if (wData) {
            activeDbWeapons.push({ item: { label: wData.translationLabel }, wData });
        }
    });

    // 2. SCHRITT: Abgleich der Angriffstabelle
    // Wir löschen NUR Zeilen, die eine Datenbank-Verknüpfung hatten, aber nicht mehr aktiv sind.
    // Manuelle Zeilen (ohne data-db-linked) bleiben absolut unberührt.
    attackRows.forEach(aRow => {
        if (aRow.hasAttribute("data-attack-manual")) return;
        const isLinked = aRow.hasAttribute('data-db-linked');
        const currentName = aRow.querySelectorAll('input')[0].value;

        if (isLinked) {
            // Prüfen, ob diese Datenbank-Waffe noch in unserer aktiven Liste ist
            const stillActive = activeDbWeapons.some(dbW => {
                const tName = (translations[currentLanguage] && translations[currentLanguage][dbW.item.label]) || dbW.item.label;
                return tName === currentName;
            });

            if (!stillActive) {
                // Nur wenn es eine DB-Waffe war und sie nicht mehr aktiv ist: Löschen
                aRow.querySelectorAll('input').forEach(inp => inp.value = "");
                aRow.removeAttribute('data-db-linked');
                const oldSelect = aRow.querySelector('select');
                if (oldSelect) oldSelect.remove();
                aRow.querySelectorAll('input').forEach(inp => inp.style.display = 'block');
            }
        }
    });

    // 3. SCHRITT: Neue Datenbank-Waffen hinzufügen
    const pb = parseInt(document.getElementById('proficiencyBonus')?.value.replace('+', '')) || 2;
    const strMod = parseInt(document.getElementById('strengthModifier')?.value) || 0;
    const dexMod = parseInt(document.getElementById('dexterityModifier')?.value) || 0;

    activeDbWeapons.forEach(dbW => {
        const translatedName = (translations[currentLanguage] && translations[currentLanguage][dbW.item.label]) || dbW.item.label;
        
        // Ist diese DB-Waffe schon in der Tabelle?
        const alreadyInTable = Array.from(attackRows).some(r => r.querySelectorAll('input')[0].value === translatedName);

        if (!alreadyInTable) {
            // Suche erste freie Zeile (manuelle Overrides nicht überschreiben)
            const freeRow = Array.from(attackRows).find(r => {
                if (r.hasAttribute("data-attack-manual")) return false;
                return r.querySelectorAll('input')[0].value === "";
            });
            if (freeRow) {
                freeRow.setAttribute('data-db-linked', 'true');
                renderAttackRow(freeRow, dbW.item, charData, strMod, dexMod, pb);
            }
        }
    });
}

function isProficientWithWeapon(weaponData) {
    if (!weaponData) return false;

    // A. Aktuelle Checkboxen prüfen (Live-Status)
    const category = weaponData.weaponCategoryNumber; // 1=SimpleMelee, 2=SimpleRanged, 3=MartialMelee, 4=MartialRanged
    let isCategoryChecked = false;

    if (category === 1) isCategoryChecked = document.getElementById('simpleMeleeWeapons')?.checked;
    else if (category === 2) isCategoryChecked = document.getElementById('simpleRangedWeapons')?.checked;
    else if (category === 3) isCategoryChecked = document.getElementById('martialMeleeWeapons')?.checked;
    else if (category === 4) isCategoryChecked = document.getElementById('martialRangedWeapons')?.checked;

    // Wenn die Kategorie gar nicht angehakt ist, sind wir sowieso nicht geübt
    if (!isCategoryChecked) return false;

    // B. FEIN-PRÜFUNG: Klassenspezifische Einschränkungen (Properties)
    // Wir laden die internen Daten, um die Klasse sicher zu identifizieren (z.B. "Rogue" statt "Schurke")
    const charData = loadCharacterDataFromStorage();
    const className = charData.basic.class; 

    if (className && typeof classCoreTraitsList !== 'undefined') {
        // Suche case-insensitive nach dem internen Label
        const classData = classCoreTraitsList.find(c => 
            c.translationLabel.toLowerCase() === className.toLowerCase()
        );

        // Hat diese Klasse Einschränkungen bei den Eigenschaften? 
        // (z.B. Rogue hat weaponPropertyCategoryNumber: [2] für Finesse)
        // WICHTIG: Wir prüfen das NUR, wenn es sich um Kriegswaffen (3/4) handelt, 
        // da einfache Waffen (1/2) meist pauschal erlaubt sind.
        if (classData && classData.weaponPropertyCategoryNumber && (category === 3 || category === 4)) {
            
            // Tab-1-Eigenschaften + Custom-Class-Grants (Einfach→Waffenvertrautheit)
            const baseProps = Array.isArray(classData.weaponPropertyCategoryNumber) 
                                 ? classData.weaponPropertyCategoryNumber 
                                 : [classData.weaponPropertyCategoryNumber];
            const grantedProps = (typeof getGrantedCustomClassWeaponPropertyCategoryNumbers === "function")
                ? getGrantedCustomClassWeaponPropertyCategoryNumbers(charData)
                : [];
            const allowedProps = [...new Set(
                [...baseProps, ...grantedProps].map(n => Number(n)).filter(n => Number.isFinite(n) && n > 0)
            )];

            // Die Eigenschaften der aktuellen Waffe
            const weaponProps = Array.isArray(weaponData.weaponPropertyCategoryNumber)
                                ? weaponData.weaponPropertyCategoryNumber
                                : (weaponData.weaponPropertyCategoryNumber ? [weaponData.weaponPropertyCategoryNumber] : []);

            // SCHNITTMENGE PRÜFEN:
            // Hat die Waffe mindestens EINE Eigenschaft, die in der erlaubten Liste steht?
            // (z.B. Hat das Großschwert "Finesse"? Nein -> false)
            const hasMatchingProperty = weaponProps.some(propId => allowedProps.includes(Number(propId)));

            if (!hasMatchingProperty) {
                // Obwohl die Kategorie (Kriegswaffen) angehakt ist, passt die Eigenschaft nicht zur Klasse.
                // Daher: Kein Bonus!
                return false; 
            }
        }
    }

    // Wenn alle Checks bestanden sind:
    return true;
}

/**
 * Berechnet Werte für eine Waffe und schreibt sie in die Zeile.
 */
function renderAttackRow(row, item, charData, strMod, dexMod, pb) {
    const inputs = row.querySelectorAll('input');
    // inputs[0]: Name, [1]: Bonus, [2]: Schaden/Art, [3]: Eigenschaften, [4]: Meisterschaft, [5]: Beschreibung

    // A. STAMMDATEN LADEN
    let weaponData = null;
    if (typeof weaponList !== 'undefined') {
        weaponData = weaponList.find(w => w.translationLabel === item.label);
    }

    // Fallback
    if (!weaponData) {
        inputs[0].value = (translations[currentLanguage] && translations[currentLanguage][item.label]) 
                          ? translations[currentLanguage][item.label] 
                          : item.label; 
        return;
    }

    // B. NAME
    inputs[0].value = (translations[currentLanguage] && translations[currentLanguage][item.label]) 
                      ? translations[currentLanguage][item.label] 
                      : item.label;

    // C. EIGENSCHAFTEN (Properties) & FINESSE CHECK
    let props = [];
    let isFinesse = false;
    let isLight = false; 
    const isRanged = (weaponData.weaponCategoryNumber === 2 || weaponData.weaponCategoryNumber === 4);
    
    if (weaponData.weaponPropertyCategoryNumber) {
        const propIds = Array.isArray(weaponData.weaponPropertyCategoryNumber) 
                        ? weaponData.weaponPropertyCategoryNumber 
                        : [weaponData.weaponPropertyCategoryNumber];
        
        propIds.forEach(id => {
            if (id === 2) isFinesse = true; // ID 2 ist Finesse

            const propObj = weaponProperty.find(p => p.weaponPropertyCategoryNumber === id);
            if (propObj) {
                // Prüfen ob "Leicht"
                if (propObj.translationLabel === 'lightLabel') isLight = true;

                const pName = (translations[currentLanguage] && translations[currentLanguage][propObj.translationLabel]) 
                              ? translations[currentLanguage][propObj.translationLabel] 
                              : propObj.translationLabel;
                props.push(pName);
            }
        });
    }
    inputs[3].value = props.length > 0 ? props.join(", ") : "-";

    // --- KORRIGIERTE MÖNCHS-REGEL ---
    // Gleiche Bedingung wie bei der Berechnung: Kein Fernkampf UND (Leicht ODER Einfache Nahkampfwaffe)
    if (window.hasMartialArts && !isRanged && (isLight || weaponData.weaponCategoryNumber === 1)) {
        isFinesse = true; 
    }


    // D. SCHADEN & SCHADENSART (Basiswerte ermitteln)
    const dmgVal = weaponData.weaponDamageValue || "";
    let dmgType = "";
    if (weaponData.damageCategoryNumber) {
        const typeObj = damageType.find(d => d.damageCategoryNumber === weaponData.damageCategoryNumber);
        if (typeObj) {
            dmgType = (translations[currentLanguage] && translations[currentLanguage][typeObj.translationLabel]) 
                      ? translations[currentLanguage][typeObj.translationLabel] 
                      : typeObj.translationLabel;
            
            dmgType = dmgType.replace("Label", ""); 
        }
    }
    // (Der Wert wird erst in Block F final mit Modifikator in inputs[2] geschrieben)

    // E. MEISTERSCHAFT (Mastery)
    let masteryText = "-"; 
    
    if (charData.classForm && charData.classForm.weaponMastery && Array.isArray(charData.classForm.weaponMastery)) {
        if (charData.classForm.weaponMastery.includes(weaponData.ID.toString())) {
            const masteryObj = weaponMastery.find(m => m.weaponMasteryCategoryNumber === weaponData.weaponMasteryCategoryNumber);
            if (masteryObj) {
                masteryText = (translations[currentLanguage] && translations[currentLanguage][masteryObj.translationLabel]) 
                              ? translations[currentLanguage][masteryObj.translationLabel] 
                              : masteryObj.translationLabel;
            }
        }
    }
    inputs[4].value = masteryText;

    // --- ÜBUNGSPRÜFUNG ---
    const isProficient = isProficientWithWeapon(weaponData);

    // --- ARCHERY BONUS PRÜFUNG (NEU) ---
    let archeryBonus = 0;
    // Kategorie 2 (Einfache Fernkampf) oder 4 (Kriegswaffen Fernkampf)
    if (window.hasArcheryStyle === true) {
        if (weaponData.weaponCategoryNumber === 2 || weaponData.weaponCategoryNumber === 4) {
            archeryBonus = 2;
        }
    }

    // F. BONUS BERECHNUNG & DROPDOWN (Angriff & Schaden)
    const descCell = inputs[5].parentElement; 
    
    if (isFinesse) {
        inputs[5].style.display = 'none'; 
        
        let select = descCell.querySelector('select.finesse-selector');
        if (!select) {
            const t = translations[currentLanguage] || translations['de'];
            const strLabel = t['strengthLabel'] || 'Stärke';
            const dexLabel = t['dexterityLabel'] || 'Geschicklichkeit';
            
            select = document.createElement('select');
            select.className = 'table-input finesse-selector';
            select.style.width = "100%";
            select.style.border = "none";
            select.style.background = "transparent";
            select.innerHTML = `
                <option value="STR">${strLabel}</option>
                <option value="DEX">${dexLabel}</option>
            `;
            
            // Event Listener mit neuem Parameter-Set für Angriff UND Schaden
            select.onchange = function() {
                recalcFinesseBonus(this, inputs[1], inputs[2], strMod, dexMod, pb, isProficient, archeryBonus, dmgVal, dmgType);
            };
            
            descCell.appendChild(select);
            
            if (dexMod > strMod) {
                select.value = "DEX";
            } else {
                select.value = "STR";
            }
        }
        
        // Initialen Bonus berechnen (inkl. Archery)
        recalcFinesseBonus(select, inputs[1], inputs[2], strMod, dexMod, pb, isProficient, archeryBonus, dmgVal, dmgType);
        
    } else {
        // Standard Waffe (Kein Finesse)
        inputs[5].style.display = 'block';
        inputs[5].value = "-";
        
        const oldSelect = descCell.querySelector('select');
        if (oldSelect) oldSelect.remove();

        const bestMod = calculateBestWeaponMod(weaponData, strMod, dexMod);
        
        // 1. Angriffsbonus (Mod + PB (wenn geübt) + ArcheryBonus)
        const totalAttack = (isProficient ? (bestMod + pb) : bestMod) + archeryBonus;
        inputs[1].value = (totalAttack >= 0 ? "+" : "") + totalAttack;

        // 2. Schaden zusammensetzen (Nur Mod)
        if (dmgVal) {
            let modString = "";
            const isDiceRoll = dmgVal.toLowerCase().includes('d'); // Check für Blasrohr etc.

            if (isDiceRoll) {
                if (bestMod > 0) modString = `+${bestMod}`;
                else if (bestMod < 0) modString = `${bestMod}`;
                // Bei bestMod === 0 bleibt modString "", es wird keine +0 geschrieben
            }
            
            inputs[2].value = `${dmgVal} ${modString} ${dmgType}`.trim().replace(/\s+/g, ' ');
        } else {
            inputs[2].value = "-";
        }
    }
}

/**
 * Berechnet Bonus neu basierend auf Dropdown Auswahl
 */
function recalcFinesseBonus(selectElem, bonusInputElem, dmgInputElem, strMod, dexMod, pb, isProficient, archeryBonus = 0, baseDmg = "", dmgType = "") {
    const selected = selectElem.value;
    const mod = (selected === 'DEX') ? dexMod : strMod;
    
    // 1. Angriffsbonus (Mod + PB + Archery)
    const totalAttack = (isProficient ? (mod + pb) : mod) + archeryBonus;
    bonusInputElem.value = (totalAttack >= 0 ? "+" : "") + totalAttack;

    // 2. Schadensbonus (Nur Mod, KEIN Archery, KEIN PB)
    if (baseDmg) {
        let modString = "";
        if (mod > 0) modString = `+${mod}`;
        else if (mod < 0) modString = `${mod}`; // Minus ist schon im Wert
        
        // Baut z.B. "1d4 +3 Hieb" oder "1d4 -1 Hieb" oder "1d4 Hieb" (bei 0)
        dmgInputElem.value = `${baseDmg} ${modString} ${dmgType}`.trim().replace(/\s+/g, ' '); 
    } else {
        dmgInputElem.value = "-";
    }
}

/**
 * Berechnet die Rüstungsklasse basierend auf der ausgerüsteten Rüstung und dem Schild.
 * Aktualisiert auch Labels auf Seite 1 und den Sperr-Status.
 */
function updateArmorClass() {
    // 1. Stats holen
    const dexMod = parseInt(document.getElementById('dexterityModifier').value) || 0;
    
    let finalAC = 10 + dexMod; // Basis (Unarmored)

    // Prüfen, ob wir einen besseren Basiswert durch ein Klassenmerkmal haben
    if (typeof window.classFeatureAC !== 'undefined' && window.classFeatureAC > finalAC) {
        finalAC = window.classFeatureAC; 
    }

    let equippedArmorName = ""; 
    let shieldAvailableInInventory = false; 

    // 2. Inventar (Box 2) prüfen
    const headerEl = document.getElementById('th_amount_2');
    if (headerEl) {
        const rows = headerEl.closest('table').querySelector('tbody').querySelectorAll('tr');
        
        // Daten für Lookup holen
        const charData = loadCharacterDataFromStorage();
        let processedArmor = charData.equipment.armor || [];
        processedArmor = expandInventoryPacks(processedArmor);
        processedArmor = mergeDuplicateItems(processedArmor);

        for (let row of rows) {
            const checkbox = row.querySelector('input[type="checkbox"]');
            
            // Check: Ist das ein Schild mit Namen? (geleerte Zeile zählt nicht)
            if (checkbox && isInventoryArmorRowShield(row, checkbox)) {
                shieldAvailableInInventory = true;
            }

            // Check: Ist diese Rüstung angelegt?
            if (checkbox && checkbox.checked && checkbox.hasAttribute("data-creator-bound")) {
                validateInventoryCreatorRowBinding(row, 2, { skipRefresh: true });
            }

            if (checkbox && checkbox.checked && checkbox.hasAttribute("data-creator-bound")) {
                const index = parseInt(checkbox.getAttribute('data-index'), 10);
                const item = processedArmor[index];

                if (item && typeof armorList !== 'undefined') {
                    const armorData = armorList.find(a => a.translationLabel === item.label);
                    
                    // RÜSTUNG (Kein Schild)
                    if (armorData && armorData.armorCategoryNumber !== 4) {
                        finalAC = computeBodyArmorAc(armorData, dexMod);
                        equippedArmorName = getEquippedArmorDisplayLabel(armorData, item.label);
                    }
                }
            } else if (checkbox && checkbox.checked) {
                if (isInventoryArmorRowShield(row, checkbox)) continue;
                if (!inventoryEquipRowHasName(row)) continue;
                const nameInput = row.querySelectorAll("input")[1];
                const rowName = (nameInput?.value || "").trim();
                if (!rowName) continue;
                const armorData = findArmorDataByInventoryDisplayName(rowName);
                if (armorData && armorData.armorCategoryNumber !== 4) {
                    finalAC = computeBodyArmorAc(armorData, dexMod);
                    equippedArmorName = getEquippedArmorDisplayLabel(armorData, armorData.translationLabel);
                }
            }
        }
    }

    // 2b. Geleerte Zeilen dürfen nicht „angelegt“ bleiben (Rüstung + Schild)
    enforceInventoryEquipRequiresName(2);

    // 3. Schild-Logik auf Seite 1
    const shieldCheckboxPage1 = document.getElementById('shieldActive');
    
    if (shieldCheckboxPage1) {
        if (shieldAvailableInInventory) {
            shieldCheckboxPage1.disabled = false;
            if (shieldCheckboxPage1.checked) {
                finalAC += 2;
            }
        } else {
            shieldCheckboxPage1.checked = false;
            shieldCheckboxPage1.disabled = true;
        }
    }

    // 4. Werte schreiben
    const acInput = document.getElementById('armorClass');
    if (acInput) acInput.value = finalAC;

    const armorNameInput = document.getElementById('equippedArmor');
    if (armorNameInput) armorNameInput.value = equippedArmorName;

    // 5. Locking aktualisieren
    updateArmorLocking();
}

/**
 * Synchronisiert die Schild-Checkboxen zwischen Seite 1 und Inventar.
 * Nur Zeilen mit Namen zählen; Rüstung+Schild gleichzeitig bleibt erlaubt.
 * @param {HTMLElement} element - Das angeklickte Element
 * @param {string} source - 'page1' oder 'inventory'
 */
function toggleShield(element, source) {
    const namedShields = getNamedInventoryShieldCheckboxes();
    const page1Checkbox = document.getElementById('shieldActive');

    // Kein benanntes Schild im Inventar → Anlegen unmöglich
    if (!namedShields.length) {
        if (element) element.checked = false;
        if (page1Checkbox) {
            page1Checkbox.checked = false;
            page1Checkbox.disabled = true;
        }
        document.querySelectorAll('.inventory-shield-checkbox').forEach(cb => {
            cb.checked = false;
        });
        updateArmorClass();
        const charDataEmpty = loadCharacterDataFromStorage();
        applyClassFeatureLogic(charDataEmpty);
        applyTalentFeatureLogic(charDataEmpty);
        return;
    }

    // Inventar-Klick auf geleerte Zeile abfangen
    if (source === 'inventory' && element) {
        const row = element.closest('tr');
        if (row && !inventoryEquipRowHasName(row)) {
            element.checked = false;
            element.classList.remove('inventory-shield-checkbox');
            updateArmorClass();
            return;
        }
    }

    const isChecked = !!element?.checked;

    if (source === 'page1') {
        namedShields.forEach(cb => { cb.checked = isChecked; });
    } else {
        if (page1Checkbox) page1Checkbox.checked = isChecked;
        namedShields.forEach(cb => { cb.checked = isChecked; });
    }

    updateArmorClass();

    const charData = loadCharacterDataFromStorage();
    applyClassFeatureLogic(charData);
    applyTalentFeatureLogic(charData);
}

/**
 * true = Inventar-Zeile hat einen nicht-leeren Ausrüstungsnamen (Spalte 2).
 */
function inventoryEquipRowHasName(row) {
    if (!row) return false;
    const nameInput = row.querySelectorAll("input")[1];
    return String(nameInput?.value || "").trim() !== "";
}

/**
 * true = Zeilenname entspricht einem Schild (armorCategory 4 / shieldLabel).
 * Nur Namensabgleich — die CSS-Klasse allein zählt nicht (verhindert Ex-Schild-Zeilen).
 */
function isInventoryArmorRowShield(row, checkbox) {
    if (!row || !inventoryEquipRowHasName(row)) return false;
    if (typeof armorList === "undefined") return false;

    const inputs = row.querySelectorAll("input");
    const nameVal = String(inputs[1]?.value || "").trim();
    const lang = (typeof currentLanguage !== "undefined" && currentLanguage)
        ? currentLanguage
        : ((typeof currentLang !== "undefined" && currentLang) ? currentLang : "de");
    const t = (typeof translations !== "undefined" && translations[lang]) ? translations[lang] : {};
    const nameLower = nameVal.toLowerCase();

    return armorList.some(a => {
        if (!a || (a.armorCategoryNumber !== 4 && a.translationLabel !== "shieldLabel")) return false;
        const full = String(t[a.translationLabel] || a.translationLabel).trim();
        if (!full) return false;
        const fullLower = full.toLowerCase();
        return nameLower === fullLower || nameLower.startsWith(fullLower + " ");
    });
}

/**
 * Schild-Marker und onchange an den aktuellen Zeilennamen koppeln.
 * Verhindert, dass umbenannte Ex-Schild-Zeilen weiter als Schild gelten (auch nach Refresh).
 * @returns {boolean} true = Zeile ist jetzt ein Schild
 */
function syncInventoryArmorRowShieldState(row) {
    const cb = row?.querySelector('input[type="checkbox"]');
    if (!cb) return false;

    const hadShieldMarker = cb.classList.contains("inventory-shield-checkbox");
    cb.classList.remove("inventory-shield-checkbox");

    const isShieldNow = isInventoryArmorRowShield(row, cb);
    if (isShieldNow) {
        cb.classList.add("inventory-shield-checkbox");
        cb.setAttribute("onchange", 'toggleShield(this, "inventory")');
        return true;
    }

    const onchange = cb.getAttribute("onchange") || "";
    if (hadShieldMarker || onchange.includes("toggleShield")) {
        cb.setAttribute("onchange", "handleArmorChange(this)");
        // Ex-Schild mit neuem Nicht-Schild-Namen: Anlegen lösen (kein Parallel-Schild mehr)
        if (hadShieldMarker && cb.checked && inventoryEquipRowHasName(row)) {
            cb.checked = false;
        }
    }
    return false;
}

/**
 * Alle Rüstungs-Inventarzeilen: Schild-Status am Namen ausrichten.
 */
function syncAllInventoryArmorShieldStates() {
    const table = document.querySelector('[data-dc-table-id="inv_armor"]');
    if (!table) return;
    table.querySelectorAll("tbody tr").forEach(row => {
        syncInventoryArmorRowShieldState(row);
    });
}

/**
 * Anlege-Checkbox nur mit Namen — geleerte Waffen-/Rüstungs-/Schild-Zeilen abwählen.
 * @param {1|2} boxId – 1 Waffen, 2 Rüstung/Schild
 */
function enforceInventoryEquipRequiresName(boxId) {
    const tableId = boxId === 1 ? "inv_weapons" : "inv_armor";
    const table = document.querySelector(`[data-dc-table-id="${tableId}"]`);
    if (!table) return;

    let clearedShield = false;
    table.querySelectorAll("tbody tr").forEach(row => {
        const cb = row.querySelector('input[type="checkbox"]');
        if (!cb || !cb.checked) return;
        if (inventoryEquipRowHasName(row)) return;

        cb.checked = false;
        if (boxId === 2) {
            if (cb.classList.contains("inventory-shield-checkbox")) {
                clearedShield = true;
                cb.classList.remove("inventory-shield-checkbox");
            }
        }
    });

    if (clearedShield) {
        const page1 = document.getElementById("shieldActive");
        if (page1) {
            page1.checked = false;
        }
    }
}

/**
 * Alle Inventar-Schild-Checkboxen mit gültigem Schild-Namen (anlegbar).
 * @returns {HTMLInputElement[]}
 */
function getNamedInventoryShieldCheckboxes() {
    const headerEl = document.getElementById("th_amount_2");
    if (!headerEl) return [];
    const rows = headerEl.closest("table")?.querySelector("tbody")?.querySelectorAll("tr");
    if (!rows) return [];

    const out = [];
    rows.forEach(row => {
        const cb = row.querySelector('input[type="checkbox"]');
        if (!cb) return;
        if (!isInventoryArmorRowShield(row, cb)) return;
        out.push(cb);
    });
    return out;
}

/**
 * Nur eine Körperrüstung angelegt — weitere abwählen (Schild bleibt erlaubt).
 * @param {HTMLInputElement} [preferredCheckbox] – gerade aktivierte Checkbox hat Vorrang
 */
function enforceExclusiveBodyArmorEquipped(preferredCheckbox) {
    const headerEl = document.getElementById("th_amount_2");
    if (!headerEl) return;

    const rows = headerEl.closest("table").querySelector("tbody").querySelectorAll("tr");
    const bodyArmorChecks = [];

    rows.forEach(row => {
        const checkbox = row.querySelector('input[type="checkbox"]');
        if (!checkbox || !checkbox.checked) return;
        if (isInventoryArmorRowShield(row, checkbox)) return;
        bodyArmorChecks.push(checkbox);
    });

    if (bodyArmorChecks.length <= 1) return;

    let keep = null;
    if (preferredCheckbox && preferredCheckbox.checked
        && bodyArmorChecks.includes(preferredCheckbox)) {
        keep = preferredCheckbox;
    } else {
        keep = bodyArmorChecks[0];
    }

    bodyArmorChecks.forEach(cb => {
        if (cb !== keep) cb.checked = false;
    });
}

/**
 * Sorgt dafür, dass nur EINE Rüstung gleichzeitig ausgewählt sein kann.
 * Schilde sind davon ausgenommen (können zusätzlich gewählt werden).
 */
function updateArmorLocking() {
    const headerEl = document.getElementById('th_amount_2'); // Rüstungs-Tabelle
    if (!headerEl) return;

    // Geleerte Namen: Anlegen unmöglich (Körperrüstung + Schild)
    enforceInventoryEquipRequiresName(2);

    // Zuerst Doppel-Anlagen bereinigen (nicht nur sperren) — Schild bleibt parallel erlaubt
    enforceExclusiveBodyArmorEquipped(null);

    const rows = headerEl.closest('table').querySelector('tbody').querySelectorAll('tr');
    
    let isBodyArmorEquipped = false;
    let equippedRowIndex = -1;

    // 1. Prüfen: Ist aktuell eine Körperrüstung (kein Schild) angelegt?
    rows.forEach((row, index) => {
        const checkbox = row.querySelector('input[type="checkbox"]');
        const isShield = isInventoryArmorRowShield(row, checkbox);
        
        if (checkbox && checkbox.checked && !isShield) {
            isBodyArmorEquipped = true;
            equippedRowIndex = index;
        }
    });

    // 2. Sperren/Entsperren
    rows.forEach((row, index) => {
        const checkbox = row.querySelector('input[type="checkbox"]');
        if (!checkbox) return;

        const isShield = isInventoryArmorRowShield(row, checkbox)
            || checkbox.classList.contains('inventory-shield-checkbox');
        const hasName = inventoryEquipRowHasName(row);

        // Ohne Namen: Anlege-Checkbox sperren (Rüstung und Schild)
        if (!hasName) {
            checkbox.checked = false;
            checkbox.disabled = true;
            row.classList.add('disabled-inventory-row');
            if (checkbox.classList.contains('inventory-shield-checkbox')) {
                checkbox.classList.remove('inventory-shield-checkbox');
            }
            return;
        }

        // Schilde mit Namen: frei (zusätzlich zur Körperrüstung)
        if (isShield) {
            checkbox.disabled = false;
            row.classList.remove('disabled-inventory-row');
            return;
        }

        if (isBodyArmorEquipped && index !== equippedRowIndex) {
            checkbox.disabled = true;
            row.classList.add('disabled-inventory-row');
        } else {
            checkbox.disabled = false;
            row.classList.remove('disabled-inventory-row');
        }
    });
}


/* --------------------------------------------------------------------------
   3 f. Klassenmerkmale
   -------------------------------------------------------------------------- */
function processClassFeatures(data) {
    console.log("Verarbeite Klassenmerkmale...");
    
    // 1. Level & Klasse ermitteln
    const levelInput = document.getElementById('level');
    let currentLevel = levelInput ? parseInt(levelInput.value, 10) : parseInt(data.basic.level, 10);
    if (isNaN(currentLevel)) currentLevel = 1;

    // 2. Datenquelle sicher laden
    const className = data.basic.class; 
    const dataSource = getClassDataArray(className); 

    if (!dataSource) {
        console.warn(`Keine Klassendaten gefunden für: ${className}`);
        return;
    }

    // 3. Unterklasse & Container
    const subclassId = parseInt(data.classForm.subclass, 10) || 0;
    const classBox = document.getElementById('classFeaturesContent');
    const subClassBox = document.getElementById('subclassFeaturesContent');
    
    if (classBox) classBox.innerHTML = "";
    if (subClassBox) subClassBox.innerHTML = "";

    // 4. Rendering starten
    renderFeatures(dataSource, currentLevel, subclassId, data, className);
}

function renderFeatures(dataSource, currentLevel, userSubclassId, data, className) {
    let classFeaturesMap = new Map();
    let subclassFeaturesMap = new Map();

    const sortedData = [...dataSource].sort((a, b) => a.level - b.level);

    // --- UI LABELS LADEN ---
    const t = translations[currentLanguage] || translations['de'];
    const lblLevel = t['levelLabel2'] || "Stufe"; 
    const lblExpansion = t['expansionAtLevelLabel'] || "Erweiterung auf Stufe";

    // Pro Parameter + Scope: letzte sichtbare Stufe behält LEVEL_VAL
    // (Basisklasse und Unterklassen getrennt – auch bei gemeinsamem Parameter)
    const latestFeatByLevelValParam = new Map();
    sortedData.forEach(feat => {
        if (feat.level > currentLevel) return;
        const isClassFeature = (feat.subclassCategoryNumber === 0);
        const isSubclassFeature = (feat.subclassCategoryNumber === userSubclassId);
        if (!isClassFeature && !isSubclassFeature) return;
        const configStr = (feat.classFeaturesCharacterSheet || "0").toString();
        const type = configStr.split(':')[0];
        if (type !== "1" && type !== "3") return;
        const paramId = feat.levelValParameterId;
        if (!paramId || paramId === 0) return;
        const scopeKey = `${feat.subclassCategoryNumber || 0}::${paramId}`;
        latestFeatByLevelValParam.set(scopeKey, feat);
    });

    sortedData.forEach(feat => {
        // Filter: Level-Check
        if (feat.level > currentLevel) return;

        // Filter: Ist es ein Klassen- oder Unterklassen-Feature?
        const isClassFeature = (feat.subclassCategoryNumber === 0);
        const isSubclassFeature = (feat.subclassCategoryNumber === userSubclassId);
        if (!isClassFeature && !isSubclassFeature) return;

        // Filter: Nur Typ 1 (Text) und 3 (Auswahl) anzeigen
        const configStr = (feat.classFeaturesCharacterSheet || "0").toString();
        const configParts = configStr.split(':');
        const type = configParts[0]; 
        const mode = configParts[1] || "";
        const target = configParts[2] || "";

        if (type !== "1" && type !== "3") return;

        // --- TEXT LADEN (STRATEGIE: EXPLIZITER KEY VOR KONSTRUKTION) ---
        let rawText = "";
        let lookupKey = "";

        // SCHRITT 1: Prüfen, ob in den Daten ein expliziter Key steht (z.B. "fightingStyleD")
        // Das ist der Standard für Fighter, Cleric etc.
        if (feat.classFeatureDescription && feat.classFeatureDescription !== 0 && feat.classFeatureDescription !== "0") {
            lookupKey = feat.classFeatureDescription;
        } 
        // SCHRITT 2: Fallback für alte Daten (z.B. Barbar), falls Feld fehlt
        else if (feat.translationLabel) {
            lookupKey = feat.translationLabel + 'D';
        }

        // SCHRITT 3: Übersetzung abrufen
        if (lookupKey && translations[currentLanguage] && translations[currentLanguage][lookupKey]) {
            rawText = translations[currentLanguage][lookupKey];
        }

        // Falls kein Text gefunden wurde -> Abbrechen (oder Debugging)
        if (!rawText) {
            // console.warn("Keine Übersetzung gefunden für Key:", lookupKey);
            return;
        }

        // LEVEL_VAL nur in der aktuellsten sichtbaren Verbesserung belassen (scope-lokal)
        const paramId = feat.levelValParameterId;
        if (paramId && paramId !== 0) {
            const scopeKey = `${feat.subclassCategoryNumber || 0}::${paramId}`;
            const latest = latestFeatByLevelValParam.get(scopeKey);
            const isLatest = latest && (
                latest === feat
                || (latest.ID != null && feat.ID != null && latest.ID === feat.ID)
            );
            if (latest && !isLatest) {
                rawText = stripFeatureLevelValTags(rawText, paramId);
            } else if (isLatest && !new RegExp(
                `\\[LEVEL_VAL\\]\\s*${String(paramId).replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}\\s*\\[\\/LEVEL_VAL\\]`,
                "i"
            ).test(rawText)) {
                // Sicherheit: Tag an der letzten Stufe wieder anfügen, falls er fehlt
                rawText = `${String(rawText).trim()}\n[LEVEL_VAL]${paramId}[/LEVEL_VAL]`;
            }
        }

        // --- PARSING & TITEL ---
        const parsedText = parseFeatureText(rawText, data, currentLevel, className, dataSource);
        
        // Titel laden (Hier ist translationLabel immer der korrekte Key)
        let title = (translations[currentLanguage] && translations[currentLanguage][feat.translationLabel]) 
                      ? translations[currentLanguage][feat.translationLabel] 
                      : feat.translationLabel;

        // --- AUTO-MARKER (Zahnrad) ---
        // Wir prüfen, ob der Typ "3" ist (Automatisch berechnet)
        const autoText = t['autoValueText'] || "Dieser Wert wird automatisch berechnet";
        if (type === "3") {
            title += `<span class="auto-marker" title="${autoText}">⚙</span>`;
        }

        const targetMap = isClassFeature ? classFeaturesMap : subclassFeaturesMap;

        // --- HTML RENDERING ---
        if (mode === "APPEND" && target && targetMap.has(target)) {
            // APPEND: Zusatzinfo an bestehenden Block anhängen
            let existingEntry = targetMap.get(target);
            existingEntry.html += `<div class="feature-append"><div class="feature-append-header">(${lblExpansion} ${feat.level})</div><div class="feature-text">${parsedText}</div></div>`;
            targetMap.set(target, existingEntry);
        } else {
            // HAUPT-ITEM
            const htmlBlock = `<div class="feature-block"><div class="feature-header"><span class="feature-title">${title}</span><span class="feature-level">${lblLevel} ${feat.level}</span></div><div class="feature-text">${parsedText}</div></div>`;
            targetMap.set(feat.translationLabel, { level: feat.level, html: htmlBlock });
        }
    });

    // --- DOM UPDATES ---
    if (document.getElementById('classFeaturesContent')) {
        let html = "";
        classFeaturesMap.forEach(val => html += val.html);
        document.getElementById('classFeaturesContent').innerHTML = html;
    }
    if (document.getElementById('subclassFeaturesContent')) {
        let html = "";
        subclassFeaturesMap.forEach(val => html += val.html);
        document.getElementById('subclassFeaturesContent').innerHTML = html;
    }
}

/* --------------------------------------------------------------------------
   HELPER FUNKTIONEN FÜR KLASSENMERKMALE
   -------------------------------------------------------------------------- */

/** LEVEL_VAL-Tags aus Merkmalstext entfernen (Doppelanzeige bei APPEND-Ketten). */
function stripFeatureLevelValTags(text, parameterId) {
    let t = String(text || "");
    if (parameterId) {
        const escaped = String(parameterId).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        // „Name: [LEVEL_VAL]id[/LEVEL_VAL]“ oder nackter Tag
        t = t.replace(
            new RegExp(`(?:^|\\n)[^\\n]*?:\\s*\\[LEVEL_VAL\\]\\s*${escaped}\\s*\\[\\/LEVEL_VAL\\]`, "gi"),
            "\n"
        );
        t = t.replace(new RegExp(`\\[LEVEL_VAL\\]\\s*${escaped}\\s*\\[\\/LEVEL_VAL\\]`, "gi"), "");
    } else {
        t = t.replace(/(?:^|\n)[^\n]*?:\s*\[LEVEL_VAL\][\s\S]*?\[\/LEVEL_VAL\]/gi, "\n");
        t = t.replace(/\[LEVEL_VAL\][\s\S]*?\[\/LEVEL_VAL\]/gi, "");
    }
    return t.replace(/\n{3,}/g, "\n\n").trim();
}

function choiceListItemMatchesSavedId(item, idField, idInt) {
    if (!item || !idField) return false;
    const raw = item[idField];
    if (raw == null) return false;
    if (Array.isArray(raw)) return raw.some(v => parseInt(v, 10) === idInt);
    return parseInt(raw, 10) === idInt;
}

/** Gespeicherte ID normalisieren (Array → erstes Element; string/number). */
function normalizeChoiceListSavedId(savedId) {
    if (savedId == null || savedId === "") return null;
    if (Array.isArray(savedId)) {
        if (!savedId.length) return null;
        return savedId[0];
    }
    return savedId;
}

function findChoiceListItemById(list, savedId, options = {}) {
    const normalized = normalizeChoiceListSavedId(savedId);
    const idInt = parseInt(normalized, 10);
    if (!list || !Array.isArray(list) || !Number.isFinite(idInt)) return null;

    const { fieldName, listName } = options;
    let idField = (fieldName && CHOICE_LIST_ID_FIELD[fieldName])
        || (listName && CHOICE_LIST_ID_FIELD_BY_LIST[listName])
        || null;

    // subclassList* ohne expliziten Map-Eintrag (Custom / neue Klassen)
    if (!idField && listName && /^subclassList/i.test(String(listName))) {
        idField = "subclassCategoryNumber";
    }

    if (idField) {
        return list.find(obj => choiceListItemMatchesSavedId(obj, idField, idInt)) || null;
    }

    // Fallback: id/ID, sonst *CategoryNumber / *Number (ohne Object.values-Kollisionen)
    const byId = list.find(obj => obj.id == idInt || obj.ID == idInt);
    if (byId) return byId;

    return list.find(obj => {
        if (!obj || typeof obj !== "object") return false;
        return Object.keys(obj).some(k => {
            if (!/(CategoryNumber|Option)$/i.test(k) && !/(^|[^a-z])Number$/i.test(k)) return false;
            if (k === "subclassCategoryNumber" && listName && !/^subclassList/i.test(String(listName))) {
                // Auf Klassenmerkmal-Zeilen oft 0 — nicht als Auswahl-ID missbrauchen
                return false;
            }
            return choiceListItemMatchesSavedId(obj, k, idInt);
        });
    }) || null;
}

// 1. Grundfunktion: Pfad im Objekt finden
function getValueByPath(obj, path) {
    if (!path || !obj) return undefined;
    const keys = path.split('.');
    let current = obj;
    for (let i = 0; i < keys.length; i++) {
        if (current === undefined || current === null) return undefined;
        current = current[keys[i]];
    }
    return current;
}

// 2. Parser
function parseFeatureText(text, data, level, className, dataSource) {
    if (!text) return "";
    
    // Level-Werte
    text = text.replace(/\[LEVEL_VAL\](.*?)\[\/LEVEL_VAL\]/g, (m, k) => getDynamicLevelValue(k.trim(), level, dataSource));
    
    // Einfache Auswahl
    text = text.replace(/\[CHOICE\](.*?)\[\/CHOICE\]/g, (m, k) => getSingleChoiceName(k.trim(), data, className));
    
    // Listen von Auswahlen
    text = text.replace(/\[CHOICE_LIST\](.*?)\[\/CHOICE_LIST\]/g, (m, k) => {
        const raw = String(k || "").trim();
        // Custom Freiwahlen: classForm.freeChoices oder classForm.freeChoices:familyId
        if (/^classForm\.freeChoices(?::|$)/i.test(raw)) {
            const familyId = raw.includes(":") ? raw.split(":").slice(1).join(":").trim() : "";
            return getCustomFreeChoiceListHTML(data, familyId);
        }
        // Zauber nach Quelle (wie Talente: preparedSpells.source.name.<featureLabel>)
        if (raw.includes("source.name") && typeof getFeatSpellListBySourceHTML === "function") {
            return getFeatSpellListBySourceHTML(raw, data);
        }
        return getChoiceListHTML(raw, data);
    });

    // Komplexer Daten-Lookup
    text = text.replace(/\[DATA\](.*?)\[\/DATA\]/g, (m, k) => getDataLookupValue(k.trim(), data));
    
    // Waffen-Meisterschaften
    text = text.replace(/\[MASTERY_LIST\](.*?)\[\/MASTERY_LIST\]/g, (m, k) => getWeaponMasteryListHTML(k.trim(), data));

    // Beschwörungen (Summon)
    text = text.replace(/\[SUMMON\](.*?)\[\/SUMMON\]/g, (m, k) => getSummonName(k.trim()));
    
    return text;
}

// 4. Intelligente Namensauflösung (Repariert: Nutzt getListByName)
function getSingleChoiceName(keyPath, globalData, className) {
    let val = getValueByPath(globalData, keyPath);
    
    // Sicherheitscheck: undefined/null/empty -> "-"
    if (val === undefined || val === null || val === "") return "-";

    // Arrays (z. B. classForm.primalOrders: ["1"]) — jedes Element auflösen
    if (Array.isArray(val)) {
        if (!val.length) return "-";
        return val.map(v => getSingleChoiceNameResolved(keyPath, v, className)).join(", ");
    }

    return getSingleChoiceNameResolved(keyPath, val, className);
}

function getSingleChoiceNameResolved(keyPath, val, className) {
    // Wenn es KEINE Zahl ist, ist es Text -> Übersetzen
    if (isNaN(val)) {
        return (translations[currentLanguage] && translations[currentLanguage][val]) ? translations[currentLanguage][val] : val;
    }

    // Pfad zerlegen, um Feldnamen zu finden
    const pathParts = keyPath.split('.');
    const fieldName = pathParts[pathParts.length - 1]; // z.B. "lands" oder "elementalFuries"
    
    let listName = FIELD_TO_LIST_MAP[fieldName];

    // Spezialfall: Unterklassen
    if (fieldName === 'subclass' && className) {
        const capClass = className.charAt(0).toUpperCase() + className.slice(1).toLowerCase().trim();
        listName = `subclassList${capClass}`;
    }

    // Liste holen
    let list = getListByName(listName);

    // Custom-Class: Unterklassen aus Runtime
    if ((!list || !Array.isArray(list)) && fieldName === 'subclass' && typeof getSheetCustomSubclassList === "function") {
        list = getSheetCustomSubclassList(className);
    }

    if (list && Array.isArray(list)) {
        const foundItem = findChoiceListItemById(list, val, { fieldName, listName });
        
        if (foundItem) {
            let labelKey = foundItem.translationLabel || foundItem.label;

            // Fallback Suche nach Keys mit 'Label'
            if (!labelKey) {
                const potentialKey = Object.keys(foundItem).find(k => k.toLowerCase().includes('label') && !k.includes('DLabel')); 
                if (potentialKey) labelKey = foundItem[potentialKey];
            }

            // Übersetzen
            if (labelKey && translations[currentLanguage] && translations[currentLanguage][labelKey]) {
                return translations[currentLanguage][labelKey];
            }
            return labelKey || val; 
        }
    }

    return val; 
}

// 5. Gezielter Daten-Abruf (Repariert: Nutzt getListByName)
function getDataLookupValue(keyString, globalData) {
    const parts = keyString.split(':');
    let savedId = getValueByPath(globalData, parts[0]);
    
    if (savedId === undefined || savedId === null || savedId === "") return "-";
    if (parts.length < 3) {
        if (Array.isArray(savedId)) return savedId.join(", ");
        return savedId;
    }

    const listName = parts[1].trim();     
    const targetProp = parts[2].trim();    

    // Liste holen
    const list = getListByName(listName);

    if (!list || !Array.isArray(list)) return "-";

    const resolveOne = (id) => {
        const foundItem = findChoiceListItemById(list, id, { listName });
        if (!foundItem) return "-";

        let resultValue = foundItem[targetProp];

        // Übersetzen wenn der Wert selbst ein Key ist
        if (resultValue && typeof resultValue === 'string') {
            if (translations[currentLanguage] && translations[currentLanguage][resultValue]) {
                return translations[currentLanguage][resultValue];
            }
        }

        return resultValue !== undefined ? resultValue : "-";
    };

    if (Array.isArray(savedId)) {
        if (!savedId.length) return "-";
        return savedId.map(resolveOne).join(", ");
    }

    return resolveOne(savedId);
}

// 6. Generische Listen-Anzeige (Für Manöver etc.)
function getChoiceListHTML(keyPath, data) {
    let val = getValueByPath(data, keyPath);
    if (!val || !Array.isArray(val) || val.length === 0) return "<i>Keine.</i>";

    const pathParts = keyPath.split('.');
    const fieldName = pathParts[pathParts.length - 1]; 
    const listName = CHOICE_LIST_MAP[fieldName];
    
    const list = getListByName(listName);
    if (!list) return "-";

    let html = "<ul class='compact-list'>";
    
    val.forEach(savedId => {
        const item = findChoiceListItemById(list, savedId, { fieldName, listName });
        
        if (item) {
            const labelKey = item.translationLabel || item.label;
            const title = (translations[currentLanguage] && translations[currentLanguage][labelKey]) 
                          ? translations[currentLanguage][labelKey] 
                          : labelKey;
            
            // Beschreibung suchen
            let descKey = item.maneuverDLabel || item.metamagicOptionD || item.eldritchInvocationOptionD;
            
            if (!descKey && labelKey) {
                if (translations[currentLanguage] && translations[currentLanguage][labelKey + "D"]) {
                    descKey = labelKey + "D";
                }
            }
            
            const desc = (translations[currentLanguage] && translations[currentLanguage][descKey]) 
                         ? translations[currentLanguage][descKey] 
                         : "";

            if (desc) {
                 html += `<li><b>${title}:</b> ${desc}</li>`;
            } else {
                 html += `<li><b>${title}</b></li>`;
            }
        }
    });

    return html + "</ul>";
}

/**
 * Custom-Class Freiwahlen aus classForm.freeChoices auflösen.
 * familyId filtert auf eine Merkmalsfamilie (Meisterschafts-Muster).
 */
function getCustomFreeChoiceListHTML(data, familyId) {
    const vals = data?.classForm?.freeChoices;
    if (!vals || !Array.isArray(vals) || vals.length === 0) return "<i>Keine.</i>";

    const className = data?.basic?.class;
    const classData = (typeof getClassDataArray === "function") ? getClassDataArray(className) : null;
    const optMap = new Map();
    const collectOpts = (rows) => {
        (rows || []).forEach(row => {
            (row.freeChoiceOptions || []).forEach(opt => {
                if (!opt || opt.value == null) return;
                const v = String(opt.value);
                if (familyId && !v.startsWith(`${familyId}__`)) return;
                optMap.set(v, opt);
            });
        });
    };
    collectOpts(classData || []);
    // Custom-Talente (Talentbibliothek) speichern freeChoiceOptions am Feat
    if (typeof featList !== "undefined" && Array.isArray(featList)) {
        collectOpts(featList.filter(f => f && f.isCustom && f.freeChoiceOptions));
    }

    const filtered = familyId
        ? vals.filter(v => String(v).startsWith(`${familyId}__`))
        : vals;

    if (!filtered.length) return "<i>Keine.</i>";

    let html = "<ul class='compact-list'>";
    const seen = new Set();
    filtered.forEach(rawVal => {
        const v = String(rawVal);
        if (seen.has(v)) return;
        seen.add(v);
        const opt = optMap.get(v);
        const labelKey = opt?.translationLabel || v;
        const title = (translations[currentLanguage] && translations[currentLanguage][labelKey])
            ? translations[currentLanguage][labelKey]
            : labelKey;
        const descKey = opt?.descriptionLabel && opt.descriptionLabel !== 0
            ? opt.descriptionLabel
            : (labelKey ? `${labelKey}D` : "");
        const desc = (descKey && translations[currentLanguage] && translations[currentLanguage][descKey])
            ? translations[currentLanguage][descKey]
            : "";
        if (desc) html += `<li><b>${title}:</b> ${desc}</li>`;
        else html += `<li><b>${title}</b></li>`;
    });
    return html + "</ul>";
}

// 7. Waffen-Meisterschaften
function getWeaponMasteryListHTML(keyPath, data) {
    let val = getValueByPath(data, keyPath);

    if (!val || !Array.isArray(val)) return "<i>Keine.</i>";
    if (typeof weaponList === 'undefined' || typeof weaponMastery === 'undefined') return "-";

    const uniqueIds = new Set();
    let html = "<ul class='compact-list'>";
    
    val.forEach(wId => {
        const w = weaponList.find(x => x.ID === parseInt(wId));
        if (w && w.weaponMasteryCategoryNumber && !uniqueIds.has(w.weaponMasteryCategoryNumber)) {
            uniqueIds.add(w.weaponMasteryCategoryNumber);
            const m = weaponMastery.find(x => x.weaponMasteryCategoryNumber === w.weaponMasteryCategoryNumber);
            if (m) {
                const t = (translations[currentLanguage] && translations[currentLanguage][m.translationLabel]) 
                          ? translations[currentLanguage][m.translationLabel] 
                          : m.translationLabel;
                
                const descKey = m.weaponMasteryDLabel || (m.translationLabel + "D");
                const d = (translations[currentLanguage] && translations[currentLanguage][descKey]) 
                          ? translations[currentLanguage][descKey] 
                          : "";
                
                html += `<li><b>${t}:</b> ${d}</li>`;
            }
        }
    });
    return html + "</ul>";
}

// 8. Dynamische Level-Werte
function getDynamicLevelValue(key, level, dataSource) {
    if (!dataSource || !Array.isArray(dataSource) || !key) return "-";
    const lvl = parseInt(level, 10) || 1;

    // PHB: oft jede Stufe eine Zeile. Custom: Lücken → höchste Stufe ≤ aktuelles Level mit gesetztem Key
    let bestVal = undefined;
    let bestLevel = -1;
    for (let i = 0; i < dataSource.length; i++) {
        const r = dataSource[i];
        if (!r || r.level > lvl) continue;
        if (!Object.prototype.hasOwnProperty.call(r, key)) continue;
        const v = r[key];
        // Sentinel 0 / leer = nicht gesetzt (echte Werte: Zahlen > 0, "+2", "D6", …)
        if (v === undefined || v === null || v === "" || v === 0) continue;
        if (Array.isArray(v) && v.length === 0) continue;
        if (r.level >= bestLevel) {
            bestLevel = r.level;
            bestVal = v;
        }
    }
    if (bestVal === undefined) return "-";

    // Zauberlisten der Stufe (Custom Class / Custom UC): ["wizard","druid"] → "Magier, Druide"
    if (key === "spellListLabels" && Array.isArray(bestVal)) {
        const lang = (typeof currentLanguage !== "undefined" && currentLanguage)
            || (typeof currentLang !== "undefined" && currentLang)
            || "de";
        const els = (typeof translations !== "undefined" && translations[lang]) || {};
        const names = bestVal.filter(Boolean).map(lab => {
            const keyStr = String(lab);
            return els[keyStr] || els[`${keyStr}Label`] || keyStr;
        }).filter(Boolean);
        return names.length ? names.join(", ") : "-";
    }

    // Fuß-Felder (_ft): bei DE in Meter umrechnen (wie Infobox Mönch)
    if (/_ft$/i.test(key) && (typeof currentLanguage !== "undefined" ? currentLanguage : "de") === "de") {
        const feet = parseFloat(bestVal);
        if (Number.isFinite(feet)) {
            return Math.round(feet * 0.3048);
        }
    }
    return bestVal;
}
