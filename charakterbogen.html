/**
 * True, wenn die Klasse (PHB oder Custom) Unarmored Defense freigeschaltet hat.
 * Ersetzt die alte Hardcode-Prüfung "Barbarian"/"Monk" (Slug war ohnehin lowercase).
 */
function classHasUnarmoredDefenseFeature(className, level, subclassId) {
    const dataSource = (typeof getClassDataArray === "function")
        ? getClassDataArray(className)
        : null;
    if (!dataSource || !Array.isArray(dataSource)) return false;

    const udLabels = new Set(["unarmoredDefense", "unarmoredDefenseLabel", "customUnarmoredDefense"]);
    const currentLevel = Number(level) || 1;
    const userSubclassId = parseInt(subclassId, 10) || 0;

    return dataSource.some(feat => {
        if (!feat || !udLabels.has(feat.translationLabel)) return false;
        if ((Number(feat.level) || 1) > currentLevel) return false;
        const featSc = feat.subclassCategoryNumber || 0;
        if (featSc > 0 && featSc !== userSubclassId) return false;
        return true;
    });
}

// 10. Beschwörungs-Namen auflösen (Einfache Übersetzung)
function getSummonName(key) {
    // Der Key im Text ist z.B. "beastOfTheLand", das Label ist "beastOfTheLandLabel"
    const labelKey = key + "Label";
    let text = key;

    // Übersetzung suchen
    if (translations[currentLanguage] && translations[currentLanguage][labelKey]) {
        text = translations[currentLanguage][labelKey];
    }

    // Formatierung: Punkt + Fett
    return `• <b>${text}</b>`;
}

/* --- Merkmale mit Einfluss auf Werte --- */

function applyClassFeatureLogic(charData) {
    const levelInput = document.getElementById('level');
    const currentLevel = levelInput ? parseInt(levelInput.value, 10) : 1;

    // Aktuelle Unterklassen-ID aus dem charData Objekt holen
    const userSubclassId = charData.classForm && charData.classForm.subclass 
                           ? parseInt(charData.classForm.subclass, 10) 
                           : 0;

    window.classFeatureAC = 0; 
    window.activeExpertiseIDs = [];
    window.speedBonusClass = 0;
    window.hasMartialArts = false;
    window.hasJackOfAllTrades = false;
    window.charismaCheckBonus = 0;

    // Basis-Speed (Spezies)
    let baseSpeedFT = 30;
    if (typeof speciesList !== 'undefined') {
        const sData = (typeof findSpeciesBySelectionValue === "function")
            ? findSpeciesBySelectionValue(charData.basic.species || "")
            : speciesList.find(s => s.translationLabel === ((charData.basic.species || "").toLowerCase() + "Label"));
        if (sData) baseSpeedFT = sData.speedFT;
    }

    let computedStats = {
        strength: parseInt(document.getElementById('strengthScore').value) || 10,
        dexterity: parseInt(document.getElementById('dexterityScore').value) || 10,
        constitution: parseInt(document.getElementById('constitutionScore').value) || 10,
        intelligence: parseInt(document.getElementById('intelligenceScore').value) || 10,
        wisdom: parseInt(document.getElementById('wisdomScore').value) || 10,
        charisma: parseInt(document.getElementById('charismaScore').value) || 10,
        computedAC: 0,
        expertiseSkillIDs: [],
        additionalProficiencies: { armor: [], weapon: [] },
        additionalWeaponProperties: [],
        additionalLanguages: [],
        bonusSpeedFT: 0,
        charismaCheckBonus: 0,
        hasJackOfAllTrades: false,
        grantAllSavingThrows: false
    };

    const className = charData.basic.class; 
    const dataSource = getClassDataArray(className); 

    if (dataSource) {
        dataSource.forEach(feat => {
            // --- DER FILTER-BLOCK ---
            // 1. Level-Check
            if (feat.level > currentLevel) return;

            // 2. Unterklassen-Check
            // subclassCategoryNumber 0 bedeutet Basisklasse (alle bekommen es)
            // Wenn > 0, muss es exakt mit der Wahl des Users übereinstimmen
            const isBaseClassFeat = (feat.subclassCategoryNumber === 0 || !feat.subclassCategoryNumber);
            const isMySubclassFeat = (feat.subclassCategoryNumber === userSubclassId);

            if (isBaseClassFeat || isMySubclassFeat) {
                if (typeof featureHandlers !== 'undefined' && featureHandlers[feat.translationLabel]) {
                    charData.basic.level = currentLevel; 
                    // Drittes Argument: Merkmalszeile (für Custom-Class Grants mit Get_*)
                    featureHandlers[feat.translationLabel](charData, computedStats, feat);
                }
            }
        });
    }

    // Speed - Wert global speichern
    window.speedBonusClass = computedStats.bonusSpeedFT;

    // Sprachen global speichern
    window.additionalClassLanguages = computedStats.additionalLanguages || [];

    if (computedStats.computedAC > 0) window.classFeatureAC = computedStats.computedAC;
    window.activeExpertiseIDs = computedStats.expertiseSkillIDs;
    window.hasJackOfAllTrades = !!computedStats.hasJackOfAllTrades;
    window.charismaCheckBonus = computedStats.charismaCheckBonus || 0;

    // Disciplined Survivor: alle Rettungswürfe als geübt markieren
    if (computedStats.grantAllSavingThrows) {
        ['strength', 'dexterity', 'constitution', 'intelligence', 'wisdom', 'charisma'].forEach(attr => {
            const cb = document.getElementById(`${attr}SavingTrained`);
            if (cb) cb.checked = true;
        });
    }

    if (computedStats.additionalProficiencies.armor.length > 0) setProficiencies(computedStats.additionalProficiencies.armor, 'armor');
    if (computedStats.additionalProficiencies.weapon.length > 0) setProficiencies(computedStats.additionalProficiencies.weapon, 'weapon');
    if (computedStats.additionalWeaponProperties && computedStats.additionalWeaponProperties.length > 0) {
        mergeAdditionalWeaponProperties(computedStats.additionalWeaponProperties);
    }

    calculateFinalSpeed();
    updateArmorClass();
    updateSavingThrowValues();
    updateSkillValues();
}

/* --------------------------------------------------------------------------
   3 g. Talente
   -------------------------------------------------------------------------- */
function processFeats(data) {
    console.log("Verarbeite Talente...");

    const tGlobal = translations[currentLanguage] || {};
    const autoText = tGlobal['autoValueText'] || "Dieser Wert wird automatisch berechnet";

    const featsContainer = document.getElementById('featsContent');
    if (!featsContainer) return;
    featsContainer.innerHTML = ""; // Container leeren

    // 1. Alle Talent-IDs sammeln (Reihenfolge: Hintergrund -> Spezies -> Klasse)
    const collectedFeatIDs = new Set();
    const orderedFeats = [];

    // A. Hintergrund
    if (data.feats.background) {
        if (!collectedFeatIDs.has(data.feats.background)) {
            collectedFeatIDs.add(data.feats.background);
            orderedFeats.push({ id: data.feats.background, source: 'background' });
        }
    }

    // B. Spezies (alle Herkunftstalente)
    const speciesFeatIds = Array.isArray(data.feats.species)
        ? data.feats.species
        : (data.feats.species ? [data.feats.species] : []);
    speciesFeatIds.forEach(featIdRaw => {
        const fId = parseInt(featIdRaw, 10);
        if (!fId || collectedFeatIDs.has(fId)) return;
        collectedFeatIDs.add(fId);
        orderedFeats.push({ id: fId, source: 'species' });
    });

    // C. Klasse
    if (data.classForm && data.classForm.feats && Array.isArray(data.classForm.feats)) {
        data.classForm.feats.forEach(item => {
            const fId = parseInt(item.feat, 10);
            if (fId && !collectedFeatIDs.has(fId)) {
                collectedFeatIDs.add(fId);
                orderedFeats.push({ id: fId, source: 'class' });
            }
        });
    }

    // 2. Checks für erweiterte Syntax (EXPERT_CHECK, MASTERY_CHECK) vorbereiten
    const className = data.basic.class;
    const currentLevel = parseInt(data.basic.level, 10) || 1;
    const subclassId = parseInt(data.classForm.subclass, 10) || 0;
    
    // Klassendaten laden
    const classDataSource = getClassDataArray(className); 
    
    let classHasExpertise = false;
    let classHasMastery = false;

    if (classDataSource) {
        classDataSource.forEach(feature => {
            // Filter: Level & Subklasse
            if (feature.level > currentLevel) return;
            const isBase = (feature.subclassCategoryNumber === 0 || !feature.subclassCategoryNumber);
            const isSub = (feature.subclassCategoryNumber === subclassId);
            
            if (isBase || isSub) {
                if (feature.classFeatureDescription === "expertiseD" || feature.classFeatureDescription === "expertiseDLabel") {
                    classHasExpertise = true;
                }
                if (feature.classFeatureDescription === "weaponMasteryD" || feature.classFeatureDescription === "weaponMasteryDLabel") {
                    classHasMastery = true;
                }
            }
        });
    }

    let appendExpertiseList = false;
    let htmlContent = "";

    /** true = Talent mit Fertigkeit/Expertise-Radio hat Expertise-Zweig gewählt (Scharfsinnig, Aufmerksam, Fertigkeitsexperte). */
    const didFeatChooseExpertiseBranch = (featId) => {
        const entry = (data.classForm?.feats || []).find(
            f => parseInt(f.feat, 10) === featId
        );
        if (!entry || !Array.isArray(entry.dynamicChoices)) return false;
        const lvl = parseInt(entry.level, 10);
        if (!lvl) return false;
        const expertiseRadioId = `expertiseRadio${lvl}_expert`;
        return entry.dynamicChoices.some(
            c => c.id === expertiseRadioId && String(c.value) === "expertise"
        );
    };

    /** Talente mit Radio Fertigkeit ↔ Expertise (nicht z. B. Gabe des Geschicks). */
    const FEAT_LABELS_EXPERT_BRANCH = new Set([
        "keenMindLabel",
        "observantLabel",
        "skillExpertLabel"
    ]);

    // 3. Rendering-Schleife
    orderedFeats.forEach(item => {
        const featData = featList.find(f => f.ID === item.id);
        if (!featData) return;

        let status = featData.characterSheet; 
        let showDescription = false;

        // Erweiterte Syntax parsen
        if (typeof status === 'string' && status.includes(':')) {
            const parts = status.split(':');
            const baseStatus = parseInt(parts[0], 10);
            const operator = parts[1];

            if (operator === "EXPERT_CHECK") {
                const isExpertBranchFeat = FEAT_LABELS_EXPERT_BRANCH.has(featData.translationLabel);
                const choseExpertise = didFeatChooseExpertiseBranch(item.id);
                if (classHasExpertise) {
                    status = baseStatus;
                } else if (isExpertBranchFeat) {
                    if (choseExpertise) {
                        status = baseStatus;
                        appendExpertiseList = true;
                    } else {
                        // Fertigkeits-Zweig: Talent-Blurb anzeigen, kein leerer Expertise-Block
                        status = baseStatus === 0 ? 1 : baseStatus;
                    }
                } else {
                    // z. B. Gabe des Geschicks: Expertise-Liste ohne Radio-Zweig
                    status = baseStatus;
                    appendExpertiseList = true;
                }
            } 
            else if (operator === "MASTERY_CHECK") {
                if (classHasMastery) {
                    status = 0; // Verstecken, da Klasse es schon zeigt
                } else {
                    status = baseStatus;
                }
            }
        }

        // Status 1 und 3 bedeuten: Beschreibung anzeigen
        if (status === 1 || status === 3) {
            showDescription = true;
        }

        if (showDescription) {
            const t = translations[currentLanguage];
            let title = t[featData.translationLabel] || featData.translationLabel;
            
            // --- NEU: AUTO-MARKER (Zahnrad) ---
            // Wir prüfen direkt auf den Originalwert in der Datenbank, 
            // da die Variable 'status' oben evtl. verändert wurde.
            if (featData.characterSheet === 3) {
                title += `<span class="auto-marker" title="${autoText}">⚙</span>`;
            }

            // Custom-Talent-Marker (nicht bei EXPERT_CHECK / MASTERY_CHECK – die nutzen Expertise-/Meisterschafts-Anzeige)
            const sheetFlag = featData.characterSheet;
            const isExpertOrMasteryFlag = typeof sheetFlag === "string"
                && (sheetFlag.includes("EXPERT_CHECK") || sheetFlag.includes("MASTERY_CHECK"));
            if (!isExpertOrMasteryFlag
                && typeof isCustomContentFeat === "function"
                && isCustomContentFeat(featData)
                && typeof getCustomContentMarkerHtml === "function") {
                title += getCustomContentMarkerHtml();
            }

            let descKey = featData.featD_sheet; 
            if (!descKey || descKey === 0) descKey = featData.featDLabel;

            let rawText = t[descKey] || "";
            
            // TAGS Parsen
            const parsedText = parseFeatDescription(rawText, data);

            htmlContent += `
                <div class="feature-block">
                    <div class="feature-header">
                        <span class="feature-title">${title}</span>
                    </div>
                    <div class="feature-text">${parsedText}</div>
                </div>
            `;
        }
    });

    // 4. Expertise Liste anhängen (falls nötig)
    if (appendExpertiseList) {
        const t = translations[currentLanguage];
        
        // WICHTIG: 'let' verwenden, damit wir das Zahnrad anhängen können
        let title = t["expertiseLabel"] || "Expertise";
        
        // --- NEU: ZAHNRAD HINZUFÜGEN ---
        title += `<span class="auto-marker" title="${autoText}">⚙</span>`;
        // -------------------------------

        const rawText = t["expertiseD"] || "[CHOICE_LIST]classForm.expertise[/CHOICE_LIST]"; 
        
        const parsedText = parseFeatDescription(rawText, data);

        htmlContent += `
            <div class="feature-block">
                <div class="feature-header">
                    <span class="feature-title">${title}</span>
                </div>
                <div class="feature-text">${parsedText}</div>
            </div>
        `;
    }

    featsContainer.innerHTML = htmlContent;
}

/* --------------------------------------------------------------------------
   HELPER FUNKTIONEN FÜR TALENTE (FEATS)
   -------------------------------------------------------------------------- */

// 1. Haupt-Parser für Talent-Beschreibungen
function parseFeatDescription(text, data) {
    if (!text) return "";

    // A. Einfache Auswahl: [CHOICE]...[/CHOICE]
    text = text.replace(/\[CHOICE\](.*?)\[\/CHOICE\]/g, (m, path) => {
        return getFeatSingleChoiceName(path.trim(), data);
    });

    // B. Listen (Typ A und Typ B): [CHOICE_LIST]...[/CHOICE_LIST]
    text = text.replace(/\[CHOICE_LIST\](.*?)\[\/CHOICE_LIST\]/g, (m, path) => {
        return getFeatChoiceListHTML(path.trim(), data);
    });

    // C. Waffenmeisterschaften: [MASTERY_LIST]...[/MASTERY_LIST]
    text = text.replace(/\[MASTERY_LIST\](.*?)\[\/MASTERY_LIST\]/g, (m, path) => {
        return getFeatMasteryListHTML(path.trim(), data);
    });

    return text;
}

// 2. Helper: Einzelne Auswahl auflösen ([CHOICE])
function getFeatSingleChoiceName(keyPath, data) {
    let val = getFeatValueByPath(data, keyPath);
    
    if (val === undefined || val === null || val === "") return "-";

    // Falls Array: Rekursiv für jedes Element aufrufen und mit Komma verbinden
    if (Array.isArray(val)) {
        return val.map(v => resolveSingleValue(keyPath, v)).join(", ");
    }

    // Einzelwert
    return resolveSingleValue(keyPath, val);
}

// Innere Funktion für die eigentliche Übersetzung eines einzelnen Wertes
function resolveSingleValue(keyPath, val) {
    // A. Ist es Text? (z.B. "strengthLabel") -> Direkt übersetzen
    if (isNaN(val)) {
        return (translations[currentLanguage] && translations[currentLanguage][val]) 
               ? translations[currentLanguage][val] 
               : val;
    }

    // B. Liste identifizieren
    const fieldName = keyPath.split('.').pop(); // Letztes Element (z.B. "attributes")
    const listName = FIELD_TO_LIST_MAP[fieldName];

    if (!listName) return val;

    // C. Liste abrufen
    // Wir nutzen bevorzugt getListByName. Nur wenn das fehlschlägt (null), 
    // prüfen wir direkt auf attributeList, da diese eine 'const' Variable ist.
    let list = (typeof getListByName === 'function') ? getListByName(listName) : null;

    if (!list && listName === 'attributeList' && typeof attributeList !== 'undefined') {
        list = attributeList;
    }

    // D. Item suchen & Label zurückgeben (gleiche ID-Semantik wie Klassenmerkmale)
    if (list && Array.isArray(list)) {
        const foundItem = (typeof findChoiceListItemById === "function")
            ? findChoiceListItemById(list, val, { fieldName, listName })
            : list.find(item => (item.ID == val || item.id == val));
        
        if (foundItem) {
            const labelKey = foundItem.translationLabel || foundItem.label;
            
            // Wenn Übersetzung da ist -> Fettgedruckt zurückgeben
            if (labelKey && translations[currentLanguage] && translations[currentLanguage][labelKey]) {
                return `<b>${translations[currentLanguage][labelKey]}</b>`; 
            }
            return labelKey || val; 
        }
    }

    return val;
}

// 3. Helper: Listen auflösen ([CHOICE_LIST]) - Typ A & Typ B
function getFeatChoiceListHTML(path, data) {
    const raw = String(path || "").trim();
    // Custom Freiwahlen (Talent/Klasse): classForm.freeChoices oder classForm.freeChoices:familyId
    if (/^classForm\.freeChoices(?::|$)/i.test(raw)) {
        const familyId = raw.includes(":") ? raw.split(":").slice(1).join(":").trim() : "";
        return getCustomFreeChoiceListHTML(data, familyId);
    }

    // --- TYP B: SPEZIFISCHE ZAUBER-QUELLE ---
    if (path.includes('source.name')) {
        return getFeatSpellListBySourceHTML(path, data);
    }

    // --- TYP A: STANDARD LISTE ---
    let val = getFeatValueByPath(data, path);
    if (!val || !Array.isArray(val) || val.length === 0) return "<i>Keine.</i>";

    const pathParts = path.split('.');
    const fieldName = pathParts[pathParts.length - 1]; 
    
    let listName = CHOICE_LIST_MAP[fieldName];
    
    // Erweiterungen für Talente
    if (fieldName === 'spellLists') listName = 'classCoreTraitsList'; 
    if (fieldName === 'spellcastingAbilities') listName = 'attributeList';
    if (fieldName === 'energyMasteries') listName = 'energyMasteryCategoryList'; 
    if (fieldName === 'damageType_Boon') listName = 'damageType_All'; 

    let list = null;
    if (listName === 'classCoreTraitsList') list = classCoreTraitsList;
    else if (listName === 'attributeList') list = attributeList;
    else if (listName === 'energyMasteryCategoryList') list = energyMasteryCategoryList;
    else list = getListByName(listName);

    if (!list) return "-";

    let html = "<ul class='compact-list'>";
    val.forEach(savedId => {
        const item = findChoiceListItemById(list, savedId, { fieldName, listName });
        
        if (item) {
            const labelKey = item.translationLabel || item.label;
            const title = (translations[currentLanguage] && translations[currentLanguage][labelKey]) 
                          ? translations[currentLanguage][labelKey] 
                          : labelKey;
            
            // --- ÄNDERUNG: Jetzt mit <b> Tags für Fettdruck ---
            html += `<li><b>${title}</b></li>`;
        }
    });
    return html + "</ul>";
}

// 4. Helper für Typ B: Zauber anhand der Source finden
function getFeatSpellListBySourceHTML(path, data) {
    const parts = path.split('.');
    const arrayName = parts[0]; // z.B. "preparedSpells" oder "cantrips"
    const targetLabel = parts[parts.length - 1]; // z.B. "magicInitiateLabel" oder "mysticArcanumLabel,mysticArcanum2Label"
    const targetLabels = String(targetLabel || "")
        .split(",")
        .map(s => s.trim())
        .filter(Boolean);

    // 1. Zieldaten-Array dynamisch anhand des Tags auswählen
    let spellArray = [];
    if (arrayName === 'preparedSpells') spellArray = data.spells.prepared || [];
    else if (arrayName === 'cantrips') spellArray = data.spells.cantrips || [];
    else if (arrayName === 'spellbookSpells') spellArray = data.spells.spellbook || [];
    else if (arrayName === 'favoredSpells') spellArray = data.spells.favored || [];
    
    // 2. Filterung WIRKLICH nur auf dem Array anwenden, das vom Tag verlangt wurde!
    const foundSpells = spellArray.filter(entry => {
        return entry.source && targetLabels.includes(entry.source.name);
    });

    // 3. Duplikate herausfiltern, aber das Objekt behalten, um an "spellList" heranzukommen
    const uniqueEntries = [];
    const seenIds = new Set();
    foundSpells.forEach(entry => {
        if (!seenIds.has(entry.spellId)) {
            seenIds.add(entry.spellId);
            uniqueEntries.push(entry);
        }
    });

    if (uniqueEntries.length === 0) return "<i>Keine.</i>";

    let html = "<ul class='compact-list'>";
    uniqueEntries.forEach(entry => {
        if (typeof spellList !== 'undefined' || typeof findSheetSpellById === "function") {
            const spell = (typeof findSheetSpellById === "function")
                ? findSheetSpellById(entry.spellId)
                : spellList.find(s => s.ID === entry.spellId);
            if (spell) {
                // Name des Zaubers übersetzen
                const name = (translations[currentLanguage] && translations[currentLanguage][spell.translationLabel]) 
                             ? translations[currentLanguage][spell.translationLabel] 
                             : spell.translationLabel;

                // 4. Klassen-Zuordnung aus den Daten auslesen (z.B. spellList: 'druid')
                let classSuffix = "";
                if (entry.source && entry.source.spellList) {
                    const rawClass = entry.source.spellList; // "druid", "wizard", etc.
                    
                    // Wir versuchen die Übersetzung direkt ("druid") oder mit Fallback ("druidLabel")
                    let translatedClass = (translations[currentLanguage] && translations[currentLanguage][rawClass]) 
                                          ? translations[currentLanguage][rawClass] 
                                          : (translations[currentLanguage] && translations[currentLanguage][rawClass + "Label"])
                                            ? translations[currentLanguage][rawClass + "Label"]
                                            : rawClass;
                    
                    // Fallback: Ersten Buchstaben groß machen
                    if (translatedClass === rawClass) {
                        translatedClass = translatedClass.charAt(0).toUpperCase() + translatedClass.slice(1);
                    }
                    
                    classSuffix = ` (${translatedClass})`;
                }

                // Name nun in fett und danach der Zusatz (z.B. "Kältestrahl (Druide)")
                const markerHtml = (typeof isCustomContentSpell === "function" && isCustomContentSpell(spell)
                    && typeof getCustomContentMarkerHtml === "function")
                    ? getCustomContentMarkerHtml()
                    : "";
                html += `<li><b>${name}</b>${markerHtml}${classSuffix}</li>`;
            }
        }
    });
    return html + "</ul>";
}

// 5. Helper: Waffenmeisterschaften ([MASTERY_LIST])
function getFeatMasteryListHTML(path, data) {
    let val = getFeatValueByPath(data, path); // Array von Waffen-IDs

    if (!val || !Array.isArray(val)) return "<i>Keine.</i>";
    if (typeof weaponList === 'undefined' || typeof weaponMastery === 'undefined') return "-";

    const uniqueMasteryIds = new Set();
    let html = "<ul class='compact-list'>";
    
    val.forEach(wId => {
        const w = weaponList.find(x => x.ID === parseInt(wId));
        
        if (w && w.weaponMasteryCategoryNumber) {
            // Wir listen jede Meisterschafts-ART nur einmal auf (Unique Check)
            // Wenn man Dolch (Vex) und Handarmbrust (Vex) hat, wird "Vex" nur einmal erklärt.
            if (!uniqueMasteryIds.has(w.weaponMasteryCategoryNumber)) {
                uniqueMasteryIds.add(w.weaponMasteryCategoryNumber);
                
                const m = weaponMastery.find(x => x.weaponMasteryCategoryNumber === w.weaponMasteryCategoryNumber);
                if (m) {
                    const mName = (translations[currentLanguage] && translations[currentLanguage][m.translationLabel]) 
                                  ? translations[currentLanguage][m.translationLabel] 
                                  : m.translationLabel;
                    
                    // Beschreibungsschlüssel ermitteln
                    // Prio 1: Explizites Label in den Daten
                    // Prio 2: "vexD" (Label ohne 'Label' + 'D')
                    // Prio 3: "vexLabelD" (Label + 'D')
                    let descKey = m.weaponMasteryDLabel;
                    
                    if (!descKey || !translations[currentLanguage][descKey]) {
                        const shortKey = m.translationLabel.replace('Label', 'D'); // z.B. vexD
                        if (translations[currentLanguage][shortKey]) {
                            descKey = shortKey;
                        } else {
                            descKey = m.translationLabel + 'D'; // z.B. vexLabelD
                        }
                    }

                    const mDesc = (translations[currentLanguage] && translations[currentLanguage][descKey]) 
                                  ? translations[currentLanguage][descKey] 
                                  : "";
                    
                    // Ausgabe: Fett Name: Beschreibung
                    if (mDesc) {
                        html += `<li><b>${mName}:</b> ${mDesc}</li>`;
                    } else {
                        html += `<li><b>${mName}</b></li>`;
                    }
                }
            }
        }
    });
    return html + "</ul>";
}

// 6. Lokaler Pfad-Finder
function getFeatValueByPath(obj, path) {
    if (!path || !obj) return undefined;
    const keys = path.split('.');
    let current = obj;
    for (let i = 0; i < keys.length; i++) {
        if (current === undefined || current === null) return undefined;
        current = current[keys[i]];
    }
    return current;
}


/* --- Talente mit Einfluss auf Werte --- */

function applyTalentFeatureLogic(charData) {
    const levelInput = document.getElementById('level');
    const currentLevel = levelInput ? parseInt(levelInput.value, 10) : 1;

    // --- GLOBALE FLAGS RESETTEN ---
    window.hasMediumArmorMaster = false;
    window.hasArcheryStyle = false;
    window.hasDefenseStyle = false;
    window.speedBonusTalent = 0; 

    // Lokale Stats-Sammlung
    let computedStats = {
        strength: parseInt(document.getElementById('strengthScore').value) || 10,
        dexterity: parseInt(document.getElementById('dexterityScore').value) || 10,
        constitution: parseInt(document.getElementById('constitutionScore').value) || 10,
        intelligence: parseInt(document.getElementById('intelligenceScore').value) || 10,
        wisdom: parseInt(document.getElementById('wisdomScore').value) || 10,
        charisma: parseInt(document.getElementById('charismaScore').value) || 10,
        computedAC: 0,
        expertiseSkillIDs: [],
        additionalProficiencies: { armor: [], weapon: [] }, 
        bonusSpeedFT: 0 
    };

    // =========================================================================
    // ZENTRALE EXPERTISE-VERARBEITUNG (EXPERT_CHECK LOGIK FÜR WERTE)
    // =========================================================================
    // Wir lesen hier zentral alle gespeicherten Expertisen aus 'classForm.expertise'.
    // Das deckt Fall B ab (Klasse kannte Expertise nicht, Talent hat Liste gefüllt).
    // Da wir IDs sammeln und später deduplizieren (Set), ist es sicher, dies immer zu tun.
    // Führt die Berechnung EINMAL für alle Skills aus.
    if (charData.classForm && charData.classForm.expertise && Array.isArray(charData.classForm.expertise)) {
        // Wir wandeln Strings in Zahlen um, um sicherzugehen
        const expertSkills = charData.classForm.expertise.map(id => parseInt(id, 10)).filter(id => !isNaN(id));
        computedStats.expertiseSkillIDs.push(...expertSkills);
        // console.log("Expertise Skills (aus Talent/Klasse) zur Berechnung hinzugefügt:", expertSkills);
    }
    // =========================================================================

    if (typeof talentHandlers !== 'undefined' && typeof featList !== 'undefined') {
        const activeFeatIDs = new Set();

        // 1. IDs SAMMELN 
        if (charData.feats && charData.feats.background) activeFeatIDs.add(parseInt(charData.feats.background, 10));
        const speciesFeatIds = Array.isArray(charData.feats?.species)
            ? charData.feats.species
            : (charData.feats?.species ? [charData.feats.species] : []);
        speciesFeatIds.forEach(id => {
            const n = parseInt(id, 10);
            if (!isNaN(n) && n > 0) activeFeatIDs.add(n);
        });
        
        if (charData.classForm && charData.classForm.feats && Array.isArray(charData.classForm.feats)) {
            charData.classForm.feats.forEach(item => activeFeatIDs.add(parseInt(item.feat, 10)));
        }

        // 2. VERARBEITUNG
        activeFeatIDs.forEach(featID => {
            const featData = featList.find(f => f.ID === featID);
            if (!featData) return;

            // --- SPEZIAL-CHECKS ---
            if (featData.translationLabel === "mediumArmorMasterLabel") window.hasMediumArmorMaster = true;
            if (featData.translationLabel === "archeryLabel") window.hasArcheryStyle = true;
            if (featData.translationLabel === "defenseLabel") window.hasDefenseStyle = true;

            // Autom. Proficiencies
            if (featData.Get_armorCategoryNumber && Array.isArray(featData.Get_armorCategoryNumber)) {
                computedStats.additionalProficiencies.armor.push(...featData.Get_armorCategoryNumber);
            }
            if (featData.Get_weaponCategoryNumber && Array.isArray(featData.Get_weaponCategoryNumber)) {
                computedStats.additionalProficiencies.weapon.push(...featData.Get_weaponCategoryNumber);
            }

            // Handler aufrufen
            const sheetStatus = featData.characterSheet;
            const hasLogic = (sheetStatus === 2 || sheetStatus === 3 || typeof sheetStatus === 'string');

            if (hasLogic && talentHandlers[featData.translationLabel]) {
                const tempCharData = { ...charData };
                tempCharData.basic.level = currentLevel;
                talentHandlers[featData.translationLabel](tempCharData, computedStats);
            }
        });
    }

    // --- 3. FINALE UPDATES ---

    // Basis-AC durch Klassenspezialitäten (z.B. Unarmored Defense)
    if (computedStats.computedAC > 0 && computedStats.computedAC > window.classFeatureAC) {
        window.classFeatureAC = computedStats.computedAC;
        // updateArmorClass() wird unten sowieso aufgerufen
    }

    // Expertise & Skills
    if (computedStats.expertiseSkillIDs.length > 0) {
        window.activeExpertiseIDs = [...new Set([...window.activeExpertiseIDs, ...computedStats.expertiseSkillIDs])];
        updateSkillValues();
    }
    updateSavingThrowValues();

    // Proficiencies
    if (computedStats.additionalProficiencies.armor.length > 0) setProficiencies(computedStats.additionalProficiencies.armor, 'armor');
    if (computedStats.additionalProficiencies.weapon.length > 0) setProficiencies(computedStats.additionalProficiencies.weapon, 'weapon');
    
    // Speed -  Wert global speichern
    window.speedBonusTalent = computedStats.bonusSpeedFT;

    // <--- WICHTIG: FORCIERTE UPDATES AM ENDE --->
    
    // Angriffe (wegen Archery Flag)
    updatePhysicalAttacks(); 
    
    // Rüstungsklasse (wegen Defense Flag & Medium Armor Master Flag)
    updateArmorClass(); 

    calculateFinalSpeed();
}

function buildLanguagesListDisplayText(data) {
    const t = translations[currentLanguage] || {};

    let langs = data.proficiencies.languages || [];

    if (data.classForm && data.classForm.languages) {
        const classLangs = Array.isArray(data.classForm.languages)
            ? data.classForm.languages
            : [data.classForm.languages];
        langs = langs.concat(classLangs);
    }

    if (window.additionalClassLanguages && window.additionalClassLanguages.length > 0) {
        langs = langs.concat(window.additionalClassLanguages);

    langs = [...new Set(langs)];

    const translatedLangs = langs.map(id => {

            if (langData) return getTrans(langData.translationLabel);
        }
        return getTrans(id);
    }).filter(Boolean);

    return translatedLangs.length > 0 ? translatedLangs.join(", ") : "-";

function processSpeciesTraits(data) {
    const container = document.getElementById('speciesTraitsContent');
    if (!container) return;
    container.innerHTML = ""; 
    
    const levelInput = document.getElementById('level');
    const currentLevel = levelInput ? parseInt(levelInput.value, 10) : (parseInt(data.basic.level, 10) || 1);

    let rawSpecies = data.basic.species || "";
    if (rawSpecies) {
        rawSpecies = rawSpecies.charAt(0).toLowerCase() + rawSpecies.slice(1);
        if (!rawSpecies.endsWith("Label")) rawSpecies += "Label";
    }

    if (!rawSpecies || typeof speciesList === 'undefined' || typeof speciesTraitList === 'undefined') return;

    const speciesData = (typeof findSpeciesBySelectionValue === "function")
        ? findSpeciesBySelectionValue(data.basic.species || "")
        : speciesList.find(s => s.translationLabel === rawSpecies);
    if (!speciesData || !speciesData.speciesTraitLabel) return;

    let htmlContent = "";

    speciesData.speciesTraitLabel.forEach(traitLabel => {
        let traitData = speciesTraitList.find(t => t.speciesTraitLabel === traitLabel);
        if (!traitData) return;

        let status = traitData.characterSheet;
        let descKey = traitData.speciesTraitDSheet;
        let titleKey = traitLabel;
        // Nur Custom-Volk: Erblinie-Titel = „Erblinie / Lineage“ + Volksname (PHB behält elvenLineageLabel etc.)
        let lineageSheetTitle = null;

        let statusStr = String(status);
        if (statusStr.includes(":LEVEL:")) {
            const parts = statusStr.split(':LEVEL:');
            const targetLevel = parseInt(parts[1], 10);
            status = (currentLevel >= targetLevel) ? parseInt(parts[0], 10) : 0;
        }

        if (statusStr === "0:ANC" && typeof ancestryList !== 'undefined') {
            const ancestryObj = ancestryList.find(a => a.ancestryLabel === data.basic.ancestry);
            if (ancestryObj) {
                status = ancestryObj.characterSheet;
                descKey = ancestryObj.ancestryDLabel;
            } else {
                status = 0;
            }
        }

        if (statusStr === "0:LIN" && typeof lineageList !== 'undefined') {
            const lineageObj = lineageList.find(l => l.lineageLabel === data.basic.lineage && l.level === 1);
            if (lineageObj) {
                status = lineageObj.characterSheet;
                descKey = lineageObj.lineageTraitDSheet;
                if (speciesData.isCustom || traitData.isCustom) {
                    const tLang = translations[currentLanguage] || translations['de'] || {};
                    const lineageWord = tLang.lineageLabel || "Erblinie";
                    const speciesName = tLang[speciesData.translationLabel]
                        || speciesData.translationLabel
                        || "";
                    lineageSheetTitle = `${lineageWord} ${speciesName}`.trim();
                }
            } else {
                status = 0;
            }
        }

        // --- ZUSTAND AUSWERTEN: RENDERING ---
        if (status === 1 || status === 3) {
            const t = translations[currentLanguage] || translations['de'];
            
            let title = lineageSheetTitle || t[titleKey] || titleKey;
		const autoText = t['autoValueText'] || "Dieser Wert wird automatisch berechnet";
        	if (status === 3) {
            		title += `<span class="auto-marker" title="${autoText}">⚙</span>`;
        	}
            let rawText = t[descKey] || "";
            let parsedText = parseSpeciesTraitDescription(rawText, data);

            if (parsedText) {
                htmlContent += `
                    <div class="feature-block">
                        <div class="feature-header">
                            <span class="feature-title">${title}</span>
                        </div>
                        <div class="feature-text">${parsedText}</div>
                    </div>
                `;
            }
        }
    });

    container.innerHTML = htmlContent;
}

/**
 * Eigener, unabhängiger Parser für Volksmerkmale
 */
function parseSpeciesTraitDescription(text, data) {
    if (!text) return "";

    text = text.replace(/\[CHOICE_LIST\](.*?)\[\/CHOICE_LIST\]/g, (m, path) => {
        const raw = String(path || "").trim();
        // PHB-Erblinie: prepared + Cantrips unter speciesSpellsLabel (bestehendes Verhalten)
        if (raw === "preparedSpells.source.name.speciesSpellsLabel") {
            const targetLabel = "speciesSpellsLabel";
            
            const foundSpells = (data.spells.prepared || []).filter(entry => entry.source && entry.source.name === targetLabel);
            const foundCantrips = (data.spells.cantrips || []).filter(entry => entry.source && entry.source.name === targetLabel);
            
            const allFound = [...foundSpells, ...foundCantrips];
            const uniqueSpellIds = [...new Set(allFound.map(item => item.spellId))];

            if (uniqueSpellIds.length === 0) return "<i>Keine.</i>";

            let listHtml = "<ul class='compact-list'>";
            uniqueSpellIds.forEach(id => {
                if (typeof spellList !== 'undefined' || typeof findSheetSpellById === "function") {
                    const spell = (typeof findSheetSpellById === "function")
                        ? findSheetSpellById(id)
                        : spellList.find(s => s.ID === id);
                    if (spell) {
                        const name = (translations[currentLanguage] && translations[currentLanguage][spell.translationLabel]) 
                                     ? translations[currentLanguage][spell.translationLabel] 
                                     : spell.translationLabel;
                        listHtml += `<li><b>${name}</b></li>`;
                    }
                }
            });
            return listHtml + "</ul>";
        }
        // Custom / generisch: preparedSpells.source.name.<featureLabel> (nur vorbereitete Zauber)
        if (raw.includes("source.name") && typeof getFeatSpellListBySourceHTML === "function") {
            return getFeatSpellListBySourceHTML(raw, data);
        }
        return "";
    });

    return text;
}

/* Einfluss der Merkmale */

function applySpeciesFeatureLogic(charData) {
    // Globale Spezies-Flags resetten (damit Werte nicht dauerhaft hängen bleiben)
    window.baseSpeedOverride = null;

    // 1. Aktuelles Level auslesen
    const levelInput = document.getElementById('level');
    const currentLevel = levelInput ? parseInt(levelInput.value, 10) : (parseInt(charData.basic.level, 10) || 1);

    // 2. Spezies formatieren (z.B. "Dwarf" -> "dwarfLabel")
    let rawSpecies = charData.basic.species || "";
    if (rawSpecies) {
        rawSpecies = rawSpecies.charAt(0).toLowerCase() + rawSpecies.slice(1);
        if (!rawSpecies.endsWith("Label")) rawSpecies += "Label";
    }

    if (!rawSpecies || typeof speciesList === 'undefined' || typeof speciesTraitList === 'undefined') return;

    // 3. Spezies finden
    const speciesData = (typeof findSpeciesBySelectionValue === "function")
        ? findSpeciesBySelectionValue(charData.basic.species || "")
        : speciesList.find(s => s.translationLabel === rawSpecies);
    if (!speciesData || !speciesData.speciesTraitLabel) return;

    // 4. Merkmale iterieren (Nur Logik für Zustand 2 & 3)
    speciesData.speciesTraitLabel.forEach(traitLabel => {
        let traitData = speciesTraitList.find(t => t.speciesTraitLabel === traitLabel);
        if (!traitData) return;

        let status = traitData.characterSheet;
        let handlerKey = traitLabel; // Standard-Schlüssel für Handler

        // --- ERWEITERTE SYNTAX (LEVEL) ---
        let statusStr = String(status);
        if (statusStr.includes(":LEVEL:")) {
            const parts = statusStr.split(':LEVEL:');
            const targetLevel = parseInt(parts[1], 10);
            status = (currentLevel >= targetLevel) ? parseInt(parts[0], 10) : 0;
        }

        // --- ERWEITERTE SYNTAX (ANC) ---
        if (statusStr === "0:ANC" && typeof ancestryList !== 'undefined') {
            const ancestryObj = ancestryList.find(a => a.ancestryLabel === charData.basic.ancestry);
            if (ancestryObj) {
                status = ancestryObj.characterSheet;
                handlerKey = ancestryObj.ancestryLabel; // z.B. "blackLabel"
            } else {
                status = 0; 
            }
        }

        // --- ERWEITERTE SYNTAX (LIN) ---
        if (statusStr === "0:LIN" && typeof lineageList !== 'undefined') {
            const lineageObj = lineageList.find(l => l.lineageLabel === charData.basic.lineage && l.level === 1);
            if (lineageObj) {
                status = lineageObj.characterSheet;
                handlerKey = lineageObj.lineageLabel; // z.B. "woodElfLabel"
            } else {
                status = 0;
            }
        }

        // --- ZUSTAND AUSWERTEN: LOGIK ---
        if ((status === 2 || status === 3) && typeof speciesHandlers !== 'undefined') {
            if (speciesHandlers[handlerKey]) {
                // Sicherstellen, dass das aktuelle Level in den Daten ist
                charData.basic.level = currentLevel; 
                speciesHandlers[handlerKey](charData);
            }
        }
    });

    // --- NEU: Nach der Spezies-Auswertung sofort die Speed neu berechnen ---
    calculateFinalSpeed();
}

// Konfiguration der Zeilen pro Grad (Vorgabe)
const spellRowsConfig = {
    0: 4, // Cantrips
    1: 5,
    2: 5,
    3: 4,
    4: 3,
    5: 2,
    6: 2,
    7: 2,
    8: 1,
    9: 1
};

function processSpellsPage(data) {
    console.log("Verarbeite Zauber (Seite 5)...");
    const t = translations[currentLanguage];
    
    // Labels setzen
    setTextContent('page5Title', t['spellsLabel']);
    setTextContent('th_spell_name', t['nameLabel'] || "Name");
    setTextContent('th_spell_ability', t['abilityLabel'] || "Attr.");
    setTextContent('th_spell_dc', t['DCLabel'] || "SG");
    setTextContent('th_spell_attack', t['bonusLabel'] || "Angriff");
    setTextContent('th_spell_benefit', t['spellBenefitsfromLabel'] || "Begünstigt durch");
    setTextContent('th_spell_appendix_page', t['appendixPage2Label'] || "Anhang S.");

    const tableBody = document.getElementById('spellTableBody');
    if (!tableBody) return;

    // --- SCHRITT A: MANUELLE INHALTE GRAD-SPEZIFISCH SPEICHERN ---
    const manualOverridesByLevel = {}; 
    let currentScanningLevel = null;

    // Wir gehen durch alle existierenden Zeilen, bevor wir sie löschen
    const existingRows = tableBody.querySelectorAll('tr');
    existingRows.forEach(row => {
        if (row.classList.contains('spell-level-header')) {
            // Wir zählen die Header mit, um den aktuellen Grad (0-9) zu bestimmen
            if (currentScanningLevel === null) currentScanningLevel = 0;
            else currentScanningLevel++;
            manualOverridesByLevel[currentScanningLevel] = [];
        } else if (currentScanningLevel !== null && !row.hasAttribute('data-db-spell')) {
            // Nur Zeilen sichern, die NICHT automatisch (DB) befüllt wurden
            const inputs = row.querySelectorAll('input');
            const rowValues = Array.from(inputs).map(inp => inp.value);
            // Nur speichern, wenn die Zeile manuellen Text enthält
            if (rowValues.some(v => v.trim() !== "")) {
                manualOverridesByLevel[currentScanningLevel].push(rowValues);
            }
        }
    });

    // --- SCHRITT B: TABELLE LEEREN ---
    tableBody.innerHTML = ""; 

    // --- SCHRITT C: ZAUBER-DATEN SAMMELN ---
    let allSpells = [];
    const addSpellToList = (list, type) => {
        if (!list) return;
        list.forEach(entry => {
            const spellObj = (typeof findSheetSpellById === "function")
                ? findSheetSpellById(entry.spellId)
                : spellList.find(s => s.ID === entry.spellId);
            if (spellObj) {
                allSpells.push({ spell: spellObj, source: entry.source, type: type });
            }
        });
    };

    addSpellToList(data.spells.cantrips, 'cantrip');
    addSpellToList(data.spells.prepared, 'prepared');

    // --- SCHRITT D: GRADE RENDERN (mit grad-spezifischen Overrides) ---
    for (let level = 0; level <= 9; level++) {
        // Wir übergeben nur die Overrides, die zu diesem spezifischen Level gehören
        const levelSpecificOverrides = manualOverridesByLevel[level] || [];
        renderSpellLevelBlock(level, allSpells, data, tableBody, levelSpecificOverrides);
    }
    
    applyFieldLocks();
}

function renderSpellLevelBlock(level, allSpells, data, tableBody, manualOverrides) {
    const t = translations[currentLanguage];
    
    // Header-Zeile (mit Slots)
    const trHeader = document.createElement('tr');
    trHeader.className = "spell-level-header";
    const labelKey = level === 0 ? "cantripLabel" : getLevelKey(level);
    const levelName = t[labelKey] || labelKey;
    let headerContent = `<td colspan="6" style="padding-left: 10px;">${levelName}`;
    if (level > 0) {
        const slots = calculateSpellSlots(level, data);
        const slotLabel = t['spellSlotsLabel'] || "Zauberplätze";
        let checkboxes = "";
        for(let i=0; i<slots; i++) checkboxes += `<input type="checkbox" class="slot-checkbox">`;
        if (slots > 0) headerContent += `<div class="spell-slots-container" style="float:right;"><span>${slotLabel} (${slots}):</span> ${checkboxes}</div>`;
    }
    headerContent += `</td>`;
    trHeader.innerHTML = headerContent;
    tableBody.appendChild(trHeader);

    // Zauber filtern
    const targetLabelKey = level === 0 ? "cantripLabel" : getLevelKey(level);
    const spellsForLevel = allSpells.filter(s => s.spell.spellLevel === targetLabelKey);
    const rowCount = spellRowsConfig[level] || 0;

    for (let i = 0; i < rowCount; i++) {
        const tr = document.createElement('tr');
        
        if (i < spellsForLevel.length) {
            tr.setAttribute('data-db-spell', 'true');
            fillSpellRow(tr, spellsForLevel[i], data, level);
        } 
        else if (manualOverrides && manualOverrides.length > 0) {
            // Nimmt den nächsten manuellen Eintrag für GENAU DIESEN GRAD
            const v = manualOverrides.shift(); 
            tr.innerHTML = `
                <td><input type="text" class="spell-input" value="${v[0] || ''}"></td>
                <td><input type="text" class="spell-input center-text" value="${v[1] || ''}"></td>
                <td><input type="text" class="spell-input center-text" value="${v[2] || ''}"></td>
                <td><input type="text" class="spell-input center-text" value="${v[3] || ''}"></td>
                <td><input type="text" class="spell-input" value="${v[4] || ''}"></td>
                <td><input type="text" class="spell-input center-text" value="${v[5] || ''}"></td>
            `;
        }
        else {
            tr.innerHTML = `
                <td><input type="text" class="spell-input"></td>
                <td><input type="text" class="spell-input center-text"></td>
                <td><input type="text" class="spell-input center-text"></td>
                <td><input type="text" class="spell-input center-text"></td>
                <td><input type="text" class="spell-input"></td>
                <td><input type="text" class="spell-input center-text"></td>
            `;
        }
        tableBody.appendChild(tr);
    }
}

function fillSpellRow(tr, entry, data, level) {
    const t = translations[currentLanguage];
    const spell = entry.spell;
    const source = entry.source; 

    // 1. Name
    const name = t[spell.translationLabel] || spell.translationLabel;

    // 2. Ability (Attribut) ermitteln
    const abilityKey = determineSpellAbility(source, data);
    const abilityName = getAttributeAbbrFromLabelKey(abilityKey) || "---";

    // 3. Stats berechnen (SG & Angriff)
    const stats = calculateSpellStats(abilityKey); 

    // 4. Benefits Check
    let benefitText = "";
    
    // KORREKTUR: Bei Cantrips (Level 0) immer "-"
    if (level === 0) {
        benefitText = "-";
    } else {
        // Nur bei Level 1+ prüfen wir auf Begünstigung
        const isFavored = data.spells.favored && data.spells.favored.some(f => f.spellId === spell.ID);
        
        if (isFavored) {
            const favEntry = data.spells.favored.find(f => f.spellId === spell.ID);
            if (favEntry && favEntry.source) {
                const src = favEntry.source;
                // Volkszauber: Anzeige immer generisch „Volkszauber“ (auch bei Trait-source.name)
                if (src.type === "Volk" || src.type === "Species" || src.type === "lineage") {
                    benefitText = t.speciesSpellsLabel || "Volkszauber";
                } else if (src.name) {
                    benefitText = t[src.name] || src.name;
                } else {
                    benefitText = "Bonus";
                }
            } else {
                 benefitText = "Bonus"; 
            }
        }
    }

   // --- Prüfen, ob das Tetris-Skript dem Zauber eine Seite zugewiesen hat ---
    let appPage = "-";
    if (window.spellAppendixPages && window.spellAppendixPages[spell.ID]) {
        appPage = window.spellAppendixPages[spell.ID];
    }

    const nameMarkerHtml = (typeof isCustomContentSpell === "function" && isCustomContentSpell(spell)
        && typeof getCustomContentMarkerHtml === "function")
        ? getCustomContentMarkerHtml()
        : "";

    tr.innerHTML = `
        <td><div class="spell-name-cell"><input type="text" class="spell-input" value="${name}">${nameMarkerHtml}</div></td>
        <td><input type="text" class="spell-input center-text" value="${abilityName}"></td>
        <td><input type="text" class="spell-input center-text" value="${stats.dc}"></td>
        <td><input type="text" class="spell-input center-text" value="${stats.attack}"></td>
        <td><input type="text" class="spell-input" value="${benefitText}"></td>
        <td><input type="text" class="spell-input center-text" value="${appPage}"></td>
    `;
}

// --- LOGIK III: ZAUBERATTRIBUT ERMITTELN ---
function determineSpellAbility(source, data) {
    if (!source) return "intelligenceLabel"; // Fallback

    // Fall 1: Volk
    if (source.type === 'Volk' || source.type === 'Species' || source.type === 'lineage') {
        const abilityId = data.spells.spellcastingAbility_species;
        
        if (abilityId) {
            // Suchen des Attributs in der Liste anhand der ID (5 -> wisdomLabel)
            const attrEntry = attributeList.find(a => a.ID == abilityId);
            if (attrEntry) {
                return attrEntry.translationLabel;
            }
        }
        return "intelligenceLabel"; // Fallback
    }

    // Fall 2: Klasse
    if (source.type === 'Klasse' || source.type === 'Class') {
        // Klasse identifizieren (z.B. aus data.basic.class)
        // ACHTUNG: source.name ist oft z.B. 'classPreparedSpellsLabel', das hilft nicht viel für die Klasse selbst.
        // Aber wir wissen ja, welche Klasse der Char hat.
        // WICHTIG: Ein Char kann nur EINE Klasse haben im Ersteller (kein Multiclassing). 
        // Daher nehmen wir data.basic.class.
        
        const className = data.basic.class; // "Barbarian"
        if (!className) return "intelligenceLabel";

        const classData = getClassDataArray(className); // Holt z.B. barbarianClassData (Array)
        // Wir brauchen aber das Metadaten-Objekt 'classCoreTraitsList' für das Attribut!
        
        const coreTrait = classCoreTraitsList.find(c => c.translationLabel.toLowerCase() === className.toLowerCase());
        
        if (coreTrait) {
            // Hat die Klasse ein festes Attribut? (z.B. Wizard -> intelligenceLabel)
            if (coreTrait.spellcastingAbility && coreTrait.spellcastingAbility !== 0) {
                return coreTrait.spellcastingAbility;
            }
            // Wenn 0, dann Unterklasse prüfen
            if (data.classForm.subclass) {
                const subId = parseInt(data.classForm.subclass, 10);
                // Suche in subclassSpellAbillityList
                // Wir müssen matchen: classLabel (lowercase) und subclassCategoryNumber
                const subEntry = (typeof getEffectiveSubclassSpellAbilityList === "function"
                    ? getEffectiveSubclassSpellAbilityList()
                    : subclassSpellAbillityList
                ).find(s => 
                    s.classLabel.toLowerCase() === className.toLowerCase() &&
                    s.subclassCategoryNumber === subId
                );
                
                if (subEntry) {
                    return subEntry.spellAbillityLabel;
                }
            }
        }
        return "intelligenceLabel"; // Fallback
    }

    // Fall 3: Talent
    if (source.type === 'Talent' || source.type === 'Feat') {
        const talentKey = source.name;
        const talentAbilityStore = data.spells.spellcastingAbility_talent;

        /** Magic-Initiate-Listen-Slug vergleichen (cleric / clericLabel). */
        const normSpellListSlug = (raw) => {
            if (raw == null || raw === "") return "";
            return String(raw).replace(/Label$/i, "").toLowerCase().trim();
        };

        // Kanonisch (Ersteller): [{ talent, ability, spellList? }, ...]
        // Mehrfach dasselbe Talent (z. B. 2× Magischer Adept): per spellList disambiguieren
        if (Array.isArray(talentAbilityStore) && talentKey) {
            const candidates = talentAbilityStore.filter(e =>
                e && (e.talent === talentKey || e.name === talentKey)
            );
            if (candidates.length) {
                const sourceList = normSpellListSlug(source.spellList);
                let entry = null;
                if (sourceList) {
                    entry = candidates.find(e =>
                        normSpellListSlug(e.spellList) === sourceList
                    ) || null;
                }
                if (!entry) entry = candidates[0];
                if (entry?.ability) return entry.ability;
            }
        }

        // A. Magic Initiate: ohne gespeichertes Attribut → Listen-Heuristik
        if (talentKey === 'magicInitiateLabel') {
            const list = normSpellListSlug(source.spellList)
                || (Array.isArray(talentAbilityStore)
                    ? normSpellListSlug(
                        talentAbilityStore.find(e => e?.talent === 'magicInitiateLabel')?.spellList
                    )
                    : "");
            if (list === 'cleric' || list === 'druid') return "wisdomLabel";
            if (list === 'wizard') return "intelligenceLabel";
            return "intelligenceLabel";
        }

        // Legacy-Map: { ritualCasterLabel: 'intelligenceLabel', ... }
        if (talentAbilityStore && !Array.isArray(talentAbilityStore) && talentKey
            && talentAbilityStore[talentKey]) {
            return talentAbilityStore[talentKey];
        }
    }

    return "intelligenceLabel"; // Letzter Fallback
}

// --- LOGIK IV & V: SG & ANGRIFF BERECHNEN ---
function calculateSpellStats(abilityLabel) {
    // 1. PB holen
    const pbInput = document.getElementById('proficiencyBonus');
    // Wert ist z.B. "+2". Wir entfernen das "+"
    const pb = pbInput ? parseInt(pbInput.value.replace('+',''), 10) : 2;

    // 2. Modifikator holen
    // abilityLabel ist z.B. "intelligenceLabel" -> ID ist "intelligenceModifier"
    let modId = "";
    if (abilityLabel === "strengthLabel") modId = "strengthModifier";
    else if (abilityLabel === "dexterityLabel") modId = "dexterityModifier";
    else if (abilityLabel === "constitutionLabel") modId = "constitutionModifier";
    else if (abilityLabel === "intelligenceLabel") modId = "intelligenceModifier";
    else if (abilityLabel === "wisdomLabel") modId = "wisdomModifier";
    else if (abilityLabel === "charismaLabel") modId = "charismaModifier";

    const modInput = document.getElementById(modId);
    // Wert ist z.B. "+3" oder "-1"
    const mod = modInput ? parseInt(modInput.value, 10) : 0;

    // 3. Berechnen
    const saveDC = 8 + pb + mod;
    const attackVal = pb + mod;
    const attackStr = attackVal >= 0 ? `+${attackVal}` : `${attackVal}`;

    return { dc: saveDC, attack: attackStr };
}

// --- LOGIK: ZAUBERPLÄTZE ---
function calculateSpellSlots(spellLevel, data) {
    const className = data.basic.class;
    if (!className) return 0;

    const charLevel = parseInt(document.getElementById('level').value, 10) || 1;
    const subId = data.classForm?.subclass ? parseInt(data.classForm.subclass, 10) : 0;

    // Nur Full-Caster-Basis / spellcastingLabel / pactMagicLabel (keine Talent-/SSpSL-Heuristik)
    const hasSlots = (typeof characterHasSpellSlotProgression === "function")
        ? characterHasSpellSlotProgression(className, subId, charLevel)
        : (() => {
            const coreTrait = classCoreTraitsList.find(c =>
                c.translationLabel.toLowerCase() === className.toLowerCase()
            );
            if (coreTrait && coreTrait.spellcastingLabel === 1) return true;
            const classDataArray = typeof getClassDataArray === "function"
                ? getClassDataArray(className)
                : null;
            return typeof classDataHasSpellcastingOrPactMagic === "function"
                ? classDataHasSpellcastingOrPactMagic(classDataArray, charLevel, subId)
                : false;
        })();

    if (!hasSlots) return 0;

    const classDataArray = typeof getClassDataArray === "function"
        ? getClassDataArray(className)
        : null;
    if (!classDataArray) return 0;

    const levelRow = (typeof resolveClassLevelSpellResourceRow === "function")
        ? resolveClassLevelSpellResourceRow(classDataArray, charLevel, subId)
        : classDataArray.find(r =>
            r.level === charLevel
            && (r.subclassCategoryNumber === 0 || r.subclassCategoryNumber === subId)
        );
    if (!levelRow) return 0;

    const key = `SSpSL${spellLevel}`;
    return parseInt(levelRow[key], 10) || 0;
}

// Helper Keys
function getLevelKey(lvl) {
    if (lvl === 1) return "1stLevelLabel";
    if (lvl === 2) return "2ndLevelLabel";
    if (lvl === 3) return "3rdLevelLabel";
    return `${lvl}thLevelLabel`;
}


/* --- Zauberbuch ---*/

function isSpellbookSheetTableId(tableId) {
    return typeof tableId === "string" && /^sb_table_\d+$/.test(tableId);
}

function findPreparedSpellEntry(preparedSpells, spellId) {
    const id = parseInt(spellId, 10);
    if (isNaN(id)) return null;
    return (preparedSpells || []).find(p => parseInt(p.spellId, 10) === id) || null;
}

function processSpellbookPage(data) {
    if (typeof characterUsesSpellbook === "function") {
        if (!characterUsesSpellbook(data.basic.class)) return;
    } else if (data.basic.class.toLowerCase() !== 'wizard') {
        return;
    }
    
    console.log("Verarbeite Zauberbuch (Seite 6)...");
    const t = translations[currentLanguage];

    // 1. Header & Labels setzen
    setTextContent('page6Title', t['spellbookLabel'] || "Zauberbuch");
    for(let i=1; i<=9; i++) {
        const lvlKey = getLevelKey(i);
        setTextContent(`sb_title_${i}`, t[lvlKey] || lvlKey);
        setTextContent(`th_prep_${i}`, t['preparedLabel'] || "Vorb.");
        setTextContent(`th_name_${i}`, t['nameLabel'] || "Name");
        
        // Tabellen leeren
        const tbody = document.querySelector(`#sb_table_${i} tbody`);
        if(tbody) tbody.innerHTML = "";
    }

    // 2. Zauber iterieren
    const bookSpells = data.spells.spellbook || [];
    const preparedSpells = data.spells.prepared || [];

    bookSpells.forEach(entry => {
        const spellId = parseInt(entry, 10) || (entry.spellId ? parseInt(entry.spellId, 10) : null);
        if(!spellId) return;

        const spellData = (typeof findSheetSpellById === "function")
            ? findSheetSpellById(spellId)
            : spellList.find(s => s.ID === spellId);
        if(!spellData) return;

        // Welcher Grad? (Zahl extrahieren aus "1stLevelLabel")
        const levelMatch = spellData.spellLevel.match(/\d+/);
        if(!levelMatch) return; // Cantrips ausfiltern
        const spellLvl = parseInt(levelMatch[0], 10);
        if(spellLvl < 1 || spellLvl > 9) return;

        // 3. Prüfen ob vorbereitet
        const prepEntry = findPreparedSpellEntry(preparedSpells, spellId);
        const isPrepared = !!prepEntry;
        
        // WICHTIG: Ist der Zauber zwangs-vorbereitet? (Talent oder Spezies)
        let isLocked = false;
        if (isPrepared && prepEntry.source) {
            const sType = prepEntry.source.type;
            if (sType !== 'Klasse' && sType !== 'Class') {
                isLocked = true; // Z.B. durch Talent gewährt -> Darf nicht weggeklickt werden
            }
        }

        // 4. Rendern
        const tbody = document.querySelector(`#sb_table_${spellLvl} tbody`);
        if(!tbody) return;

        const spellName = t[spellData.translationLabel] || spellData.translationLabel;
        const tr = document.createElement('tr');
        
        const checkedAttr = isPrepared ? "checked" : "";
        const lockedAttr = isLocked ? "data-locked='true'" : "";
        const titleAttr = isLocked ? "title='Durch Talent oder Herkunft gebunden'" : "";

        tr.innerHTML = `
            <td style="text-align: center;">
                <input type="checkbox" class="spellbook-checkbox" data-id="${spellId}" ${checkedAttr} ${lockedAttr} ${titleAttr}>
            </td>
            <td>${spellName}</td>
        `;
        tbody.appendChild(tr);
    });

    // 5. Event Listener für Klicks anbinden
    document.querySelectorAll('.spellbook-checkbox').forEach(cb => {
        cb.addEventListener('change', function() {
            handleSpellbookCheckboxClick(this);
        });
    });
}

function handleSpellbookCheckboxClick(checkbox) {
    const spellId = parseInt(checkbox.getAttribute('data-id'), 10);
    const isChecked = checkbox.checked;

    // 1. Daten frisch aus LS laden, um Überschreiben zu verhindern
    const currentData = loadCharacterDataFromStorage();
    let preparedArray = currentData.spells.prepared || [];

    if (isChecked) {
        // Füge hinzu
        const exists = findPreparedSpellEntry(preparedArray, spellId);
        if (!exists) {
            preparedArray.push({
                spellId: spellId,
                source: { type: 'Klasse', name: 'classPreparedSpellsLabel' } // Deine gewünschte Quelle!
            });
        }
    } else {
        // Entferne
        preparedArray = preparedArray.filter(p => parseInt(p.spellId, 10) !== spellId);
    }

    // 2. Zurück in LocalStorage speichern! (Wichtig für Konsistenz beim Neuladen)
    localStorage.setItem("preparedSpells", JSON.stringify(preparedArray));

    // 3. charData im RAM aktualisieren und Seite 5 (Zauber) live neu rendern!
    currentData.spells.prepared = preparedArray;
    processSpellsPage(currentData);
}

/*--- Anhang-Logik: Zauberschreibungen ---*/

let appendixTotalPages = 0; // Separate Zählung für den Anhang

/** true, wenn der Charakter Zauber für den Anhang hat und Seite 5 noch existiert. */
function isSpellAppendixAvailable(charData) {
    const data = charData || (typeof loadCharacterDataFromStorage === "function"
        ? loadCharacterDataFromStorage()
        : null);
    if (!data?.spells) return false;

    const hasCantrips = Array.isArray(data.spells.cantrips) && data.spells.cantrips.length > 0;
    const hasPrepared = Array.isArray(data.spells.prepared) && data.spells.prepared.length > 0;
    const hasSpellbook = Array.isArray(data.spells.spellbook) && data.spells.spellbook.length > 0;
    const hasFavored = Array.isArray(data.spells.favored) && data.spells.favored.length > 0;
    const hasSpells = hasCantrips || hasPrepared || hasSpellbook || hasFavored;
    const page5Exists = !!document.getElementById("page5-wrapper");

    return hasSpells && page5Exists;
}

/**
 * Zauberanhang-Schalter an verfügbare Zauber koppeln.
 * Kein Zauber / keine Seite 5 → Checkbox aus, Anhang entfernen, Button verstecken.
 */
function syncSpellAppendixToggleState(charData) {
    const toggleWrapper = document.getElementById("appendixToggleWrapper");
    const checkbox = document.getElementById("generateSpellDesc");
    const available = isSpellAppendixAvailable(charData);

    if (!available) {
        if (checkbox) checkbox.checked = false;
        removeAppendix();
        if (toggleWrapper) toggleWrapper.style.display = "none";
        return;
    }

    if (toggleWrapper) toggleWrapper.style.display = "flex";
    if (checkbox?.checked) {
        buildAppendix();
    } else {
        removeAppendix();
    }
}

// Prüft beim Start, ob der Schalter überhaupt angezeigt werden soll
function initAppendixToggle() {
    syncSpellAppendixToggleState();
}

// Wird beim Klicken der Checkbox aufgerufen
function toggleAppendix() {
    const isChecked = document.getElementById('generateSpellDesc').checked;
    if (isChecked) {
        buildAppendix();
    } else {
        removeAppendix();
    }
}

function removeAppendix() {
    document.querySelectorAll('.appendix-page').forEach(page => page.remove());
    appendixTotalPages = 0;
    
    // Speicher leeren
    window.spellAppendixPages = {}; 
    
    // Zaubertabelle (Seite 5) aktualisieren, damit wieder "-" überall steht
    const charData = loadCharacterDataFromStorage();
    if (document.getElementById('spellTableBody')) {
        processSpellsPage(charData);
    }
}

function buildAppendix() {
    removeAppendix(); // Altlasten löschen
    console.log("Generiere Zauber-Anhang...");

    const charData = loadCharacterDataFromStorage();
    const root = document.getElementById('sheetRoot');
    const t = translations[currentLanguage];
    
    // 1. Alle Zauber-IDs sammeln (Dedupliziert!)
    const spellIds = new Set();
    if (charData.spells.cantrips) charData.spells.cantrips.forEach(s => spellIds.add(s.spellId));
    if (charData.spells.prepared) charData.spells.prepared.forEach(s => spellIds.add(s.spellId));
    if (charData.spells.spellbook) charData.spells.spellbook.forEach(s => spellIds.add(parseInt(s, 10) || s.spellId));

    if (spellIds.size === 0) return;

    // 2. Zauberdaten holen und sortieren (Cantrips -> Level 9)
    let spellsToRender = [];
    spellIds.forEach(id => {
        const s = (typeof findSheetSpellById === "function")
            ? findSheetSpellById(id)
            : spellList.find(x => x.ID === id);
        if (s) spellsToRender.push(s);
    });

    spellsToRender.sort((a, b) => {
        const getLvl = (lvlStr) => lvlStr === "cantripLabel" ? 0 : parseInt(lvlStr.match(/\d+/)?.[0] || 99);
        return getLvl(a.spellLevel) - getLvl(b.spellLevel);
    });

    // 3. TETRIS ALGORITHMUS SETUP (12-Punkte-System für präzise Mathe)
    let currentAppendixPageNum = 1;
    let colLeft = null;
    let colRight = null;
    
    let activeCol = 1;      // 1 = Links, 2 = Rechts
    let capacityLeft = 12;  // Eine Spalte hat 12 Einheiten

    const createNewPage = () => {
        appendixTotalPages++;
        const pageDiv = document.createElement('div');
        pageDiv.className = 'page fixed-page appendix-page';
        
        pageDiv.innerHTML = `
            <div class="character-sheet simple-layout">
                <header class="simple-header">
                    <div class="header-left-simple">
                        <input type="text" class="simple-input-name" value="${charData.basic.name}" readonly>
                    </div>
                    <div class="header-right-simple">
                        <h1 class="page-title">${t['spellDecLabel'] || 'Zauber Anhang'}</h1>
                    </div>
                </header>
                <div class="simple-divider-line"></div>
                <main class="sheet-main-content simple-content-override">
                    <div class="appendix-layout">
                        <div class="appendix-col left-col"></div>
                        <div class="appendix-col right-col"></div>
                    </div>
                </main>
		<footer class="sheet-footer">
                    <div class="footer-left">
			<a href="https://dicecharacters.com" target="_blank" class="footer-link">www.dicecharacters.com</a>
                    </div>
                    <div class="footer-right">
                        <span>${t['appendixPageLabel'] || 'Anhang Seite'}</span>
                        <span>${currentAppendixPageNum} / <span class="app-total-pages"></span></span>
                    </div>
                </footer>
            </div>
        `;
        root.appendChild(pageDiv);
        colLeft = pageDiv.querySelector('.left-col');
        colRight = pageDiv.querySelector('.right-col');
        
        activeCol = 1;
        capacityLeft = 12; 
        currentAppendixPageNum++;
    };

    // Erste Seite erstellen
    createNewPage();

    // 4. ZAUBER RENDERN & VERTEILEN
    spellsToRender.forEach(spell => {
        // --- A. Daten aufbereiten ---
        const name = t[spell.translationLabel] || spell.translationLabel;
        const nameMarkerHtml = (typeof isCustomContentSpell === "function" && isCustomContentSpell(spell)
            && typeof getCustomContentMarkerHtml === "function")
            ? getCustomContentMarkerHtml()
            : "";
        const level = t[spell.spellLevel] || spell.spellLevel;
        const school = t[spell.spellSchool] || spell.spellSchool;
        const time = t[spell.castingTime] ? `${spell.castingTimeValue} ${t[spell.castingTime]}` : spell.castingTime;
        
        let range = spell.spellRange;
        if (typeof range === 'number' || !isNaN(range)) {
            range = (currentLanguage === 'de') ? (parseInt(range, 10) / 5 * 1.5) + " m" : range + " ft.";
        } else { range = t[range] || range; }

        const duration = spell.durationTimeValue === 0 ? (t[spell.duration] || spell.duration) : `${spell.durationTimeValue} ${t[spell.duration] || spell.duration}`;
        
        // --- B. Beschreibung & Material ---
        let rawDesc = t[spell.spellDLabel] || "";
        const matRegex = /(?:<b[^>]*>)?Material:(?:<\/b>)?\s*(.*?)(?:<br\s*\/?>|<\/p>|<ul>|$)/i;
        const match = rawDesc.match(matRegex);
        let materialText = match ? match[1].trim() : "";
        if (match) rawDesc = rawDesc.replace(matRegex, "");

        let comps = Array.isArray(spell.components) ? spell.components.map(c => t[c] || c.replace('comp','').replace('Label','')).join(", ") : spell.components;
        if (materialText && comps.includes("M")) comps = comps.replace("M", `M (${materialText})`);

        // --- C. Größen-Kalkulation (12er Punkte-Logik) ---
        let charCount = rawDesc.length;
        if (rawDesc.includes("<table")) charCount += 300;

        let boxSizeClass = 1; 
        let pointsNeeded = 3; // Standard 1/4 = 3 Punkte
        let textClass = "";

        if (charCount < 300) { 
            boxSizeClass = 1; pointsNeeded = 3;  // 1/4 (3 Pkt)
        } else if (charCount < 500) { 
            boxSizeClass = 2; pointsNeeded = 4;  // 1/3 (4 Pkt)
        } else if (charCount < 800) { 
            boxSizeClass = 2; pointsNeeded = 4; textClass = "text-small"; // 1/3 (4 Pkt)
        } else if (charCount < 1100) { 
            boxSizeClass = 3; pointsNeeded = 6; textClass = "text-small"; // 2/4 (6 Pkt)
        } else if (charCount < 1500) { 
            boxSizeClass = 4; pointsNeeded = 8; textClass = "text-tiny";  // 2/3 (8 Pkt)
        } else { 
            boxSizeClass = 5; pointsNeeded = 12; textClass = "text-tiny"; // 4/4 (12 Pkt)
        }

        // --- D. STRIKTE SEQUENZIELLE LOGIK ---
        if (pointsNeeded > capacityLeft) {
            activeCol++;
            capacityLeft = 12; 

            if (activeCol > 2) {
                createNewPage();
            }
        }

        // HTML Block bauen
        const boxDiv = document.createElement('div');
        boxDiv.className = `spell-desc-box box-h${boxSizeClass} ${textClass}`;
        boxDiv.innerHTML = `
            <div class="sd-header">
                <span class="sd-title">${name}${nameMarkerHtml}</span>
                <span class="sd-subtitle">${level}, ${school}</span>
            </div>
            <div class="sd-meta">
                <div class="sd-meta-item"><b>${t['castingTimeLabel'] || 'Zeit'}:</b> ${time}</div>
                <div class="sd-meta-item"><b>${t['rangeLabel'] || 'Reichweite'}:</b> ${range}</div>
                <div class="sd-meta-item"><b>${t['componentLabel'] || 'Komp.'}:</b> ${comps}</div>
                <div class="sd-meta-item"><b>${t['durationLabel'] || 'Dauer'}:</b> ${duration}</div>
            </div>
            <div class="sd-text">${rawDesc}</div>
        `;

        if (activeCol === 1) colLeft.appendChild(boxDiv);
        else colRight.appendChild(boxDiv);

        capacityLeft -= pointsNeeded;

        window.spellAppendixPages[spell.ID] = appendixTotalPages;
    });

    document.querySelectorAll('.app-total-pages').forEach(el => el.textContent = appendixTotalPages);
    processSpellsPage(charData);
}

function setupEventListeners() {

            const charData = loadCharacterDataFromStorage();
            applySpeciesFeatureLogic(charData);
            processSpeciesTraits(charData);

            processSpellsPage(charData);
        });
    }

    // 3. Live-Update bei Attributsänderung
    document.querySelectorAll('.score-box input').forEach(input => {
        input.addEventListener('input', (e) => {
            // A. Modifikatoren berechnen
            updateModifiers();
            
            // B. Spezial-Updates (HP/AC)
            if (e.target.id === 'constitutionScore') {
                updateHitPointsAndDice();
            }
            if (e.target.id === 'dexterityScore') {
                updateArmorClass();
            }

            // C. Logik-Kette neu durchlaufen
