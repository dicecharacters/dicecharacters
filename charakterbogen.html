            applyTalentFeatureLogic(charData);  // <--- NEU: Fügt Talent-Expertisen wieder hinzu!
            processSpellsPage(charData);
        });
    });

    // 4. Live-Update: Event Delegation (WICHTIG für Skills & Saves)
    document.body.addEventListener('change', (e) => {
        if (e.target && e.target.classList.contains('rounded-checkbox')) {
            const id = e.target.id;
            if (id && id.endsWith('Trained')) {
                updateSavingThrowValues();
                updateSkillValues();
            }
            if (isEditMode && typeof scheduleSheetOverridesPersist === "function") {
                scheduleSheetOverridesPersist();
            }
        }
    });

    // 4b. Manuelle Bogenänderungen im Bearbeitungsmodus persistieren
    document.body.addEventListener('input', (e) => {
        if (!isEditMode) return;
        const t = e.target;
        if (!t || (t.tagName !== "INPUT" && t.tagName !== "TEXTAREA")) return;
        if (t.type === "file") return;
        if (typeof scheduleSheetOverridesPersist === "function") {
            scheduleSheetOverridesPersist();
        }
    });

    // 4c. Waffen-/Rüstungs-Inventar: Ersteller-Kopplung bei geleertem Namen aufheben
    const bindInventoryNameValidation = (tableSelector, boxId) => {
        const table = document.querySelector(tableSelector);
        if (!table || table.dataset.creatorNameBound) return;
        table.dataset.creatorNameBound = "1";
        table.addEventListener('input', (e) => {
            const inp = e.target;
            if (!inp || inp.type !== "text") return;
            const row = inp.closest("tr");
            if (!row) return;
            const cells = row.querySelectorAll("td");
            if (cells[1] && cells[1].contains(inp)) {
                validateInventoryCreatorRowBinding(row, boxId);
                // Schild ↔ Nicht-Schild bei manuellem Umbenennen sofort korrigieren
                if (boxId === 2 && typeof syncInventoryArmorRowShieldState === "function") {
                    syncInventoryArmorRowShieldState(row);
                    if (typeof updateArmorClass === "function") updateArmorClass();
                }
                if (typeof scheduleSheetOverridesPersist === "function") {
                    scheduleSheetOverridesPersist();
                }
            }
        });
    };
    bindInventoryNameValidation('[data-dc-table-id="inv_weapons"]', 1);
    bindInventoryNameValidation('[data-dc-table-id="inv_armor"]', 2);

    // 4c2. Waffen-Anlege-Checkbox: Persist + Angriffstabelle (auch manuelle Zeilen)
    const weaponsEquipTable = document.querySelector('[data-dc-table-id="inv_weapons"]');
    if (weaponsEquipTable && !weaponsEquipTable.dataset.equippedPersistBound) {
        weaponsEquipTable.dataset.equippedPersistBound = "1";
        weaponsEquipTable.addEventListener("change", (e) => {
            const cb = e.target;
            if (!cb || cb.type !== "checkbox") return;
            const row = cb.closest("tr");
            if (row && cb.hasAttribute("data-creator-bound")) {
                validateInventoryCreatorRowBinding(row, 1);
            } else if (row && !cb.hasAttribute("data-creator-bound")) {
                const name = (row.querySelectorAll("input")[1]?.value || "").trim();
                if (name) row.setAttribute("data-inventory-manual", "1");
            }
            if (typeof updatePhysicalAttacks === "function") updatePhysicalAttacks();
            if (typeof scheduleSheetOverridesPersist === "function") scheduleSheetOverridesPersist();
        });
    }

    // 4d. Physische Angriffe: manuelle Zeilen markieren + persistieren
    const physicalAttacksTable = getPhysicalAttacksTable();
    if (physicalAttacksTable && !physicalAttacksTable.dataset.manualAttackBound) {
        physicalAttacksTable.dataset.manualAttackBound = "1";
        physicalAttacksTable.addEventListener('input', (e) => {
            if (!isEditMode) return;
            const inp = e.target;
            if (!inp || inp.type !== "text") return;
            const row = inp.closest("tr");
            if (!row) return;
            markPhysicalAttackRowManual(row);
            clearPhysicalAttackRowManualIfEmpty(row);
            if (typeof scheduleSheetOverridesPersist === "function") {
                scheduleSheetOverridesPersist();
            }
        });
        physicalAttacksTable.addEventListener('change', (e) => {
            if (!isEditMode) return;
            const sel = e.target;
            if (!sel || !sel.classList.contains("finesse-selector")) return;
            const row = sel.closest("tr");
            if (!row) return;
            markPhysicalAttackRowManual(row);
            if (typeof scheduleSheetOverridesPersist === "function") {
                scheduleSheetOverridesPersist();
            }
        });
    }

    // 5. Schild Checkbox auf Seite 1
    const shieldPage1 = document.getElementById('shieldActive');
    if (shieldPage1) {
        shieldPage1.addEventListener('change', function() {
            toggleShield(this, 'page1');
            const charData = loadCharacterDataFromStorage();
            applyClassFeatureLogic(charData);
            applyTalentFeatureLogic(charData); // Sicherheitshalber auch hier
        });
    }

    // 5b. Rüstungs-Inventar: auch manuelle Zeilen (ohne onchange aus processInventory)
    // Schilde: Name-Pflicht; Körperrüstung+Schild gleichzeitig bleibt erlaubt
    const armorTable = document.querySelector('[data-dc-table-id="inv_armor"]');
    if (armorTable && !armorTable.dataset.armorExclusiveBound) {
        armorTable.dataset.armorExclusiveBound = "1";
        armorTable.addEventListener('change', (e) => {
            const cb = e.target;
            if (!cb || cb.type !== "checkbox") return;
            const row = cb.closest("tr");
            const isShield = !!(row && (
                cb.classList.contains("inventory-shield-checkbox")
                || isInventoryArmorRowShield(row, cb)
            ));

            // Ohne Namen: Anlegen blockieren (Rüstung und Schild)
            if (row && !inventoryEquipRowHasName(row)) {
                cb.checked = false;
                if (isShield || cb.classList.contains("inventory-shield-checkbox")) {
                    cb.classList.remove("inventory-shield-checkbox");
                }
                if (typeof updateArmorClass === "function") updateArmorClass();
                if (typeof scheduleSheetOverridesPersist === "function") scheduleSheetOverridesPersist();
                return;
            }

            // Schilde mit Namen: Sync über inline onchange → toggleShield
            if (isShield) {
                if (typeof scheduleSheetOverridesPersist === "function") scheduleSheetOverridesPersist();
                return;
            }

            if (row && cb.hasAttribute("data-creator-bound")) {
                validateInventoryCreatorRowBinding(row, 2);
            } else if (row && !cb.hasAttribute("data-creator-bound")) {
                const name = (row.querySelectorAll("input")[1]?.value || "").trim();
                if (name) row.setAttribute("data-inventory-manual", "1");
            }
            handleArmorChange(cb);
            if (typeof scheduleSheetOverridesPersist === "function") scheduleSheetOverridesPersist();
        });
    }
    
    // 6. Dexterity Änderungen (Doppelt gemoppelt, aber sicher ist sicher)
    const dexInput = document.getElementById('dexterityScore');
    if (dexInput) {
        dexInput.addEventListener('input', () => {
            updateArmorClass();
            const charData = loadCharacterDataFromStorage();
            applyClassFeatureLogic(charData);
            applyTalentFeatureLogic(charData); // <--- NEU
        });
    }

    // 7. Live-Update der Angriffsboni bei Änderung der Waffenvertrautheit
    const weaponProfCheckboxes = ['simpleMeleeWeapons', 'simpleRangedWeapons', 'martialMeleeWeapons', 'martialRangedWeapons'];
    weaponProfCheckboxes.forEach(id => {
        const cb = document.getElementById(id);
        if (cb) {
            cb.addEventListener('change', () => {
                updatePhysicalAttacks();
                if (typeof scheduleSheetOverridesPersist === "function") scheduleSheetOverridesPersist();
            });
        }
    });

    const armorProfCheckboxes = ['lightArmor', 'mediumArmor', 'heavyArmor', 'shieldProf'];
    armorProfCheckboxes.forEach(id => {
        const cb = document.getElementById(id);
        if (cb) {
            cb.addEventListener('change', () => {
                if (typeof scheduleSheetOverridesPersist === "function") scheduleSheetOverridesPersist();
            });
        }
    });

    // 8. Live-Update der Größenkategorie ---
    const physSizeInput = document.getElementById('physSize');
    if (physSizeInput) {
        physSizeInput.addEventListener('input', updateSizeCategory);
    }
}

/**
 * Hauptfunktion zum Umschalten des Modus
 */
function toggleEditMode() {
    isEditMode = !isEditMode;
    
    const btn = document.getElementById("editModeBtn");
    
    // Labels holen: Wir greifen auf die GLOBALE Variable currentLanguage zu!
    const t = translations[currentLanguage] || {};
    
    // Fallback-Kette: Erst unsere neuen Labels, dann Default-Text
    const labelEdit = t.editButtonLabel || t.editLabel || "Bearbeiten";
    const labelFinish = t.finishLabel || "Fertig";
    
    if (btn) {
        // Text ändern je nach Modus
        btn.textContent = isEditMode ? labelFinish : labelEdit;
        
        // Klasse toggeln für Farbwechsel (z. B. Blau <-> Rot)
        if (isEditMode) {
            btn.classList.add("active");
        } else {
            btn.classList.remove("active");
        }
    }

    // Sperren aktualisieren (Felder klickbar machen oder sperren)
    applyFieldLocks();
    // applyFieldLocks gibt Equipped-Checkboxen frei — Rüstungs-Exklusivität erneut anwenden
    if (typeof updateArmorLocking === "function") updateArmorLocking();

    // Beim Verlassen des Bearbeitungsmodus: Overrides sofort persistieren
    if (!isEditMode && typeof collectSheetOverridesFromDOM === "function") {
        persistSheetOverrides(collectSheetOverridesFromDOM());
    }
}

/**
 * Wendet die Sperren (readonly/disabled) basierend auf dem Modus an
 */
function applyFieldLocks() {

    // --- BILD-BOXEN STEUERN ---
    const imgContainers = [
        document.getElementById('portraitContainer'),
        document.getElementById('communitySymbolBox')
    ];
    imgContainers.forEach(container => {
        if (!container) return;
        if (isEditMode) {
            container.style.cursor = 'pointer';
            container.classList.add('editable-image-box');
        } else {
            container.style.cursor = 'default';
            container.classList.remove('editable-image-box');
        }
    });

    // Selektor
    const allInputs = document.querySelectorAll("input, textarea, select, [contenteditable]");

    allInputs.forEach(input => {
        const id = input.id;
	const charData = loadCharacterDataFromStorage();

	// --- SPEZIALREGEL FÜR MANUELLEN MODUS ---
        const manualFields = ["class", "background", "subclass", "species"];
        if (charData.isManualMode && manualFields.includes(id)) {
            lockInput(input, !isEditMode); // Im manuellen Modus wie ein normales Feld behandeln
            return;
        }

        // --- SONDERFALL: Content-Editable Divs auf Seite 3 ---
        // Wir prüfen nur, ob das Attribut existiert, egal welchen Wert es gerade hat
        if (input.hasAttribute('contenteditable')) {
            
            // Im Edit-Mode: "true" (String), sonst "false" (String)
            input.contentEditable = isEditMode ? "true" : "false";
            
            // Optisches Feedback
            // Wenn editierbar: leicht grau. Wenn fertig: transparent.
            input.style.backgroundColor = isEditMode ? "rgba(0, 0, 0, 0.05)" : "transparent";
            
            // Cursor anpassen
            input.style.cursor = isEditMode ? "text" : "default";
            
            return; // Hier abbrechen, damit die Standard-Logik unten nicht greift
        }

        // --- SONDERFALL: Spiegel-Felder (Namen auf Seite 2+) ---
        if (input.classList.contains('sync-char-name')) {
            lockInput(input, true); 
            return;
        }
        
        // --- SONDERFALL: Dynamisch erstellte Skills & Saves ---
        if (input.classList.contains("skill-value") || (id && id.endsWith("SavingValue"))) {
            lockInput(input, true); 
            return;
        }
        
        if (id && id.endsWith("Trained")) {
            lockInput(input, !isEditMode);
            return;
        }

        // --- SONDERFALL: Todesrettungswürfe ---
        if (input.closest('.death-saves-box')) {
             lockInput(input, false); 
             return;
        }

        // --- SONDERFALL: Equipped Checkboxen ---
        if (input.classList.contains('equipped-checkbox')) {
            lockInput(input, false);
            return;
        }

        // --- Zauberplatz Checkboxen ---
        if (input.classList.contains('slot-checkbox')) {
            lockInput(input, false); // false = NICHT sperren (also bearbeitbar)
            return;
        }

	// --- Anhang Toggle ---
        if (id === 'generateSpellDesc') {
            lockInput(input, false);
            return;
        }

	// --- Zauber-Tabelle Seite 5 ---
	if (input.classList.contains('spell-input')) {
    	// Diese Felder sollen nur im Edit-Mode bearbeitbar sein
    	    lockInput(input, !isEditMode);
            return;
	}

        // --- Zauberbuch Checkboxen ---
        if (input.classList.contains('spellbook-checkbox')) {
            // Wenn das Attribut "data-locked" existiert -> hart sperren!
            if (input.getAttribute('data-locked') === "true") {
                lockInput(input, true);
            } else {
                // Ansonsten an den Edit-Mode koppeln
                lockInput(input, !isEditMode); 
            }
            return;
        }

        // --- REGULÄRE PRÜFUNG NACH LISTEN ---
        if (alwaysEditableFields.includes(id)) {
            lockInput(input, false);
        } 
        else if (neverEditableFields.includes(id)) {
            lockInput(input, true);
        } 
        else if (editModeOnlyFields.includes(id)) {
            lockInput(input, !isEditMode);
        } 
        else {
            // FALLBACK
            lockInput(input, !isEditMode);
        }
    });

    // Equipped-Checkboxen wurden freigegeben — Rüstungs-Exklusivität wiederherstellen
    if (typeof updateArmorLocking === "function") updateArmorLocking();
}

/**
 * Hilfsfunktion: Setzt Readonly oder Disabled je nach Input-Typ
 */
function lockInput(element, shouldLock) {
    if (element.type === "checkbox" || element.type === "radio" || element.tagName === "SELECT") {
        element.disabled = shouldLock;
    } else {
        // Text, Number, Textarea
        element.readOnly = shouldLock;
        
        // Visuelles Feedback
        if (shouldLock) {
            element.style.backgroundColor = "transparent"; 
            // Optional: element.style.borderBottom = "none"; 
        } else {
            element.style.backgroundColor = "rgba(0, 0, 0, 0.05)"; // Ganz leichtes Grau beim Bearbeiten
        }
    }
}

// 1. Die Weiche (Router), die beim Klick auf den Button aufgerufen wird
function downloadPDF() {

/**
 * Stufe für Dateinamen (Export/PDF), z. B. "L6" — Bogen-Anzeige.
 */
function getCharacterSheetLevelFilenameToken() {
    const fromInput = document.getElementById("level")?.value;
    const fromLs = (typeof localStorage !== "undefined") ? localStorage.getItem("level") : null;
    let level = parseInt(fromInput != null && String(fromInput).trim() !== "" ? fromInput : fromLs, 10);
    if (!Number.isFinite(level) || level < 1) level = 1;
    if (level > 20) level = 20;
    return `L${level}`;
}

// 2. Hilfsfunktion: Generiert den sauberen Dateinamen (z.B. "Fabiano_L6_Character-Sheet_08MAR2026")
function generateSafeFilename() {
    const nameInput = document.getElementById('characterName');
    let charName = nameInput && nameInput.value ? nameInput.value.trim() : "Unbekannt";

    // Sonderzeichen durch "_" ersetzen (Filtert: \ / : * ? " < > | , ;)
    let safeName = charName.replace(/[\\/:\*\?"<>|;,]/g, '_');
    // Doppelte Unterstriche zusammenfassen
    safeName = safeName.replace(/_+/g, '_');
    // Leerzeichen direkt am Unterstrich entfernen
    safeName = safeName.replace(/_ /g, '_').replace(/ _/g, '_');

    // Datum generieren
    const d = new Date();
    const day = String(d.getDate()).padStart(2, '0');
    const monthArr = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
    const month = monthArr[d.getMonth()];
    const year = d.getFullYear();
    const dateString = `${day}${month}${year}`;
    const levelToken = getCharacterSheetLevelFilenameToken();

    return `${safeName}_${levelToken}_Character-Sheet_${dateString}`;
}

// 3. MODUS 1: Nativer Browser-Druck (Der neue Goldstandard)
function printPDFNatively() {
    const originalTitle = document.title; // Aktuellen Tab-Titel merken (Übersetzung)
    const printFilename = generateSafeFilename();

    // Genialer Trick: Wir ändern den Titel der Website kurz in den gewünschten Dateinamen.
    // Der Browser übernimmt diesen Titel dann automatisch als Vorschlag zum Speichern!
    document.title = printFilename;

    // Druck-Dialog öffnen
    window.print();

    // Nach einem minimalen Delay setzen wir den Titel wieder auf das Original zurück,
    // damit der Tab im Browser wieder normal heißt.
    setTimeout(() => {
        document.title = originalTitle;
    }, 500);
}

// 4. MODUS 0: Alte Screenshot-Methode (html2pdf.js)
async function generatePDFviaScreenshot() {
    // Prüfen, ob das Gerät ein Smartphone oder Tablet ist
    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

    // Zoom-Prüfung NUR auf dem PC/Mac durchführen
    if (!isMobile) {
        const isDefaultZoom = Math.abs(1 - window.devicePixelRatio) < 0.02;
        if (!isDefaultZoom) {
            const t = translations[currentLanguage] || translations['de'];
            const warningMessage = t['zoomWarningText'] || "Hinweis: Dein System oder Browser verwendet eine Bildschirmskalierung (Zoom).\n\nDadurch könnte das PDF eventuell leicht verschoben aussehen. Für das perfekte Ergebnis wird ein Browser-Zoom von 100% empfohlen (Strg+0).\n\nMöchtest du das PDF trotzdem jetzt herunterladen?";
            
            const proceed = confirm(warningMessage);
            if (!proceed) return; 
        }
    }

    const root = document.getElementById('sheetRoot');
    if (!root) {
        alert('sheetRoot nicht gefunden.');
        return;
    }

    // Name via Hilfsfunktion generieren und Dateiendung anhängen
    const finalFilename = generateSafeFilename() + ".pdf";

    document.body.classList.add('pdf-export-mode');

    const options = {
        filename: finalFilename,
        margin: 0,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { 
            scale: 2,           
            useCORS: true, 
            scrollY: 0
        },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
    };

    try {
        const worker = html2pdf().from(root).set(options).toPdf();
        await worker.get('pdf').then(pdf => {
            const getTotal = () => {
                if (typeof pdf.getNumberOfPages === 'function') return pdf.getNumberOfPages();
                if (pdf.internal && pdf.internal.getNumberOfPages) return pdf.internal.getNumberOfPages();
                return null;
            };

            const total = getTotal();
            const finalAllowedPages = totalPages + appendixTotalPages;

            if (!total || total <= finalAllowedPages) return;

            if (typeof pdf.deletePage === 'function') {
                for (let p = total; p > finalAllowedPages; p--) {
                    pdf.deletePage(p);
                }
            } else {
                console.warn('pdf.deletePage nicht verfügbar.');
            }
        });
        await worker.save();
    } catch (e) {
        console.error(e);
        alert('PDF-Export ist fehlgeschlagen. Siehe Konsole für Details.');
    } finally {
        document.body.classList.remove('pdf-export-mode');
    }
}

function setupImageUploads() {
    const portraitContainer = document.getElementById('portraitContainer');
    const portraitInput = document.getElementById('portraitInput');
    
    const symbolContainer = document.getElementById('communitySymbolBox');
    const symbolInput = document.getElementById('symbolInput');

    if (portraitContainer && portraitInput) {

        });
        // 2. Datei ausgewählt -> Verarbeiten
        portraitInput.addEventListener('change', (e) => processAndSaveImage(e, portraitContainer, 'portraitImage', 800));
    }

    if (symbolContainer && symbolInput) {
        symbolContainer.addEventListener('click', () => {
            if (isEditMode) symbolInput.click();
        });
        symbolInput.addEventListener('change', (e) => processAndSaveImage(e, symbolContainer, 'symbolImage', 400));
    }
}

// Lädt das Bild, verkleinert es, speichert es und zeigt es an
function processAndSaveImage(event, container, storageKey, maxSize) {
    const file = event.target.files[0];
    if (!file) return;

    // Nur Bilder zulassen
    if (!file.type.startsWith('image/')) {
        alert("Bitte nur Bilder (JPG, PNG, WEBP) hochladen.");
        return;
    }

    const reader = new FileReader();
    reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
            // A. Canvas erstellen für Skalierung
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;

            // B. Proportionen beibehalten und verkleinern
            if (width > height) {
                if (width > maxSize) {
                    height = Math.round(height * (maxSize / width));
                    width = maxSize;
                }
            } else {
                if (height > maxSize) {
                    width = Math.round(width * (maxSize / height));
                    height = maxSize;
                }
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            // C. In Base64 JPG komprimieren (80% Qualität ist super klein & scharf)
            const dataUrl = canvas.toDataURL('image/jpeg', 0.8);

            // D. Bild anzeigen
            applyImageToContainer(container, dataUrl);

            // E. Speichern (Local Storage)
            try {
                localStorage.setItem(storageKey, dataUrl);
            } catch (err) {
                console.warn("LocalStorage voll:", err);
                alert("Speicherlimit erreicht. Bitte ein noch kleineres Bild versuchen.");
            }
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
}

// Setzt das Bild als CSS Background
function applyImageToContainer(container, dataUrl) {
    if (!container || !dataUrl) return;
    container.style.backgroundImage = `url(${dataUrl})`;
    container.classList.add('has-image');
}

// Lädt die Bilder beim Start aus dem Speicher
function loadSavedImages() {
    const portraitData = localStorage.getItem('portraitImage');
    if (portraitData) applyImageToContainer(document.getElementById('portraitContainer'), portraitData);

    const symbolData = localStorage.getItem('symbolImage');
    if (symbolData) applyImageToContainer(document.getElementById('communitySymbolBox'), symbolData);
}

// Funktion zum Öffnen/Schließen des FAB-Menüs
document.addEventListener('DOMContentLoaded', function() {
    const container = document.querySelector('.fab-container');
    const trigger = document.querySelector('.fab-trigger');

    if (trigger && container) {
        trigger.addEventListener('click', function(e) {
            e.stopPropagation(); // Verhindert, dass der Klick sofort wieder schließt
            container.classList.toggle('open');
        });

        // Schließt das Menü, wenn man irgendwo anders auf die Seite klickt
        document.addEventListener('click', function(e) {
            if (!container.contains(e.target)) {
                container.classList.remove('open');
            }
        });
    }
});

let sheetOverridesPersistTimer = null;

/**
 * Liest gespeicherte Bogen-Overrides (Fallback: legacy import_overrides).
 * @returns {object|null}
 */
function getSheetOverridesFromStorage() {
    const key = (typeof SHEET_OVERRIDES_STORAGE_KEY !== "undefined")
        ? SHEET_OVERRIDES_STORAGE_KEY
        : "sheet_overrides";
    const raw = localStorage.getItem(key) || localStorage.getItem("import_overrides");
    if (!raw) return null;
    try {
        return JSON.parse(raw);
    } catch (e) {
        console.warn("Sheet-Overrides konnten nicht gelesen werden:", e);
        return null;
    }
}

/** Schreibt Overrides dauerhaft in localStorage (Refresh-sicher). */
function persistSheetOverrides(overrides) {
    if (!overrides || typeof overrides !== "object") return;
    const key = (typeof SHEET_OVERRIDES_STORAGE_KEY !== "undefined")
        ? SHEET_OVERRIDES_STORAGE_KEY
        : "sheet_overrides";
    try {
        localStorage.setItem(key, JSON.stringify(overrides));
        localStorage.removeItem("import_overrides");
    } catch (e) {
        console.warn("Sheet-Overrides konnten nicht gespeichert werden:", e);
    }
}

/** Debounced Persist nach manuellen Änderungen im Bearbeitungsmodus. */
function scheduleSheetOverridesPersist() {
    if (sheetOverridesPersistTimer) clearTimeout(sheetOverridesPersistTimer);
    sheetOverridesPersistTimer = setTimeout(() => {
        sheetOverridesPersistTimer = null;
        if (typeof collectSheetOverridesFromDOM === "function") {
            persistSheetOverrides(collectSheetOverridesFromDOM());
        }
    }, 400);
}

/**
 * Sammelt alle UI-Overrides vom aktuellen Bogen (Deep-Scan).
 * @returns {object}
 */
function collectSheetOverridesFromDOM() {
    const uiOverrides = {
        inputs: {},
        checkboxes: {},
        tableData: [],
        attackTable: []
    };

    document.querySelectorAll('input[type="text"], textarea').forEach(el => {
        if (el.id) uiOverrides.inputs[el.id] = el.value;
    });

    document.querySelectorAll('input[type="checkbox"]').forEach(el => {
        if (el.id) uiOverrides.checkboxes[el.id] = el.checked;
    });

    const attackTable = getPhysicalAttacksTable();
    if (attackTable) {
        const rows = attackTable.querySelectorAll('tbody tr');
        rows.forEach((row) => {
            const rowData = [];
            const inputs = row.querySelectorAll('input');
            inputs.forEach(inp => rowData.push(inp.value));
            const sel = row.querySelector('select.finesse-selector');
            uiOverrides.attackTable.push({
                values: rowData,
                finesse: sel ? sel.value : null,
                dbLinked: row.hasAttribute("data-db-linked"),
                manualOverride: row.hasAttribute("data-attack-manual")
            });
        });
    }

    const allTables = document.querySelectorAll('table');
    allTables.forEach((table, tableIndex) => {
        if (table.classList.contains('attack-table') && table.closest('.inventory-box') === null) return;
        if (table.getAttribute('data-dc-table-id') === 'physical_attacks') return;
        const tableId = getDcSheetTableExportId(table);
        const rows = table.querySelectorAll('tbody tr');
        rows.forEach((row, rowIndex) => {
            const cells = row.querySelectorAll('td');
            cells.forEach((cell, cellIndex) => {
                const input = cell.querySelector('input');
                if (!input) return;
                // Zauberbuch: Vorbereitet-Status kommt aus preparedSpells (base), nicht aus Overrides
                if (input.classList.contains('spellbook-checkbox')) return;
                const entry = {
                    t: tableIndex,
                    r: rowIndex,
                    c: cellIndex,
                    v: input.value,
                    chk: input.type === 'checkbox' ? input.checked : null
                };
                if (tableId) entry.tableId = tableId;
                uiOverrides.tableData.push(entry);
            });
        });
    });

    const deathSaveBox = document.querySelector('.death-saves-box');
    if (deathSaveBox) {
        uiOverrides.deathSaves = Array.from(deathSaveBox.querySelectorAll('input[type="checkbox"]')).map(c => c.checked);
    }

    uiOverrides.containers = {
        classFeatures: document.getElementById('classFeaturesContent')?.innerHTML,
        subclassFeatures: document.getElementById('subclassFeaturesContent')?.innerHTML,
        feats: document.getElementById('featsContent')?.innerHTML,
        speciesTraits: document.getElementById('speciesTraitsContent')?.innerHTML,
        communityDesc: document.getElementById('communityDesc')?.innerHTML
    };

    uiOverrides.inventoryEquipped = collectInventoryEquippedStates();

    return uiOverrides;
}

/** Inventar-Tabellen mit Anlege-Checkbox (Seite 2). */
const INVENTORY_EQUIP_TABLE_IDS = ["inv_weapons", "inv_armor"];

/**
 * Anlege-Status pro Zeile für Waffen/Rüstung sammeln (zuverlässiger als tableData-Zellen).
 * @returns {{ inv_weapons?: boolean[], inv_armor?: boolean[] }}
 */
function collectInventoryEquippedStates() {
    const result = {};
    INVENTORY_EQUIP_TABLE_IDS.forEach(tableId => {
        const table = document.querySelector(`[data-dc-table-id="${tableId}"]`);
        if (!table) return;
        result[tableId] = Array.from(table.querySelectorAll("tbody tr")).map(row => {
            const cb = row.querySelector('input[type="checkbox"]');
            return cb ? cb.checked : false;
        });
    });
    return result;
}

/**
 * Waffen-/Rüstungs-Inventar aus Overrides anwenden (Text + Anlege-Status).
 * Muss nach allen Auto-Updates laufen, damit manuelle Zeilen nicht überschrieben werden.
 * @param {object} overrides
 */
function applyInventoryEquipTableOverrides(overrides) {
    if (!overrides || typeof overrides !== "object") return;

    // 1. Zellwerte (Menge, Name) aus tableData
    if (Array.isArray(overrides.tableData)) {
        overrides.tableData.forEach(item => {
            if (!item || (item.tableId !== "inv_weapons" && item.tableId !== "inv_armor")) return;
            const table = resolveDcSheetTableForImport(item);
            if (!table) return;
            const row = table.querySelectorAll("tbody tr")[item.r];
            if (!row) return;
            const cell = row.querySelectorAll("td")[item.c];
            const input = cell?.querySelector("input");
            if (!input || input.type === "checkbox") return;
            input.value = item.v;
            if (!input.hasAttribute("data-creator-bound")) {
                const hasName = (item.v || "").trim() !== "";
                if (hasName) row.setAttribute("data-inventory-manual", "1");
            }
        });
    }

    // 1b. Ersteller-Kopplung nach Namens-Override auflösen (vor Anlege-Status)
    INVENTORY_EQUIP_TABLE_IDS.forEach(tableId => {
        const boxId = tableId === "inv_weapons" ? 1 : 2;
        const table = document.querySelector(`[data-dc-table-id="${tableId}"]`);
        if (!table) return;
        table.querySelectorAll("tbody tr").forEach(row => {
            validateInventoryCreatorRowBinding(row, boxId, { skipRefresh: true });
        });
    });

    // 2. Anlege-Checkboxen (dediziertes Array hat Vorrang)
    const applyEquippedArray = (tableId, states) => {
        if (!Array.isArray(states)) return;
        const table = document.querySelector(`[data-dc-table-id="${tableId}"]`);
        if (!table) return;
        const rows = table.querySelectorAll("tbody tr");
        states.forEach((checked, rIdx) => {
            const row = rows[rIdx];
            if (!row) return;
            const cb = row.querySelector('input[type="checkbox"]');
            if (cb) cb.checked = !!checked;
        });
    };

    if (overrides.inventoryEquipped && typeof overrides.inventoryEquipped === "object") {
        INVENTORY_EQUIP_TABLE_IDS.forEach(tableId => {
            applyEquippedArray(tableId, overrides.inventoryEquipped[tableId]);
        });
    } else if (Array.isArray(overrides.tableData)) {
        // Legacy: nur Checkbox-Spalte (c === 2)
        overrides.tableData.forEach(item => {
            if (!item || item.c !== 2) return;
            if (item.tableId !== "inv_weapons" && item.tableId !== "inv_armor") return;
            if (item.chk === null) return;
            const table = resolveDcSheetTableForImport(item);
            if (!table) return;
            const row = table.querySelectorAll("tbody tr")[item.r];
            const cb = row?.querySelector('input[type="checkbox"]');
            if (cb) cb.checked = !!item.chk;
        });
    }

    // 2b. Schild-Marker nach Namens-Overrides neu setzen (Ex-Schild ≠ Schild)
    if (typeof syncAllInventoryArmorShieldStates === "function") {
        syncAllInventoryArmorShieldStates();
    }

    // 3. Abgeleitete Werte aus Anlege-Status (ohne setProficiencies — läuft danach separat)
    if (typeof updatePhysicalAttacks === "function") updatePhysicalAttacks();
    if (typeof updateArmorClass === "function") updateArmorClass();
}

/**
 * Wendet gespeicherte Physische-Angriffe-Overrides an (muss nach allen Auto-Updates laufen).
 * @param {Array} attackTableData
 */
function applyPhysicalAttacksTableOverrides(attackTableData) {
    if (!Array.isArray(attackTableData) || !attackTableData.length) return;
    const attackTable = getPhysicalAttacksTable();
    if (!attackTable) return;

    const rows = attackTable.querySelectorAll('tbody tr');
    attackTableData.forEach((savedRow, rIdx) => {
        const row = rows[rIdx];
        if (!row || !savedRow) return;

        const inputs = row.querySelectorAll('input');
        (savedRow.values || []).forEach((val, iIdx) => {
            if (inputs[iIdx]) inputs[iIdx].value = val;
        });

        const sel = row.querySelector('select.finesse-selector');
        if (sel && savedRow.finesse) sel.value = savedRow.finesse;

        if (savedRow.dbLinked) row.setAttribute('data-db-linked', 'true');
        else row.removeAttribute('data-db-linked');

        const hasContent = (savedRow.values || []).some(v => (v || "").trim() !== "");
        if (savedRow.manualOverride || (hasContent && !savedRow.dbLinked)) {
            row.setAttribute('data-attack-manual', '1');
        } else {
            row.removeAttribute('data-attack-manual');
        }
    });
}

/**
 * Hilfsfunktion für das Datumsformat (z.B. 10MAY2026)
 */
function getFormattedDateJSON() {
    const d = new Date();
    const day = String(d.getDate()).padStart(2, '0');
    const months = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
    const month = months[d.getMonth()];
    const year = d.getFullYear();
    return `${day}${month}${year}`;
}

/**
 * Stabile Tabellen-ID für Export/Import (id-Attribut oder data-dc-table-id).
 * @param {HTMLTableElement} table
 * @returns {string|null}
 */
function getDcSheetTableExportId(table) {
    if (!table) return null;
    if (table.id) return String(table.id);
    const dataId = table.getAttribute("data-dc-table-id");
    return dataId ? String(dataId) : null;
}

/**
 * Tabelle für Override-Import auflösen (tableId bevorzugt, sonst Legacy-Index t).
 * @param {{ tableId?: string, t?: number }} item
 * @returns {HTMLTableElement|null}
 */
function resolveDcSheetTableForImport(item) {
    if (!item) return null;
    if (item.tableId) {
        const byId = document.getElementById(item.tableId);
        if (byId && byId.tagName === "TABLE") return byId;
        const byData = document.querySelector(
            `table[data-dc-table-id="${CSS.escape(String(item.tableId))}"]`
        );
        if (byData) return byData;
    }
    if (typeof item.t === "number") {
        const allTables = document.querySelectorAll("table");
        return allTables[item.t] || null;
    }
    return null;
}

/**
 * Baut Export-Payload (meta/base/overrides) ohne Download — auch für Stufenaufstieg-Snapshot.
 * @returns {{ meta: object, base: object, overrides: object, dc?: object }}
 */
function buildCharacterSheetExportPayload() {
    console.log("Starte Deep-Scan für Export-Payload...");

    const storageKeys = [
        "characterName", "playerName", "class", "background", "species", "lineage", "ancestry", "level", "ruleLevel", "xp",
        "strengthScore", "dexterityScore", "constitutionScore", "intelligenceScore", "wisdomScore", "charismaScore",
        "classForm", "equipment", "purse", "languages", "cantrips", "spellbookSpells", "preparedSpells", "favoredSpells",
        "feat_background", "feat_species",
        "tool_background", "instrument_background", "game_background",
        "backgroundAttributeBonuses",
        "levelUpReconstruction",
        "speciesFreeChoices", "spellcastingAbility_species", "spellcastingAbility_talent",
        "story", "deityId", "deityName", "communityName", "communityDesc",
        "alignment", "personalityTraits",
        "gender", "age", "eyeColor", "hairColor", "skinTone", "size", "appearanceDescription",
        "portraitImage", "symbolImage", "currentLanguage", "customClassRuntime", "customSubclassRuntime",
        "customBackgroundRuntime", "customSpellPackRuntime", "customFeatPackRuntime",
        "customSpeciesRuntime",
        "dcCharacterPackageId", "dcCharacterPackageCreatedAt"
    ];

    const baseStorage = {};
    storageKeys.forEach(key => {
        baseStorage[key] = localStorage.getItem(key);
    });

    // Anzeige-Stufe/XP aus UI (falls manuell angepasst)
    const levelEl = document.getElementById("level");
    const xpEl = document.getElementById("xp");
    if (levelEl && levelEl.value !== "") baseStorage.level = levelEl.value;
    if (xpEl && xpEl.value !== "") baseStorage.xp = xpEl.value;
    if (!baseStorage.ruleLevel && baseStorage.level) {
        baseStorage.ruleLevel = localStorage.getItem("ruleLevel") || baseStorage.level;
    }

    const uiOverrides = collectSheetOverridesFromDOM();

    let packageId = localStorage.getItem("dcCharacterPackageId");
    let packageCreatedAt = localStorage.getItem("dcCharacterPackageCreatedAt");
    if (!packageId && typeof createDcPackageId === "function") {
        packageId = createDcPackageId();
        packageCreatedAt = new Date().toISOString();
        localStorage.setItem("dcCharacterPackageId", packageId);
        localStorage.setItem("dcCharacterPackageCreatedAt", packageCreatedAt);
        baseStorage.dcCharacterPackageId = packageId;
        baseStorage.dcCharacterPackageCreatedAt = packageCreatedAt;
    }

    const characterName = document.getElementById('characterName')?.value
        || baseStorage.characterName
        || "Unnamed";

    const flatPayload = {
        meta: { app: "DiceCharacters", date: new Date().toISOString(), version: "1.5" },
        base: baseStorage,
        overrides: uiOverrides
    };

    const finalExport = (typeof wrapCharacterSheetExport === "function")
        ? wrapCharacterSheetExport(flatPayload, {
            packageId,
            packageCreatedAt,
            characterName
        })
        : flatPayload;

    return finalExport;
}

/**
 * Exportiert den Charakter als JSON mit Deep-Scan der UI-Werte.
 * Neu: DC-Envelope; alte Bögen bleiben beim Import ohne Envelope gültig.
 */
function exportCharacterJSON() {
    const finalExport = buildCharacterSheetExportPayload();
    const flat = finalExport?.payload || finalExport;

    // Base + Overrides in localStorage spiegeln (Refresh-sicher)
    if (flat?.base) {
        Object.keys(flat.base).forEach(key => {
            if (flat.base[key] !== null && flat.base[key] !== undefined) {
                localStorage.setItem(key, flat.base[key]);
            }
        });
    }
    if (flat?.overrides) {
        persistSheetOverrides(flat.overrides);
    }

    const characterName = document.getElementById('characterName')?.value
        || flat?.base?.characterName
        || "Unnamed";

    let safeName = String(characterName).trim().replace(/[\\/:\*\?"<>|;,]/g, '_');
    if (safeName === "") safeName = "Unnamed";
    safeName = safeName.replace(/_+/g, '_');

    const dateStr = getFormattedDateJSON();
    const levelToken = getCharacterSheetLevelFilenameToken();
    const finalFilename = `${safeName}_${levelToken}_Character_Data_${dateStr}.json`;

    downloadJsonFile(finalFilename, finalExport);
}

/** Hilfs-Download für Bogen-Export (wiederverwendbar). */
function downloadJsonFile(filename, dataObj) {
    const blob = new Blob([JSON.stringify(dataObj, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}

/**
 * Schreibt validiertes Charakterbogen-Payload in LocalStorage und lädt neu.
 * @param {object} sheetPayload – { meta, base, overrides }
 * @param {object|null} envelope – dc-Block oder null (Legacy)
 */
function applyCharacterSheetImport(sheetPayload, envelope) {
    if (!sheetPayload?.meta || sheetPayload.meta.app !== "DiceCharacters") {
        throw new Error("invalidCharacterSheet");
    }
    if (!sheetPayload.base || typeof sheetPayload.base !== "object") {
        throw new Error("invalidCharacterSheet");
    }

    localStorage.clear();

    Object.keys(sheetPayload.base).forEach(key => {
        if (sheetPayload.base[key] !== null && sheetPayload.base[key] !== undefined) {
            localStorage.setItem(key, sheetPayload.base[key]);
        }
    });

    // Legacy: ruleLevel fehlt → aus level übernehmen
    if (!localStorage.getItem("ruleLevel") && localStorage.getItem("level")) {
        localStorage.setItem("ruleLevel", localStorage.getItem("level"));
    }

    // Envelope-IDs wiederherstellen (neu); Legacy bekommt IDs beim nächsten Export
    if (envelope?.packageId) {
        localStorage.setItem("dcCharacterPackageId", envelope.packageId);
        if (envelope.createdAt) {
            localStorage.setItem("dcCharacterPackageCreatedAt", envelope.createdAt);
        }
    }

    localStorage.setItem(SHEET_OVERRIDES_STORAGE_KEY, JSON.stringify(sheetPayload.overrides || {}));
    localStorage.removeItem("import_overrides");
    window.location.reload();
}

/**
 * Verarbeitet den Upload einer Charakterbogen-JSON.
 * Akzeptiert neue Envelope-Dateien und alte Bögen ohne dc-Block.
 */
function importCharacterJSON(event) {
    const file = event.target.files && event.target.files[0];
    if (!file) return;

    const finish = () => {
        event.target.value = "";
    };

    if (typeof readAndValidateDcPackageFile !== "function") {
        // Fallback ohne dcPackage.js (sollte nicht vorkommen)
        const reader = new FileReader();
        reader.onload = function (e) {
            try {
                const importedData = JSON.parse(e.target.result);
                if (importedData.meta && importedData.meta.app === "DiceCharacters") {
                    applyCharacterSheetImport(importedData, null);
                } else {
                    alert(typeof alertMessageForDcPackageError === "function"
                        ? alertMessageForDcPackageError("unknownFormat")
                        : "Ungültiges Dateiformat!");
                }
            } catch (err) {
                console.error("Fehler beim Import:", err);
                alert(typeof alertMessageForDcPackageError === "function"
                    ? alertMessageForDcPackageError("parseError")
                    : "Die Datei konnte nicht gelesen werden.");
            } finally {
                finish();
            }
        };
        reader.readAsText(file);
        return;
    }

    readAndValidateDcPackageFile(file, {
        expectedType: DC_PACKAGE_TYPE.CHARACTER_SHEET
    }).then(result => {
        try {
            if (!result.ok) {
                alert(result.message || alertMessageForDcPackageError("unknownFormat"));
                return;
            }

            const applySheet = (payload, envelope) => {
                applyCharacterSheetImport(payload, envelope || null);
            };

            // Alle verknüpften Custom-Typen erneut per Modal nachfordern
            // (LS-/Embed allein erfüllt Import-Deps nicht; Base-Scan fängt fehlende Runtime ab)
            const fromEnvelope = Array.isArray(result.envelope?.dependencies)
                ? result.envelope.dependencies
                : [];
            const fromBase = (typeof buildCharacterSheetDependencies === "function")
                ? buildCharacterSheetDependencies(result.payload?.base || {})
                : [];
            const byType = new Map();
            fromBase.forEach(d => {
                if (d && d.packageType) byType.set(d.packageType, d);
            });
            // Envelope gewinnt bei gleichem Typ (explizite packageId)
            fromEnvelope.forEach(d => {
                if (d && d.packageType) byType.set(d.packageType, d);
            });
            const requiredDeps = Array.from(byType.values())
                .filter(d => d && d.required !== false);

            if (!requiredDeps.length || typeof beginDcPackageImportWithDependencies !== "function") {
                applySheet(result.payload, result.envelope || null);
                return;
            }

            beginDcPackageImportWithDependencies({
                envelope: result.envelope || null,
                payload: result.payload,
                detectedType: DC_PACKAGE_TYPE.CHARACTER_SHEET,
                requiredDeps,
                onApply: applySheet
            });
        } catch (err) {
            console.error("Fehler beim Import:", err);
            alert(alertMessageForDcPackageError("invalidCharacterSheet"));
        } finally {
            finish();
        }
    });
}

/**
 * Wendet die manuellen Anpassungen über die generierten Daten an
 */
function applyImportOverrides() {
    const overrides = getSheetOverridesFromStorage();
    if (!overrides) return;
    const fromLevelUp = isSheetFromLevelUpNavigation();

    // 1. Basis-Werte & Checkboxen
    if (overrides.inputs) {
        const classFormData = (typeof loadCharacterDataFromStorage === "function")
            ? loadCharacterDataFromStorage()?.classForm
            : null;
        const hasWeaponMasteryData = Array.isArray(classFormData?.weaponMastery)
            && classFormData.weaponMastery.length > 0;

        Object.keys(overrides.inputs).forEach(id => {
            if (fromLevelUp && LEVEL_UP_STALE_OVERRIDE_INPUT_IDS.has(id)) return;
            // Regel-abgeleitete Werte (TP/TW/XP) nie blind aus Overrides — werden unten neu berechnet
            if (SHEET_RULE_DERIVED_INPUT_IDS.has(id)) return;
            // Leerer Unterklassen-Override darf berechneten Namen aus classForm nicht löschen
            if (id === "subclass" && !overrides.inputs[id]) {
                const charData = (typeof loadCharacterDataFromStorage === "function")
                    ? loadCharacterDataFromStorage()
                    : null;
                if (charData?.classForm?.subclass) return;
            }
            // Leere Override-Werte nicht über berechnete Regeldaten legen
            if (id === "weaponMasteries" && hasWeaponMasteryData && !overrides.inputs[id]) {
                return;
            }
            const el = document.getElementById(id);
            if (el) el.value = overrides.inputs[id];
        });
    }
    if (overrides.checkboxes) {
        Object.keys(overrides.checkboxes).forEach(id => {
            // Waffen-/Rüstungsvertrautheit kommt am Ende (nach Regel-Reapply)
            if (isSheetProficiencyCheckboxId(id)) return;
            const el = document.getElementById(id);
            if (el) el.checked = overrides.checkboxes[id];
        });
    }

    // Regelbasierte Rüstungs-/Waffenvertrautheit (Basis) — manuelle Overrides folgen am Ende
    reapplySheetArmorWeaponProficienciesFromRuleData();

    // 2. Tabellen (Inventar & Zauber) — Waffen/Rüstung-Anlege-Status kommt am Ende
    if (overrides.tableData) {
        overrides.tableData.forEach(item => {
            if (item.tableId === "inv_weapons" || item.tableId === "inv_armor") return;
            if (isSpellbookSheetTableId(item.tableId)) return;
            const table = resolveDcSheetTableForImport(item);
            if (table) {
                const row = table.querySelectorAll('tbody tr')[item.r];
                if (row) {
                    const cell = row.querySelectorAll('td')[item.c];
                    const input = cell?.querySelector('input');
                    if (input) {
                        if (input.classList.contains('spellbook-checkbox')) return;
                        input.value = item.v;
                        if (item.chk !== null) input.checked = item.chk;
                    }
                }
            }
        });
    }

    // 3. Todesrettungswürfe
    if (overrides.deathSaves) {
        const checks = document.querySelectorAll('.death-saves-box input[type="checkbox"]');
        overrides.deathSaves.forEach((val, i) => { if (checks[i]) checks[i].checked = val; });
    }

    // 4. Merkmale
    if (overrides.containers) {
        Object.keys(overrides.containers).forEach(key => {
            // Volksmerkmale immer aus Regeldaten (processSpeciesTraits) — Override wäre stufenveraltet
            if (key === "speciesTraits") return;
            // Nach Stufenaufstieg: Klassen-/Talent-Blöcke ebenfalls frisch belassen
            if (fromLevelUp && (key === "classFeatures" || key === "subclassFeatures" || key === "feats")) {
                return;
            }
            const el = document.getElementById(key + "Content") || document.getElementById(key);
            if (el) el.innerHTML = overrides.containers[key];
        });
    }

    // 5. Abgeleitete Werte neu berechnen (Checkbox-Overrides ändern Skill-/Save-Anzeigen)
    if (typeof updateModifiers === "function") {
        updateModifiers();
    }
    if (typeof updateProficiencyBonus === "function") {
        updateProficiencyBonus();
    }

    // 6. Regel-abgeleitete Stats (TP/TW/XP) immer neu berechnen — Spezies-/Talent-Boni erhalten
    const ruleDerivedSnapshot = overrides.inputs
        ? {
            maxHP: overrides.inputs.maxHP,
            maxHD: overrides.inputs.maxHD,
            currentHP: overrides.inputs.currentHP,
            xp: overrides.inputs.xp
        }
        : null;
    refreshSheetRuleDerivedStats(ruleDerivedSnapshot);

    // 7. Physische Angriffe (vor Vertrautheit/Inventar — finale Werte kommen am Ende)
    if (overrides.attackTable) {
        applyPhysicalAttacksTableOverrides(overrides.attackTable);
    }

    // 8. Waffen-/Rüstungsvertrautheit (Seite 1) — gespeicherter Bogenzustand hat Vorrang
    applySheetProficiencyCheckboxOverrides(overrides);

    // 9. Waffen-/Rüstungs-Inventar (Text + Anlege-Checkbox) — vor Feature-Handler-Reapply
    applyInventoryEquipTableOverrides(overrides);

    // 10. Feature-Handler (featureHandlers / talentHandlers / speciesHandlers) — ZULETZT
    reapplyAllSheetFeatureHandlers(loadCharacterDataFromStorage());

    // 10b. Sprachen aus Regeldaten (classForm.languages darf alten Override nicht veralten lassen)
    const charDataForLangs = loadCharacterDataFromStorage();
    if (charDataForLangs) {
        const languagesText = buildLanguagesListDisplayText(charDataForLangs);
        const languagesEl = document.getElementById("languagesList");
        if (languagesEl) languagesEl.value = languagesText;
    }

    // 11. Zauberanhang-Schalter: bei fehlenden Zaubern Checkbox zurücksetzen
    syncSpellAppendixToggleState(loadCharacterDataFromStorage());

    // 12. Zauberbuch (Seite 6) aus preparedSpells — Overrides dürfen Vorbereitet-Status nicht überschreiben
    const charDataForSpellbook = loadCharacterDataFromStorage();
    if (charDataForSpellbook) {
        processSpellbookPage(charDataForSpellbook);
        if (typeof applyFieldLocks === "function") applyFieldLocks();
    }

    // Overrides dauerhaft persistieren (nicht löschen — sonst gehen manuelle Änderungen beim Refresh verloren)
    persistSheetOverrides(collectSheetOverridesFromDOM());
    console.log("Deep Import Final mit korrektem Attack-Restore abgeschlossen.");
}
