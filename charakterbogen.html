<script>

/* ==========================================================================
   GLOBAL SETTINGS
   ========================================================================== */
// Hier stellen wir die Sprache ein. Alle Funktionen greifen darauf zu.
let currentLanguage = 'de';
let totalPages = 6; // Hier änderst du die Zahl zentral
window.spellAppendixPages = {};

// PDF-Export Methode
// 1 = nativer Browser-Druck (Standard, extrem robust)
// 0 = Screenshot-Methode via html2pdf.js (altes Verhalten)
const PDF_OPTION = 1;

/* ==========================================================================
   AREAL 1: INITIALISIERUNG (CONTROLLER)
   ========================================================================== */

/* Nach Stufenaufstieg: bfcache-Restore vermeiden (sonst alter Bogen bis F5) */
window.addEventListener("pageshow", function (event) {
    if (event.persisted) {
        window.location.reload();
    }
});

window.onload = function() {
    console.log('Initialisierung gestartet...');

    /* ==========================================================
       SPRACHE AUS LOCAL STORAGE AUSLESEN
       ========================================================== */
    const savedLang = localStorage.getItem("currentLanguage");
    // Wir prüfen, ob eine Sprache übergeben wurde UND ob wir dafür Übersetzungen haben
    if (savedLang && translations[savedLang]) {
        currentLanguage = savedLang;
        console.log("Sprache aus Ersteller geladen:", currentLanguage);
    } else {
        currentLanguage = 'de'; // Fallback / Default
        console.log("Keine (gültige) Sprache übergeben. Standard 'de' wird genutzt.");
    }
    /* ========================================================== */

    // Custom Features aus LocalStorage hydratisieren (vor Übersetzungen / Klassenlogik)
    if (typeof hydrateAllCustomFeaturesSheetFromStorage === "function") {
        hydrateAllCustomFeaturesSheetFromStorage();
    } else if (typeof hydrateAllCustomFeaturesSheetRuntimeFromStorage === "function") {
        hydrateAllCustomFeaturesSheetRuntimeFromStorage();
    } else if (typeof hydrateCustomClassRuntimeFromStorage === "function") {
        hydrateCustomClassRuntimeFromStorage();
    }

    // 1. Statische Bilder laden
    document.getElementById('dragonDivider').src = dragonDividerImageBase64;
    document.getElementById('shieldIcon').src = shieldImageBase64;
    document.getElementById('heartIcon').src = heartImageBase64;

    // 2. Übersetzungen initial anwenden (Areal 6)
    applyTranslations();

    // 3. Daten aus Local Storage holen (Areal 2)
    // Die loadCharacterDataFromStorage liefert nun auch charData.isManualMode
    const charData = loadCharacterDataFromStorage();

    /* ==========================================================
       INITIALISIERUNG MODUS (MANUELL VS. ERSTELLER)
       ========================================================== */
    if (charData.isManualMode) {
        console.log("Manueller Modus aktiv: Initialisiere leeren Bogen.");
        
        // Im manuellen Modus lassen wir standardmäßig alle Seiten zu (5 Seiten)
        totalPages = 5;
        const page6 = document.getElementById('page6-wrapper');
        if (page6) page6.remove();

        // Zauberanhang-Checkbox standardmäßig aktivieren
        const appendixCheckbox = document.getElementById('generateSpellDesc');
        if (appendixCheckbox) {
            appendixCheckbox.checked = true;
            // Kleiner Timeout stellt sicher, dass das DOM bereit ist für toggleAppendix
            setTimeout(() => {
                if (typeof toggleAppendix === 'function') toggleAppendix();
            }, 100);
        }
    } else {
        /* ==========================================================
           PRÜFUNG OB ZAUBER (Seite 5) ERFORDERLICH (Bestehende Logik)
           ========================================================== */
        // 1. ZAUBER-SEITE PRÜFEN (Seite 5)
        const hasCantrips = (charData.spells.cantrips && charData.spells.cantrips.length > 0);
        const hasPrepared = (charData.spells.prepared && charData.spells.prepared.length > 0);
        const hasSpellbook = (charData.spells.spellbook && charData.spells.spellbook.length > 0);
        const hasFavored = (charData.spells.favored && charData.spells.favored.length > 0);

        if (!hasCantrips && !hasPrepared && !hasSpellbook && !hasFavored) {
            const page5 = document.getElementById('page5-wrapper');
            if (page5) page5.remove(); 
            totalPages--; 
            console.log("Seite 5 (Zauber) ausgeblendet.");
        }

        // 2. ZAUBERBUCH-SEITE PRÜFEN (Seite 6)
        const usesBook = (typeof characterUsesSpellbook === "function")
            ? characterUsesSpellbook(charData.basic.class)
            : (charData.basic.class && charData.basic.class.toLowerCase() === 'wizard');
        if (!usesBook) {
            const page6 = document.getElementById('page6-wrapper');
            if (page6) page6.remove(); 
            totalPages--;
            console.log("Seite 6 (Zauberbuch) ausgeblendet (kein Zauberbuch).");
        }
    }

    // Fußzeilen nach Seiten-Anpassung aktualisieren!
    document.querySelectorAll('.total-pages-display').forEach(el => {
        el.textContent = totalPages;
    });
    /* ========================================================== */
    
    // 3a. Kopfzeile
    processHeader(charData);
    
    // 3b. Attribute & Skills (Erstellen, Rechnen, Anzeigen)
    processAttributesAndSkills(charData);

    // 3c. Basis-Klassenberechnungen (HP, Trefferwürfel, Meisterschaften)
    processClassBasics(charData);

    // 3d. Werkzeuge 
    processTools(charData);

    // 3e. Ausrüstung
    processInventory(charData);

    // 3j. Volksmerkmale
    applySpeciesFeatureLogic(charData);
    processSpeciesTraits(charData);

    // 3f. Klassenmerkmale
    applyClassFeatureLogic(charData);
    processClassFeatures(charData);

    // 3g. Talente
    applyTalentFeatureLogic(charData);
    processFeats(charData);

    // 3h. Aussehen & Volksmerkmale
    processAppearance(charData);

    // 3i. Charaktergeschichte, Persönlichkeit und Gesinnung
    processStoryAndAlignment(charData);

    // 3k. Zauber
    processSpellsPage(charData);
    processSpellbookPage(charData);

    // 4. Events registrieren
    setupEventListeners();
    setupImageUploads();
    loadSavedImages();
    initAppendixToggle();
    applyFieldLocks(); // Sperrt Felder basierend auf Modus und Edit-Status

    // 5. Überprüfung von Import-Daten
    setTimeout(() => {
        applyImportOverrides();
        updateLevelUpButtonState();
    }, 100); // Kleiner Timeout sorgt dafür, dass alle async-Prozesse fertig sind

    updateLevelUpButtonState();

    console.log('Initialisierung abgeschlossen.');
};

/* ==========================================================================
   AREAL 2: DATEN AUS LOCAL STORAGE EMPFANGEN
   ========================================================================== */
function loadCharacterDataFromStorage() {
    const ls = localStorage;
    
    // Prüfen, ob überhaupt Basis-Daten da sind
    const hasData = ls.getItem("characterName") !== null || ls.getItem("class") !== null;

    // Hilfsfunktion für sicheres JSON-Parsen
    const safeParse = (key, fallback) => {
        const val = ls.getItem(key);
        if (!val) return fallback;
        try { return JSON.parse(val); } catch(e) { return fallback; }
    };

    // feat_species: Array (JSON) oder Legacy-Einzelwert
    const parseFeatSpeciesStorage = (raw) => {
        if (raw == null || raw === "") return [];
        try {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed)) {
                return parsed.map(id => parseInt(id, 10)).filter(n => !isNaN(n) && n > 0);
            }
            const n = parseInt(parsed, 10);
            return (!isNaN(n) && n > 0) ? [n] : [];
        } catch (e) {
            const n = parseInt(raw, 10);
            return (!isNaN(n) && n > 0) ? [n] : [];
        }
    };

    return {
        isManualMode: !hasData, // Wenn keine Daten da sind -> Manueller Modus
        basic: {
            name: ls.getItem("characterName") || "",
            playerName: ls.getItem("playerName") || "",
            class: ls.getItem("class") || "",           
            background: ls.getItem("background") || "", 
            species: ls.getItem("species") || "",       
            lineage: ls.getItem("lineage") || "",
            ancestry: ls.getItem("ancestry") || "",     
            level: parseInt(ls.getItem("level")) || 1,
            xp: ls.getItem("xp") || ""
        },
        scores: {
            strength: ls.getItem("strengthScore") || "10",
            dexterity: ls.getItem("dexterityScore") || "10",
            constitution: ls.getItem("constitutionScore") || "10",
            intelligence: ls.getItem("intelligenceScore") || "10",
            wisdom: ls.getItem("wisdomScore") || "10",
            charisma: ls.getItem("charismaScore") || "10"
        },
        proficiencies: {
            // Hintergrund (Einzelwerte oder Arrays)
            bg_tools: safeParse("tool_background", []), 
            bg_instruments: safeParse("instrument_background", []),
            bg_games: safeParse("game_background", []),
            bg_feat: ls.getItem("feat_background"),

            species_free_choices: safeParse("speciesFreeChoices", []),

            // Klasse (Leere Arrays, werden in processTools aus classForm geholt, falls nötig)
            class_tools: [],       
            class_instruments: [], 
            class_games: [],

            // Sprachen
            languages: safeParse("languages", [])       
        },
	// Equipment
        classForm: safeParse('classForm', {}),
        equipment: safeParse('equipment', { weapons: [], armor: [], vehicles: [], tools: [], gear: [] }),
        purse: safeParse('purse', { PP:0, GP:0, EP:0, SP:0, CP:0 }),
	// Talente
        feats: {
	    background: parseInt(ls.getItem("feat_background")) || null,
            species: parseFeatSpeciesStorage(ls.getItem("feat_species"))
            // Hinweis: Klassen-Talente in classForm.feats
        },
        spells: {
            cantrips: safeParse("cantrips", []),
            spellbook: safeParse("spellbookSpells", []),
            prepared: safeParse("preparedSpells", []),
            favored: safeParse("favoredSpells", []),

            spellcastingAbility_species: ls.getItem("spellcastingAbility_species") || null,
            spellcastingAbility_talent: safeParse("spellcastingAbility_talent", null)
        },
        appearance: {
            gender: ls.getItem("gender") || "",
            age: ls.getItem("age") || "",
            eyeColor: ls.getItem("eyeColor") || "",
            hairColor: ls.getItem("hairColor") || "",
            skinTone: ls.getItem("skinTone") || "",
            size: ls.getItem("size") || "",
            description: ls.getItem("appearanceDescription") || ""
        },
        details: {
            story: ls.getItem("story") || "",
            deityId: ls.getItem("deityId") || "",
            deityName: ls.getItem("deityName") || "",
            communityName: ls.getItem("communityName") || "",
            communityDesc: ls.getItem("communityDesc") || "",
            alignment: ls.getItem("alignment") || "",
            personalityTraits: ls.getItem("personalityTraits") || ""
        }
    };
}

/* ==========================================================================
   AREAL 3: DATEN VERARBEITEN UND EINTRAGEN
   ========================================================================== */

/* --------------------------------------------------------------------------
   3 a. Kopfzeile ausfüllen
   -------------------------------------------------------------------------- */
function processHeader(data) {
    const basic = data.basic;
    
    // Unterklasse ermitteln
    let subclassCategoryNumber = data.classForm.subclass ? parseInt(data.classForm.subclass, 10) : null;
    const characterSubclass = getSubclassTranslation(basic.class, subclassCategoryNumber);

    // Übersetzungen (ABSTURZ-FIX & FLEXIBILITÄT)
    const safeClassKey = basic.class ? basic.class.toLowerCase() : "";
    const safeBgKey = basic.background ? basic.background.toLowerCase() : "";
    const tClass = (translations[currentLanguage][safeClassKey]) || basic.class;
    const tBg = (translations[currentLanguage][safeBgKey]) || basic.background;
    const tSpecies = (typeof getSpeciesDisplayTranslation === "function")
        ? getSpeciesDisplayTranslation(basic.species, currentLanguage)
        : basic.species;
    const tLineage = (basic.lineage && basic.lineage !== "null") ? (translations[currentLanguage][basic.lineage] || basic.lineage) : '';

    const speciesDisplay = tLineage ? `${tSpecies} (${tLineage})` : tSpecies;

    // Werte setzen
    setVal("characterName", basic.name);
    setVal("playerName", basic.playerName);
    setVal("class", tClass);
    setVal("level", basic.level);
    setVal("background", tBg);
    setVal("subclass", characterSubclass);
    setVal("species", speciesDisplay);
    if (typeof updateSheetCustomClassMarker === "function") {
        updateSheetCustomClassMarker(basic.class);
    }
    if (typeof updateSheetCustomBackgroundMarker === "function") {
        updateSheetCustomBackgroundMarker(basic.background);
    }
    if (typeof updateSheetCustomSubclassMarker === "function") {
        updateSheetCustomSubclassMarker(basic.class, subclassCategoryNumber);
    }
    if (typeof updateSheetCustomSpeciesMarker === "function") {
        updateSheetCustomSpeciesMarker(basic.species);
    }

    // Name auf alle Folgeseiten synchronisieren
    document.querySelectorAll('.sync-char-name').forEach(input => {
        input.value = basic.name;
    });

    // --- XP LOGIK ---
    if (typeof XPList !== 'undefined') {
        const currentLevel = parseInt(basic.level, 10) || 1;
        const xpEntry = XPList.find(x => x.level === currentLevel);
        setVal("xp", xpEntry ? xpEntry.xp : 0);
    } else {
        setVal("xp", basic.xp || 0);
    }

    updateLevelUpButtonState();
}

/**
 * Stufenaufstieg nur, wenn der Bogen aus dem Ersteller stammt (class + classForm in LS).
 * Rein manuelle Bögen (isManualMode) sind ausgeschlossen.
 */
function isCharacterSheetLevelUpAllowed() {
    const charData = loadCharacterDataFromStorage();
    if (charData.isManualMode) return false;

    const ls = localStorage;
    if (!ls.getItem("class") || !ls.getItem("classForm")) return false;

    try {
        const cf = JSON.parse(ls.getItem("classForm"));
        return cf && typeof cf === "object";
    } catch (e) {
        return false;
    }
}

function updateLevelUpButtonState() {
    const btn = document.getElementById('levelUpBtn');
    if (!btn) return;

    const fromLs = (typeof getSheetRuleLevel === "function") ? getSheetRuleLevel() : localStorage.getItem('level');
    let level = typeof fromLs === "number" ? fromLs : parseInt(fromLs, 10);
    if (!Number.isFinite(level) || level < 1) level = 1;
    if (level > 20) level = 20;

    const atMaxLevel = level >= 20;
    const creatorRequired = !isCharacterSheetLevelUpAllowed();
    const blocked = atMaxLevel || creatorRequired;

    btn.disabled = blocked;
    btn.setAttribute('aria-disabled', blocked ? 'true' : 'false');

    const t = (typeof translations !== 'undefined' && translations[currentLanguage])
        ? translations[currentLanguage]
        : {};
    if (creatorRequired) {
        btn.title = t.levelUpUnavailableManualSheetLabel
            || "Stufenaufstieg nur für Charaktere aus dem Ersteller.";
    } else if (atMaxLevel) {
        btn.title = t.levelUpUnavailableMaxLevelLabel || "Maximale Stufe (20) erreicht.";
    } else {
        btn.title = "";
    }
}

function updateLevelFromXP() {
    const xpInput = document.getElementById('xp');
    const levelInput = document.getElementById('level');
    
    if (!xpInput || !levelInput || typeof XPList === 'undefined') return;

    let currentXP = parseInt(xpInput.value, 10);
    if (isNaN(currentXP)) currentXP = 0;

    // Wir suchen das höchste Level, dessen XP-Schwelle <= currentXP ist.
    // Dazu sortieren wir die Liste sicherheitshalber absteigend oder nutzen findReverse Logik.
    // Da XPList aufsteigend ist, gehen wir von hinten durch oder nutzen filter.
    
    // Trick: Wir filtern alle Levels, die wir "erreicht" haben, und nehmen davon das höchste.
    const reachedLevels = XPList.filter(entry => currentXP >= entry.xp);
    
    let newLevel = 1;
    if (reachedLevels.length > 0) {
        // Das letzte Element ist das höchste erreichte Level
        newLevel = reachedLevels[reachedLevels.length - 1].level;
    }

    // Wenn sich das Level geändert hat, Input aktualisieren und Folge-Berechnungen starten
    const oldLevel = parseInt(levelInput.value, 10);
    if (newLevel !== oldLevel) {
        levelInput.value = newLevel;
        
        // WICHTIG: Wenn sich das Level ändert, ändert sich auch der Prof. Bonus und ggf. HP
        updateProficiencyBonus();
        
        // Optional: HP neu berechnen (da diese von Level abhängen)
        // Hinweis: Das benötigt Zugriff auf 'conMod' und 'hitDie', die wir hier gerade nicht griffig haben.
        // Falls gewünscht, müsste man processClassBasics(charData) neu aufrufen, 
        // was aber ein Reload der Daten erfordert. Fürs Erste reicht ProfBonus.
    }

    updateLevelUpButtonState();
}

/**
 * Setzt die XP auf den Mindestwert, wenn der Nutzer das Level manuell ändert.
 */
function updateXPFromLevel() {
    const xpInput = document.getElementById('xp');
    const levelInput = document.getElementById('level');
    
    if (!xpInput || !levelInput || typeof XPList === 'undefined') return;

    let newLevel = parseInt(levelInput.value, 10);
    if (isNaN(newLevel) || newLevel < 1) newLevel = 1;
    if (newLevel > 20) newLevel = 20; // Cap bei 20

    // Den XP-Wert für dieses Level finden
    const xpEntry = XPList.find(x => x.level === newLevel);
    
    if (xpEntry) {
        xpInput.value = xpEntry.xp;
        
        // Auch hier: Prof Bonus updaten
        updateProficiencyBonus();
    }

    updateLevelUpButtonState();
}

/** true nach Stufenaufstieg-Abschluss (?fromLevelUp=… in der URL). */
function isSheetFromLevelUpNavigation() {
    try {
        return !!new URLSearchParams(window.location.search).get("fromLevelUp");
    } catch (e) {
        return false;
    }
}

/** Regel-abgeleitete Felder — Overrides werden ignoriert; Werte kommen aus Regel-Handler/Neuberechnung. */
const SHEET_RULE_DERIVED_INPUT_IDS = new Set([
    "level", "maxHP", "maxHD", "xp",
    "initiative", "speed", "armorClass"
]);

/**
 * Wendet alle automatisierten Merkmals-Handler neu an (Spezies → Klasse → Talent).
 * Muss nach Overrides und Inventar-Anlege-Status laufen (RK/Speed/Initiative hängen davon ab).
 * @param {object} [charData]
 */
function reapplyAllSheetFeatureHandlers(charData) {
    if (!charData && typeof loadCharacterDataFromStorage === "function") {
        charData = loadCharacterDataFromStorage();
    }
    if (!charData) return;

    if (typeof applySpeciesFeatureLogic === "function") {
        applySpeciesFeatureLogic(charData);
    }
    if (typeof applyClassFeatureLogic === "function") {
        applyClassFeatureLogic(charData);
    }
    if (typeof applyTalentFeatureLogic === "function") {
        applyTalentFeatureLogic(charData);
    }
}

/** Stufenabhängige Stats — Snapshot-Overrides sind nach Level-Up veraltet. */
const LEVEL_UP_STALE_OVERRIDE_INPUT_IDS = new Set([
    "maxHP", "maxHD", "currentHP", "xp"
]);

/**
 * TP/TW/XP aus Regeln neu berechnen; aktuelle TP relativ zum alten Maximum anpassen.
 * @param {object} [snapshotInputs] – overrides.inputs für currentHP-Merge (optional)
 */
function refreshSheetRuleDerivedStats(snapshotInputs) {
    const snap = snapshotInputs && typeof snapshotInputs === "object" ? snapshotInputs : {};
    const oldCurrentHP = parseInt(snap.currentHP, 10);
    const oldMaxHP = parseInt(snap.maxHP, 10);

    if (typeof updateXPFromLevel === "function") {
        updateXPFromLevel();
    }

    const hpInput = document.getElementById("maxHP");
    if (typeof updateHitPointsAndDice === "function") {
        updateHitPointsAndDice();
    }

    const newMaxHP = parseInt(document.getElementById("maxHP")?.value, 10);
    const currentEl = document.getElementById("currentHP");
    if (!currentEl || !Number.isFinite(newMaxHP)) return;

    if (!Number.isFinite(oldCurrentHP) || snap.currentHP === "" || snap.currentHP == null) {
        currentEl.value = String(newMaxHP);
    } else if (Number.isFinite(oldMaxHP) && oldCurrentHP >= oldMaxHP) {
        currentEl.value = String(newMaxHP);
    } else if (Number.isFinite(oldMaxHP)) {
        const hpGain = newMaxHP - oldMaxHP;
        currentEl.value = String(Math.max(1, oldCurrentHP + Math.max(0, hpGain)));
    } else {
        currentEl.value = String(newMaxHP);
    }
}

/**
 * TP/TW/XP nach Stufenaufstieg neu berechnen (inkl. Talent-/Spezies-Boni wie Tough/Zwergische Zähigkeit).
 * @param {object} snapshotInputs – alte overrides.inputs für aktuelle-TP-Logik
 */
function applyLevelUpSheetStatRefresh(snapshotInputs) {
    refreshSheetRuleDerivedStats(snapshotInputs);

    // RK nach Attributänderung (z. B. ASI KON/GES → Ungerüstete Verteidigung)
    if (typeof updateArmorClass === "function") {
        updateArmorClass();
    }
    if (typeof applyClassFeatureLogic === "function") {
        applyClassFeatureLogic(loadCharacterDataFromStorage());
    }
}

/**
 * Berechnet HP und Trefferwürfel neu (wird bei Level- oder Con-Änderung gerufen).
 */
function updateHitPointsAndDice() {
    // 1. Benötigte Werte aus dem DOM holen
    const levelInput = document.getElementById('level');
    const conModInput = document.getElementById('constitutionModifier');
    const hpInput = document.getElementById('maxHP');
    const hdInput = document.getElementById('maxHD');
    
    // Daten laden (für Klassen-Info)
    const charData = loadCharacterDataFromStorage();
    // WICHTIG: Das Level im charData ist evtl. veraltet, daher überschreiben wir es mit dem Live-Wert
    const currentLevel = parseInt(levelInput.value, 10) || 1;
    charData.basic.level = currentLevel;

    const className = charData.basic.class;
    if (!className) return;

    // Klassendaten finden (Custom: Runtime-Fallback wie in processClassBasics)
    let classData = classCoreTraitsList.find(c => c.translationLabel.toLowerCase() === className.toLowerCase());
    if (!classData && typeof isSheetCustomClassSlug === "function" && isSheetCustomClassSlug(className)) {
        const runtime = (typeof getSheetCustomClassRuntime === "function")
            ? getSheetCustomClassRuntime()
            : null;
        if (runtime?.coreTraits) classData = runtime.coreTraits;
    }
    if (!classData) return;

    const conMod = parseInt(conModInput.value, 10) || 0;
    const hitDieString = classData.hitPointDie; // z.B. "D12"

    // --- A. TREFFERWÜRFEL TEXT UPDATE ---
    if (hdInput) {
        hdInput.value = `${currentLevel}x ${hitDieString}`;
    }

    // --- B. BASIS HP BERECHNUNG ---
    const dieMax = parseInt(hitDieString.replace('D', ''), 10); 
    const dieAvg = (dieMax / 2) + 1; 

    let newMaxHP = 0;
    
    // Level 1: Max + Con
    newMaxHP += (dieMax + conMod);

    // Level 2+: Avg + Con
    if (currentLevel > 1) {
        newMaxHP += (currentLevel - 1) * (dieAvg + conMod);
    }

    // Wert schreiben
    if (hpInput) {
        hpInput.value = newMaxHP;

        // Flags löschen, damit Talent-/Spezies-Boni (Tough, Zwergische Zähigkeit, …) neu addiert werden
        delete hpInput.dataset.toughApplied;
        delete hpInput.dataset.boonFortitudeApplied;
        delete hpInput.dataset.dwarvenToughnessApplied;
    }

    // --- D. TALENT- & SPEZIES-BONI NEU ANWENDEN ---
    applyTalentFeatureLogic(charData);
    applySpeciesFeatureLogic(charData);
    applyTalentFeatureLogic(charData);
}

/**
 * Berechnet die finale Bewegungsrate aus: Spezies (Basis) + Klasse + Talente
 */
function calculateFinalSpeed() {
    // 1. Basis-Speed aus der Spezies holen ODER Override (Waldelf) nutzen
    const charData = loadCharacterDataFromStorage();
    let baseSpeedFT = 30; // Standard Fallback

    if (window.baseSpeedOverride) {
        // --- HIER greift der Waldelf ein (35 Fuß = 10.5m) ---
        baseSpeedFT = window.baseSpeedOverride; 
    } else {
        // Normale Berechnung für alle anderen Spezies
        const rawSpecies = charData.basic.species || "";
        if (typeof speciesList !== 'undefined') {
            const sData = (typeof findSpeciesBySelectionValue === "function")
                ? findSpeciesBySelectionValue(rawSpecies)
                : speciesList.find(s => s.translationLabel === (rawSpecies.toLowerCase() + "Label"));
            if (sData) baseSpeedFT = sData.speedFT;
        }
    }

    // 2. Globale Boni abrufen (oder 0, falls noch nicht gesetzt)
    const bonusClass = window.speedBonusClass || 0;
    const bonusTalent = window.speedBonusTalent || 0;

    // 3. Gesamtsumme
    const totalSpeedFT = baseSpeedFT + bonusClass + bonusTalent;

    // 4. Anzeige aktualisieren
    const speedField = document.getElementById('speed');
    if (speedField) {
        if (currentLanguage === 'de') {
            const speedM = Math.round((totalSpeedFT / 5) * 1.5 * 10) / 10; 
            speedField.value = `${speedM} m`;
        } else {
            speedField.value = `${totalSpeedFT} ft`;
        }
    }
}

// Helper für 3a
function getSubclassTranslation(classType, subclassCategoryNumber) {
    if (!classType) return '';

    let list = null;
    if (typeof getSheetEffectiveSubclassList === "function") {
        list = getSheetEffectiveSubclassList(classType);
    }
    if (!list || !list.length) {
        const subclassLists = {
            'barbarian': (typeof subclassListBarbarian !== 'undefined') ? subclassListBarbarian : [],
            'bard': (typeof subclassListBard !== 'undefined') ? subclassListBard : [],
            'cleric': (typeof subclassListCleric !== 'undefined') ? subclassListCleric : [],
            'druid': (typeof subclassListDruid !== 'undefined') ? subclassListDruid : [],
            'fighter': (typeof subclassListFighter !== 'undefined') ? subclassListFighter : [],
            'monk': (typeof subclassListMonk !== 'undefined') ? subclassListMonk : [],
            'paladin': (typeof subclassListPaladin !== 'undefined') ? subclassListPaladin : [],
            'ranger': (typeof subclassListRanger !== 'undefined') ? subclassListRanger : [],
            'rogue': (typeof subclassListRogue !== 'undefined') ? subclassListRogue : [],
            'sorcerer': (typeof subclassListSorcerer !== 'undefined') ? subclassListSorcerer : [],
            'warlock': (typeof subclassListWarlock !== 'undefined') ? subclassListWarlock : [],
            'wizard': (typeof subclassListWizard !== 'undefined') ? subclassListWizard : []
        };
        list = subclassLists[classType.toLowerCase().trim()];
        if (!list || !list.length) {
            if (typeof getSheetCustomSubclassList === "function") {
                list = getSheetCustomSubclassList(classType) || [];
            }
        }
    }
    if (!list || !list.length) return '';

    const subclassData = list.find(s => s.subclassCategoryNumber === subclassCategoryNumber);
    
    // Nutzung von globaler Variable 'currentLanguage' statt 'de'
    if (subclassData && translations[currentLanguage]) {
        return translations[currentLanguage][subclassData.translationLabel] || subclassData.translationLabel;
    }
    
    return '';
}

function updateSizeCategory() {
    const sizeInput = document.getElementById('physSize'); // Seite 4
    const categoryOutput = document.getElementById('sizeCategory'); // Seite 1
    
    if (!sizeInput || !categoryOutput || typeof sizeList === 'undefined') return;

    const rawVal = sizeInput.value;
    
    // Wenn nichts drin steht oder es der Default "-" ist
    if (!rawVal || rawVal.trim() === "-" || rawVal.trim() === "") {
        categoryOutput.value = "-";
        return;
    }

    // 1. Zahl extrahieren (Komma durch Punkt ersetzen, falls jemand "1,88" eintippt, und alles außer Zahlen/Punkten entfernen)
    const numVal = parseFloat(rawVal.replace(',', '.').replace(/[^\d.]/g, ''));
    if (isNaN(numVal)) return;

    // 2. In Feet umrechnen (1 Fuß = 30.48 cm)
    let feetVal = numVal;
    if (currentLanguage === 'de' || rawVal.toLowerCase().includes('cm')) {
        feetVal = numVal / 30.48;
    }

    // 3. Kategorie anhand der sizeList ermitteln
    let foundLabel = "mediumLabel"; // Standard-Fallback
    for (const size of sizeList) {
        if (feetVal >= size.sizeRange_ft[0] && feetVal <= size.sizeRange_ft[1]) {
            foundLabel = size.sizeCategory;
            break;
        }
    }
    
    // Fallbacks, falls jemand extrem klein (< 0.0) oder extrem riesig (> 10.0) ist
    if (feetVal < sizeList[0].sizeRange_ft[0]) foundLabel = sizeList[0].sizeCategory;
    if (feetVal > sizeList[sizeList.length - 1].sizeRange_ft[1]) foundLabel = sizeList[sizeList.length - 1].sizeCategory;

    // 4. Übersetzen und Eintragen
    const t = translations[currentLanguage] || {};
    categoryOutput.value = t[foundLabel] || foundLabel;
}


/* --------------------------------------------------------------------------
   3 b. Attribute und Skills vergeben
   -------------------------------------------------------------------------- */
function processAttributesAndSkills(data) {
    // 1. Struktur aufbauen (Leere Skill-Listen erstellen)
    initializeSkills();

    // 2. Attributswerte eintragen
    attributeList.forEach(attr => {
        const stringId = attr.translationLabel.replace('Label', '');
        const val = data.scores[stringId];
        if (val) setVal(`${stringId}Score`, val);
    });

    // 3. Checkboxen aktivieren
    const skills = (data.classForm.skills || []).slice();
    if (data.classForm.primalKnowledgeSkill) {
        skills.push(String(data.classForm.primalKnowledgeSkill));
    }
    activateSkills(skills);
    activateSavingThrows(data.basic.class, data.classForm?.attributes);

    // 4. Berechnungen anstoßen (Modifier, ProfBonus, Skill-Totals)
    updateProficiencyBonus();
    updateModifiers(); 
}

// --- Funktionen für 3b (Struktur & Aktivierung) ---
function initializeSkills() {
    const attributes = attributeList;
    const skills = skillList;

    attributes.forEach(attribute => {
        const skillContainer = document.getElementById(attribute.translationLabel.replace('Label', 'Skills'));
        if (skillContainer && attribute.skillCategoryNumber) {
            const skillNumbers = Array.isArray(attribute.skillCategoryNumber) ? attribute.skillCategoryNumber : [attribute.skillCategoryNumber];
            skillNumbers.forEach(skillNumber => {
                const skillData = skills.find(skill => skill.skillCategoryNumber === skillNumber);
                if (skillData) {
                    const div = document.createElement('div');
                    div.className = 'skill';
                    
                    const skillName = (translations[currentLanguage] && translations[currentLanguage][skillData.translationLabel]) 
                                      ? translations[currentLanguage][skillData.translationLabel] 
                                      : skillData.translationLabel;

                    div.innerHTML = `
                        <input type="checkbox" id="${skillData.translationLabel}Trained" class="rounded-checkbox">
                        <input type="text" class="skill-value" readonly>
                        <label for="${skillData.translationLabel}Trained" id="${skillData.translationLabel}">
                            ${skillName}
                        </label>`;
                    skillContainer.appendChild(div);
                }
            });
        }
    });
}

function activateSkills(selectedSkillNumbers) {
    const skills = skillList;
    selectedSkillNumbers.forEach(skillNumber => {
        const skillData = skills.find(skill => skill.skillCategoryNumber.toString() === skillNumber);
        if (skillData) {
            const checkboxId = `${skillData.translationLabel}Trained`;
            const checkbox = document.getElementById(checkboxId);
            if (checkbox) checkbox.checked = true;
            else console.warn(`Checkbox mit ID ${checkboxId} nicht gefunden.`);
        }
    });
}

function activateSavingThrows(className, extraAttributes) {
    if (!className) return;
    const classData = classCoreTraitsList.find(c => c.translationLabel.toLowerCase() === className.toLowerCase());
    if (classData && classData.savingThrowProficiencies) {
        classData.savingThrowProficiencies.forEach(attrLabel => {
            const checkboxId = `${attrLabel.replace('Label', '')}SavingTrained`;
            const checkbox = document.getElementById(checkboxId);
            if (checkbox) checkbox.checked = true;
        });
    }

    // Gewählte / gewährte Zusatz-Rettungswürfe (classForm.attributes = IDs oder Labels)
    const extra = extraAttributes != null
        ? extraAttributes
        : ((typeof character !== "undefined" && character?.classForm?.attributes) || []);
    const values = Array.isArray(extra) ? extra : (extra ? [extra] : []);
    values.forEach(val => {
        let attrKey = "";
        if (!isNaN(val) && typeof attributeList !== "undefined") {
            const attrData = attributeList.find(a => a.ID == val || a.id == val);
            if (attrData) attrKey = attrData.translationLabel;
        } else if (val) {
            attrKey = String(val);
        }
        if (!attrKey) return;
        const checkboxId = `${attrKey.replace("Label", "")}SavingTrained`;
        const checkbox = document.getElementById(checkboxId);
        if (checkbox) checkbox.checked = true;
    });

    // Einfach→Rettungswürfe: direkt aus kompilierten Custom-Class-Merkmalen
    if (typeof getGrantedCustomClassSavingThrowLabels === "function") {
        const charData = (typeof loadCharacterDataFromStorage === "function")
            ? loadCharacterDataFromStorage()
            : null;
        getGrantedCustomClassSavingThrowLabels(charData).forEach(attrLabel => {
            const checkboxId = `${attrLabel.replace("Label", "")}SavingTrained`;
            const checkbox = document.getElementById(checkboxId);
            if (checkbox) checkbox.checked = true;
        });
    }
}

// --- Rechen-Logik für 3b ---
function calculateModifier(score) {
    if (typeof formatModifierForScore === "function") {
        return formatModifierForScore(score);
    }
    const modifier = getModifierForScore(score);
    if (modifier === null) return "";
    return formatModifierDisplay(modifier);
}

function calculateProficiencyBonus(level) {
    if (level <= 4) return 2;
    if (level <= 8) return 3;
    if (level <= 12) return 4;
    if (level <= 16) return 5;
    if (level <= 20) return 6;
    return 2;
}

// Live-Update Funktionen
function updateModifiers() {
    const attributes = ["strength", "dexterity", "wisdom", "constitution", "intelligence", "charisma"];
    attributes.forEach(attribute => {
        const scoreInput = document.getElementById(`${attribute}Score`);
        const modifierInput = document.getElementById(`${attribute}Modifier`);
        if (scoreInput && modifierInput) {
            const score = parseInt(scoreInput.value, 10);
            const modifier = calculateModifier(score);
            modifierInput.value = modifier !== '' ? modifier : '';
        }
    });
    // Trigger Updates für abhängige Werte
    updateSavingThrowValues();
    updateSkillValues();
    updateDerivedStats();
    
    // Auch Angriffe aktualisieren, wenn sich die Stats ändern ---
    updatePhysicalAttacks(); 
}

function updateDerivedStats() {
    // 1. Initiative setzen (Basiert auf Geschicklichkeits-Modifikator)
    const dexModInput = document.getElementById('dexterityModifier');
    const initInput = document.getElementById('initiative');
    
    if (dexModInput && initInput) {
        const dexMod = parseInt(dexModInput.value, 10) || 0;
        // Formatierung mit Vorzeichen (z.B. +2 oder -1)
        initInput.value = dexMod >= 0 ? `+${dexMod}` : `${dexMod}`;
    }

    // 2. Passive Wahrnehmung berechnen (10 + Weisheits-Modifikator)
    const wisModInput = document.getElementById('wisdomModifier');
    const passPercInput = document.getElementById('passivePerception');
    const wisdomSkillsContainer = document.getElementById('wisdomSkills');

    if (passPercInput) {
        let perceptionValue = 0;

        if (wisdomSkillsContainer) {
            wisdomSkillsContainer.querySelectorAll('.skill').forEach(skillDiv => {
                const label = skillDiv.querySelector('label');
                const valueInput = skillDiv.querySelector('.skill-value');

                // Sobald wir das Wahrnehmungs-Feld finden, nehmen wir den finalen Wert aus dem UI
                if (label && valueInput && label.id === 'perceptionLabel') {
                    perceptionValue = parseInt(valueInput.value, 10) || 0;
                }
            });
        } else if (wisModInput) {
            perceptionValue = parseInt(wisModInput.value, 10) || 0;
        }

        // 10 + (Weisheit + evtl. PB + evtl. Expertise) -> Alles im perceptionValue enthalten!
        passPercInput.value = 10 + perceptionValue;
    }
}

function updateProficiencyBonus() {
    const level = parseInt(document.getElementById("level").value, 10) || 1;
    const bonus = calculateProficiencyBonus(level);
    const bonusInput = document.getElementById('proficiencyBonus');
    if (bonusInput) bonusInput.value = `+${bonus}`;

    // --- Angriffe aktualisieren, da der Bonus Teil des Angriffs ist ---
    updatePhysicalAttacks();
    
    // (Optional: Auch Skills/Saves neu berechnen, da PB sich geändert hat)
    updateSkillValues();
    updateSavingThrowValues();
}

function updateSkillValues() {
    const level = parseInt(document.getElementById("level").value, 10) || 1;
    const proficiencyBonus = calculateProficiencyBonus(level);
    
    // Hol die Expertise-IDs aus dem globalen Speicher
    const expertiseIDs = window.activeExpertiseIDs || [];
    const joatHalfPb = Math.floor(proficiencyBonus / 2);
    const charismaCheckBonus = window.charismaCheckBonus || 0;
    const charismaSkillIds = new Set([5, 8, 13, 14]);

    attributeList.forEach(attribute => {
        const stringId = attribute.translationLabel.replace('Label', '');
        const modifier = parseInt(document.getElementById(`${stringId}Modifier`).value, 10) || 0;
        const skillContainer = document.getElementById(`${stringId}Skills`);

        if (skillContainer) {
            skillContainer.querySelectorAll('.skill').forEach(skillDiv => {
                const checkbox = skillDiv.querySelector('.rounded-checkbox');
                const valueInput = skillDiv.querySelector('.skill-value');
                const label = skillDiv.querySelector('label');

                if(checkbox && valueInput && label) {
                    // Wir finden die skillCategoryNumber anhand des Labels (ID des Labels im HTML)
                    const skillData = skillList.find(s => s.translationLabel === label.id);
                    
                    let finalValue = modifier;
                    if (checkbox.checked) {
                        finalValue += proficiencyBonus;
                        
                        // EXPERTISE CHECK: Wenn geübt UND in der Expertise-Liste
                        if (skillData && expertiseIDs.includes(skillData.skillCategoryNumber)) {
                            finalValue += proficiencyBonus; // Bonus ein zweites Mal addieren
                        }
                    } else if (window.hasJackOfAllTrades) {
                        // Barde L2: halber ÜB auf Fertigkeiten ohne Übung (inkl. passive Wahrnehmung)
                        finalValue += joatHalfPb;
                    }

                    // Fey Wanderer: Otherworldly Glamour auf Charisma-Fertigkeiten
                    if (skillData && charismaSkillIds.has(skillData.skillCategoryNumber) && charismaCheckBonus > 0) {
                        finalValue += charismaCheckBonus;
                    }
                    
                    valueInput.value = finalValue >= 0 ? `+${finalValue}` : finalValue;
                }
            });
        }
    });
    updateDerivedStats();
}

function updateSavingThrowValues() {
    const level = parseInt(document.getElementById("level").value, 10) || 1;
    const proficiencyBonus = calculateProficiencyBonus(level);

    attributeList.forEach(attribute => {
        const stringId = attribute.translationLabel.replace('Label', '');
        const modifier = parseInt(document.getElementById(`${stringId}Modifier`).value, 10) || 0;
        const checkbox = document.getElementById(`${stringId}SavingTrained`);
        const valueInput = document.getElementById(`${stringId}SavingValue`);

        if (checkbox && valueInput) {
            let finalValue = modifier;
            if (checkbox.checked) finalValue += proficiencyBonus;
            valueInput.value = finalValue >= 0 ? `+${finalValue}` : finalValue;
        }
    });
}


/* --------------------------------------------------------------------------
   3 c. Basis-Klassenberechnungen & Kampfwerte
   -------------------------------------------------------------------------- */
function processClassBasics(data) {
    if (!data.basic.class) return;

    // Klassendaten holen (Custom: hydratisierte Runtime als Fallback)
    let classData = classCoreTraitsList.find(c => c.translationLabel.toLowerCase() === data.basic.class.toLowerCase());
    if (!classData && typeof isSheetCustomClassSlug === "function" && isSheetCustomClassSlug(data.basic.class)) {
        const runtime = (typeof getSheetCustomClassRuntime === "function")
            ? getSheetCustomClassRuntime()
            : null;
        if (runtime?.coreTraits) classData = runtime.coreTraits;
    }
    if (!classData) return;

    const level = data.basic.level;
    
    // Modifikatoren auslesen (müssen durch updateModifiers bereits im DOM sein)
    const conMod = parseInt(document.getElementById('constitutionModifier').value, 10) || 0;
    const dexMod = parseInt(document.getElementById('dexterityModifier').value, 10) || 0;
    const wisMod = parseInt(document.getElementById('wisdomModifier').value, 10) || 0;


    // --- 1. TREFFERWÜRFEL (HIT DICE) ---
    const hitDieString = classData.hitPointDie; // z.B. "D12"
    const hdInput = document.getElementById('maxHD');
    if (hdInput) {
        hdInput.value = `${level}x ${hitDieString}`;
    }


    // --- 2. MAX. TREFFERPUNKTE (HP) ---
    // Level 1: Max + Con
    // Level 2+: Avg + Con
    const dieMax = parseInt(hitDieString.replace('D', ''), 10); 
    const dieAvg = (dieMax / 2) + 1; // 12->7, 10->6, 8->5, 6->4

    let maxHP = 0;
    
    // Level 1
    maxHP += (dieMax + conMod);

    // Level 2+
    if (level > 1) {
        maxHP += (level - 1) * (dieAvg + conMod);
    }

    setVal('maxHP', maxHP);
    
    // Initiale HP setzen, falls leer
    const currentHPField = document.getElementById('currentHP');
    if (currentHPField && currentHPField.value === "") {
        currentHPField.value = maxHP;
    }


    // --- 3. WAFFEN ---

    // a. Waffenkategorien (Proficiencies) — Tab 1 Kernmerkmale
    if (classData.weaponCategoryNumber) {
        setProficiencies(classData.weaponCategoryNumber, 'weapon');
    }
    // Einfach→Waffenvertrautheit (stufenabhängig), analog zu Rettungswurf-Grants
    if (typeof getGrantedCustomClassWeaponCategoryNumbers === "function") {
        const grantedWeapons = getGrantedCustomClassWeaponCategoryNumbers(data);
        if (grantedWeapons.length) setProficiencies(grantedWeapons, 'weapon');
    }

// b. Waffeneigenschaften (Textfeld)
    if (classData.weaponPropertyCategoryNumber && typeof weaponProperty !== 'undefined') {        
        const rawProps = classData.weaponPropertyCategoryNumber;
        const propIds = Array.isArray(rawProps) ? rawProps : [rawProps];

        const propNames = propIds.map(id => {
            const propData = weaponProperty.find(p => p.weaponPropertyCategoryNumber === id);
            if (!propData) return null;
            
            return (translations[currentLanguage] && translations[currentLanguage][propData.translationLabel]) 
                   ? translations[currentLanguage][propData.translationLabel] 
                   : propData.translationLabel;
        }).filter(n => n !== null);

        const propField = document.getElementById('weaponProperties');
        if (propField) propField.value = propNames.join(", ");
    }
    // Zusätzliche Eigenschaften aus Einfach→Waffenvertrautheit
    if (typeof getGrantedCustomClassWeaponPropertyCategoryNumbers === "function") {
        const grantedProps = getGrantedCustomClassWeaponPropertyCategoryNumbers(data);
        if (grantedProps.length) mergeAdditionalWeaponProperties(grantedProps);
    }

// c. Waffenmeisterschaften (Textfeld)
    // Format: "Waffenname (Meisterschaftseffekt)"
    if (data.classForm.weaponMastery && data.classForm.weaponMastery.length > 0) {
        
        // Sicherheitscheck: Sind die Listen da?
        if (typeof weaponList !== 'undefined' && typeof weaponMastery !== 'undefined') {
            
            const selectedWeaponIds = data.classForm.weaponMastery; 
            const entries = []; 

            selectedWeaponIds.forEach(idRaw => {
                const weaponId = parseInt(idRaw, 10);
                
                // 1. Die Waffe in der Waffenliste suchen
                const weaponObj = weaponList.find(w => w.ID === weaponId);
                
                if (weaponObj && weaponObj.weaponMasteryCategoryNumber) {
                    
                    // 2. Den Meisterschafts-Effekt suchen
                    const masteryDef = weaponMastery.find(m => m.weaponMasteryCategoryNumber === weaponObj.weaponMasteryCategoryNumber);
                    
                    if (masteryDef) {
                        // 3. Beides übersetzen
                        const weaponName = (translations[currentLanguage] && translations[currentLanguage][weaponObj.translationLabel]) 
                                           ? translations[currentLanguage][weaponObj.translationLabel] 
                                           : weaponObj.translationLabel;

                        const masteryName = (translations[currentLanguage] && translations[currentLanguage][masteryDef.translationLabel]) 
                                            ? translations[currentLanguage][masteryDef.translationLabel] 
                                            : masteryDef.translationLabel;
                        
                        // 4. String formatieren: "Streitaxt (Spalten)"
                        entries.push(`${weaponName} (${masteryName})`);
                    }
                }
            });

            // 5. Als kommagetrennte Liste ins Feld schreiben
            const masteryField = document.getElementById('weaponMasteries');
            if (masteryField) {
                masteryField.value = entries.join(", ");
            }

        } else {
            console.warn("weaponList oder weaponMastery Datenbank fehlt!");
        }
    }

    // --- 4. RÜSTUNGSKATEGORIEN ---
    if (classData.armorCategoryNumber) {
        setProficiencies(classData.armorCategoryNumber, 'armor');
    }
    // Einfach→Rüstungsvertrautheit (stufenabhängig)
    if (typeof getGrantedCustomClassArmorCategoryNumbers === "function") {
        const grantedArmor = getGrantedCustomClassArmorCategoryNumbers(data);
        if (grantedArmor.length) setProficiencies(grantedArmor, 'armor');
    }

    // --- 5. RÜSTUNGSKLASSE (AC) ---
    // Wir rufen die zentrale Funktion auf, die Inventar & Stats prüft
    updateArmorClass();
}

// Helper für Meisterschaften (Checkboxen)
function setProficiencies(categories, type) {
    const cats = Array.isArray(categories) ? categories : [categories];
    cats.forEach(rawCat => {
        // Coercion: JSON/LocalStorage kann Strings liefern ("1" === 1 wäre false)
        const cat = Number(rawCat);
        let id = null;
        if (type === 'armor') {
            if (cat === 1) id = 'lightArmor';
            if (cat === 2) id = 'mediumArmor';
            if (cat === 3) id = 'heavyArmor';
            if (cat === 4) id = 'shieldProf';
        } else if (type === 'weapon') {
            if (cat === 1) id = 'simpleMeleeWeapons';
            if (cat === 2) id = 'simpleRangedWeapons';
            if (cat === 3) id = 'martialMeleeWeapons';
            if (cat === 4) id = 'martialRangedWeapons';
        }
        
        if (id) {
            const cb = document.getElementById(id);
            if (cb) cb.checked = true;
        }
    });
}

/**
 * Rüstungs-/Waffenvertrautheit aus Regeldaten erneut setzen
 * (nach Import-Overrides, die veraltete false-Werte überschreiben können).
 */
function getSheetProficiencyCheckboxIds() {
    return [
        "simpleMeleeWeapons", "simpleRangedWeapons", "martialMeleeWeapons", "martialRangedWeapons",
        "lightArmor", "mediumArmor", "heavyArmor", "shieldProf"
    ];
}

function isSheetProficiencyCheckboxId(id) {
    return getSheetProficiencyCheckboxIds().includes(id);
}

/**
 * Gespeicherte Waffen-/Rüstungsvertrautheit vom Bogen anwenden (nach allen Regel-Updates).
 * @param {object} overrides
 */
function applySheetProficiencyCheckboxOverrides(overrides) {
    if (!overrides?.checkboxes) return;
    getSheetProficiencyCheckboxIds().forEach(id => {
        if (overrides.checkboxes[id] === undefined) return;
        const el = document.getElementById(id);
        if (el) el.checked = !!overrides.checkboxes[id];
    });
    if (typeof updatePhysicalAttacks === "function") updatePhysicalAttacks();
}

function reapplySheetArmorWeaponProficienciesFromRuleData() {
    const charData = (typeof loadCharacterDataFromStorage === "function")
        ? loadCharacterDataFromStorage()
        : null;
    if (!charData?.basic?.class || typeof setProficiencies !== "function") return;

    const className = charData.basic.class;
    const level = parseInt(charData.basic.level, 10) || 1;
    const classForm = charData.classForm || {};

    let classData = (typeof classCoreTraitsList !== "undefined")
        ? classCoreTraitsList.find(c =>
            String(c.translationLabel || "").toLowerCase() === String(className).toLowerCase())
        : null;
    if (!classData && typeof isSheetCustomClassSlug === "function" && isSheetCustomClassSlug(className)) {
        const runtime = (typeof getSheetCustomClassRuntime === "function")
            ? getSheetCustomClassRuntime()
            : null;
        if (runtime?.coreTraits) classData = runtime.coreTraits;
    }
    if (classData?.armorCategoryNumber) setProficiencies(classData.armorCategoryNumber, "armor");
    if (classData?.weaponCategoryNumber) setProficiencies(classData.weaponCategoryNumber, "weapon");

    if (typeof getGrantedCustomClassArmorCategoryNumbers === "function") {
        const granted = getGrantedCustomClassArmorCategoryNumbers(charData);
        if (granted?.length) setProficiencies(granted, "armor");
    }
    if (typeof getGrantedCustomClassWeaponCategoryNumbers === "function") {
        const granted = getGrantedCustomClassWeaponCategoryNumbers(charData);
        if (granted?.length) setProficiencies(granted, "weapon");
    }

    if (classForm.divineOrders != null && classForm.divineOrders !== ""
        && typeof divineOrderCategoryList !== "undefined") {
        const orderId = parseInt(
            Array.isArray(classForm.divineOrders) ? classForm.divineOrders[0] : classForm.divineOrders,
            10
        );
        const orderData = divineOrderCategoryList.find(o => o.divineOrderCategoryNumber === orderId);
        if (orderData?.Get_armorCategoryNumber) setProficiencies(orderData.Get_armorCategoryNumber, "armor");
        if (orderData?.Get_weaponCategoryNumber) setProficiencies(orderData.Get_weaponCategoryNumber, "weapon");
    }
    if (classForm.primalOrders != null && classForm.primalOrders !== ""
        && typeof primalOrderCategoryList !== "undefined") {
        const orderId = parseInt(
            Array.isArray(classForm.primalOrders) ? classForm.primalOrders[0] : classForm.primalOrders,
            10
        );
        const orderData = primalOrderCategoryList.find(o => o.primalOrderCategoryNumber === orderId);
        if (orderData?.Get_armorCategoryNumber) setProficiencies(orderData.Get_armorCategoryNumber, "armor");
        if (orderData?.Get_weaponCategoryNumber) setProficiencies(orderData.Get_weaponCategoryNumber, "weapon");
    }

    const featIds = new Set();
    if (charData.feats?.background) {
        const n = parseInt(charData.feats.background, 10);
        if (!isNaN(n) && n > 0) featIds.add(n);
    }
    const speciesFeatIds = Array.isArray(charData.feats?.species)
        ? charData.feats.species
        : (charData.feats?.species ? [charData.feats.species] : []);
    speciesFeatIds.forEach(id => {
        const n = parseInt(id, 10);
        if (!isNaN(n) && n > 0) featIds.add(n);
    });
    if (Array.isArray(classForm.feats)) {
        classForm.feats.forEach(item => {
            const n = parseInt(item?.feat, 10);
            if (!isNaN(n) && n > 0) featIds.add(n);
        });
    }
    if (typeof featList !== "undefined") {
        featIds.forEach(featId => {
            const featData = featList.find(f => f.ID === featId);
            if (!featData) return;
            if (featData.Get_armorCategoryNumber && featData.Get_armorCategoryNumber !== 0) {
                setProficiencies(featData.Get_armorCategoryNumber, "armor");
            }
            if (featData.Get_weaponCategoryNumber && featData.Get_weaponCategoryNumber !== 0) {
                setProficiencies(featData.Get_weaponCategoryNumber, "weapon");
            }
        });
    }

    // Custom Class/UC-Merkmalszeilen mit featureHandlers (armorTrainingLabel / weaponTrainingLabel)
    const userSubclassId = classForm.subclass ? parseInt(classForm.subclass, 10) : 0;
    const dataSource = (typeof getClassDataArray === "function") ? getClassDataArray(className) : null;
    if (dataSource && typeof featureHandlers !== "undefined") {
        const computedStats = { additionalProficiencies: { armor: [], weapon: [] } };
        dataSource.forEach(feat => {
            if (!feat || (feat.level || 1) > level) return;
            const isBase = !feat.subclassCategoryNumber || feat.subclassCategoryNumber === 0;
            const isMine = feat.subclassCategoryNumber === userSubclassId;
            if (!isBase && !isMine) return;
            const handler = featureHandlers[feat.translationLabel];
            if (typeof handler !== "function") return;
            if (feat.translationLabel !== "armorTrainingLabel"
                && feat.translationLabel !== "weaponTrainingLabel"
                && feat.translationLabel !== "divineOrderLabel"
                && feat.translationLabel !== "primalOrderLabel") {
                return;
            }
            handler(charData, computedStats, feat);
        });
        if (computedStats.additionalProficiencies.armor.length) {
            setProficiencies(computedStats.additionalProficiencies.armor, "armor");
        }
        if (computedStats.additionalProficiencies.weapon.length) {
            setProficiencies(computedStats.additionalProficiencies.weapon, "weapon");
        }
    }
}

/**
 * Zusätzliche Waffeneigenschaften (z. B. Custom-Class Grants) an #weaponProperties anhängen.
 * Bestehende Tab-1-Einträge bleiben erhalten; Dubletten werden vermieden.
 */
function mergeAdditionalWeaponProperties(propertyIds) {
    if (!propertyIds || !propertyIds.length || typeof weaponProperty === 'undefined') return;
    const propField = document.getElementById('weaponProperties');
    if (!propField) return;

    const lang = (typeof currentLanguage !== 'undefined') ? currentLanguage
        : ((typeof currentLang !== 'undefined') ? currentLang : 'de');
    const existing = String(propField.value || '')
        .split(',')
        .map(s => s.trim())
        .filter(Boolean);
    const existingLower = existing.map(s => s.toLowerCase());

    propertyIds.forEach(rawId => {
        const id = parseInt(rawId, 10);
        if (!Number.isFinite(id)) return;
        const propData = weaponProperty.find(p => p.weaponPropertyCategoryNumber === id);
        if (!propData) return;
        const name = (translations[lang] && translations[lang][propData.translationLabel])
            ? translations[lang][propData.translationLabel]
            : propData.translationLabel;
        if (!name) return;
        if (existingLower.includes(String(name).toLowerCase())) return;
        existing.push(name);
        existingLower.push(String(name).toLowerCase());
    });

    propField.value = existing.join(', ');
}

/**
 * Wird aufgerufen, wenn eine Rüstungs-Checkbox geklickt wird.
 * Aktualisiert AC und berechnet danach sofort alle Merkmale (Speed etc.) neu.
 * @param {HTMLInputElement} [changedCheckbox] – die gerade geklickte Inventar-Checkbox
 */
function handleArmorChange(changedCheckbox) {
    // Nur eine Körperrüstung gleichzeitig (Schild ausgenommen)
    enforceExclusiveBodyArmorEquipped(changedCheckbox || null);

    // 1. Zuerst die Rüstungs-Logik (Sperren & AC-Wert)
    updateArmorClass();

    // 2. Daten laden (für Basiswerte)
    const charData = loadCharacterDataFromStorage();

    // 3. WICHTIG: Klassen- und Talent-Logik neu anstoßen!
    // Dadurch werden die Handler (fastMovement, unarmoredMovement) ausgeführt,
    // die jetzt den neuen Checkbox-Status prüfen.
    applyClassFeatureLogic(charData);
    applyTalentFeatureLogic(charData);
}

/* --------------------------------------------------------------------------
   3 d. Gemeisterte Werkzeug
   -------------------------------------------------------------------------- */
function processTools(data) {
    const textArea = document.getElementById('masteredTools');
    if (!textArea) return;

    // 1. Priorität: Manuell gespeicherter Text (falls vorhanden)
    if (data.status && data.status.masteredTools_text) {
        textArea.value = data.status.masteredTools_text;
        return; 
    }

    // Set verhindert doppelte Einträge automatisch
    let collectedNames = new Set();

    // Helper Funktion: IDs verarbeiten
    // listType: 1=Tool, 2=Instrument, 3=Game
    const addById = (ids, listType) => {
        if (!ids) return;
        const idArray = Array.isArray(ids) ? ids : [ids];

        idArray.forEach(rawId => {
            const id = parseInt(rawId, 10);
            if (isNaN(id) || id === 0) return;

            let item = null;

            // A. Werkzeuge
            if (listType === 1 && typeof toolList !== 'undefined') {
                item = toolList.find(t => t.ID === id);
            }
            // B. Instrumente
            else if (listType === 2 && typeof instrumentList !== 'undefined') {
                item = instrumentList.find(i => i.instrumentCategoryNumber === id);
            }
            // C. Spiele
            else if (listType === 3 && typeof gameList !== 'undefined') {
                item = gameList.find(g => g.gameCategoryNumber === id);
            }

            // Wenn gefunden, Name übersetzen und zum Set hinzufügen
            if (item) {
                const label = (translations[currentLanguage] && translations[currentLanguage][item.translationLabel]) 
                              ? translations[currentLanguage][item.translationLabel] 
                              : item.translationLabel;
                
                collectedNames.add(label);
            }
        });
    };;

    // --- QUELLE 1-3: HINTERGRUND DATEN ---
    
    // 1. Werkzeuge
    addById(data.proficiencies.bg_tools, 1);

    // 2. Instrumente
    addById(data.proficiencies.bg_instruments, 2);

    // 3. Spiele
    addById(data.proficiencies.bg_games, 3);

    // --- QUELLE 4-6: KLASSE (classForm) ---
    if (data.classForm) {
        // 4. classForm => tools
        if (data.classForm.tools) {
            addById(data.classForm.tools, 1);
        }

        // 5. classForm => instruments
        if (data.classForm.instruments) {
            addById(data.classForm.instruments, 2);
        }

        // 6. classForm => games
        if (data.classForm.games) {
            addById(data.classForm.games, 3);
        }
    }

    // --- AUSGABE ---
    if (collectedNames.size > 0) {
        // Set -> Array -> Sortieren -> String
        textArea.value = Array.from(collectedNames).sort().join(", ");
    }
}


/* --------------------------------------------------------------------------
   3 e. Ausrüstung (Inventar & Geldbörse)
   -------------------------------------------------------------------------- */

/**
 * Ersteller-Zeilen (Waffen/Rüstung) tragen data-creator-bound + data-index.
 * Wird der Zeilenname geleert, wird die Kopplung aufgehoben — Zeile ist wieder frei nutzbar.
 */
function releaseInventoryCreatorRowBinding(row, options) {
    if (!row) return false;
    const opts = options || {};
    const cb = row.querySelector('input[type="checkbox"].equipped-checkbox')
        || row.querySelector('input[type="checkbox"]');
    if (!cb || !cb.hasAttribute("data-creator-bound")) return false;

    const wasChecked = cb.checked;
    cb.removeAttribute("data-creator-bound");
    cb.removeAttribute("data-index");
    cb.removeAttribute("data-source-id");

    // Nur bei geleertem Namen Anlege-Status zurücksetzen — manueller Ersatzname behält Auswahl
    if (opts.uncheckOnRelease === true && wasChecked) {
        cb.checked = false;
    }
    // Schild-Marker immer an den aktuellen Namen koppeln (nicht am alten Ersteller-Schild festhalten)
    if (typeof syncInventoryArmorRowShieldState === "function") {
        syncInventoryArmorRowShieldState(row);
    }
    if (opts.markManual) {
        row.setAttribute("data-inventory-manual", "1");
    }

    if (opts.refreshWeapons !== false && typeof updatePhysicalAttacks === "function") {
        updatePhysicalAttacks();
    }
    if (opts.refreshArmor !== false && typeof updateArmorClass === "function") {
        updateArmorClass();
        const charData = loadCharacterDataFromStorage();
        if (typeof applyClassFeatureLogic === "function") applyClassFeatureLogic(charData);
    }
    return true;
}

/** Prüft, ob Ersteller-Zeile noch zum gespeicherten Inventar-Eintrag passt. */
function isInventoryCreatorRowStillValid(row, processedItems, boxId) {
    const cb = row?.querySelector('input[type="checkbox"]');
    if (!cb || !cb.hasAttribute("data-creator-bound")) return true;

    const nameInput = row.querySelectorAll("input")[1];
    const rowName = (nameInput?.value || "").trim();
    if (!rowName) return false;

    const index = parseInt(cb.getAttribute("data-index"), 10);
    if (!Number.isFinite(index)) return false;

    const item = processedItems[index];
    if (!item) return false;

    const rawLabel = item.selectedVaries ? item.selectedVaries : item.label;
    const translated = (translations[currentLanguage] && translations[currentLanguage][rawLabel])
        ? translations[currentLanguage][rawLabel]
        : rawLabel;

    if (boxId === 2 && typeof armorList !== "undefined") {
        const armorData = armorList.find(a => a.translationLabel === item.label);
        if (armorData?.translationShortLabel && armorData.translationShortLabel !== 0) {
            const shortName = (translations[currentLanguage] && translations[currentLanguage][armorData.translationShortLabel])
                ? translations[currentLanguage][armorData.translationShortLabel]
                : armorData.translationShortLabel;
            const withShort = `${translated} (${shortName})`;
            if (rowName === withShort || rowName === translated) return true;
        }
    }

    return rowName === translated;
}

/** Bei geleertem/geändertem Namen: Ersteller-Kopplung der Inventarzeile lösen. */
function validateInventoryCreatorRowBinding(row, boxId, options) {
    if (!row) return;
    const opts = options || {};
    const cb = row.querySelector('input[type="checkbox"]');
    if (!cb) return;

    const nameInput = row.querySelectorAll("input")[1];
    const rowName = (nameInput?.value || "").trim();
    const refreshOpts = opts.skipRefresh
        ? { refreshWeapons: false, refreshArmor: false }
        : { refreshWeapons: boxId === 1, refreshArmor: boxId === 2 };

    // Geleerte Zeile: Anlegen unmöglich (Waffe / Rüstung / Schild), Kopplung lösen
    if (!rowName) {
        if (cb.hasAttribute("data-creator-bound")) {
            releaseInventoryCreatorRowBinding(row, Object.assign({
                uncheckOnRelease: true
            }, refreshOpts));
        } else {
            cb.checked = false;
            if (boxId === 2) {
                cb.classList.remove("inventory-shield-checkbox");
            }
            if (!opts.skipRefresh) {
                if (boxId === 1 && typeof updatePhysicalAttacks === "function") {
                    updatePhysicalAttacks();
                }
                if (boxId === 2 && typeof updateArmorClass === "function") {
                    updateArmorClass();
                    const charDataEmpty = loadCharacterDataFromStorage();
                    if (typeof applyClassFeatureLogic === "function") {
                        applyClassFeatureLogic(charDataEmpty);
                    }
                }
            }
        }
        return;
    }

    if (!cb.hasAttribute("data-creator-bound")) return;

    const charData = loadCharacterDataFromStorage();
    let items = [];
    if (boxId === 1) items = charData.equipment?.weapons || [];
    else if (boxId === 2) items = charData.equipment?.armor || [];
    items = mergeDuplicateItems(expandInventoryPacks(items));

    if (!isInventoryCreatorRowStillValid(row, items, boxId)) {
        releaseInventoryCreatorRowBinding(row, Object.assign({
            uncheckOnRelease: false,
            markManual: true
        }, refreshOpts));
    }
}

function processInventory(data) {
    // --- 1. GELDBÖRSE --- (unverändert)
    if (data.purse) {
        ['pp', 'gp', 'ep', 'sp', 'cp'].forEach(coin => {
            const field = document.getElementById(coin);
            if (field) {
                let val = parseInt(data.purse[coin.toUpperCase()] || 0, 10);
                field.value = Math.max(0, val); 
            }
        });
    }

    // --- 2. INVENTAR TABELLEN ---
    const boxConfig = [
        { id: 1, source: data.equipment.weapons,  rows: 10, col3: 'checkbox' },
        { id: 2, source: data.equipment.armor,    rows: 6,  col3: 'checkbox' }, 
        { id: 3, source: data.equipment.vehicles, rows: 5,  col3: 'capacity' },
        { id: 4, source: data.equipment.tools,    rows: 4,  col3: 'ability' },
        { id: 5, source: data.equipment.gear,     rows: 20, col3: 'type' }
    ];

    let armorAlreadyEquipped = false;

    boxConfig.forEach(box => {
        const headerEl = document.getElementById(`th_amount_${box.id}`);
        if (!headerEl) return;

        const tableBody = headerEl.closest('table').querySelector('tbody');
        const rows = tableBody.querySelectorAll('tr');
        
        let items = box.source || [];
        items = expandInventoryPacks(items); 
        items = mergeDuplicateItems(items);

        const strScore = parseInt(data.scores.strength) || 10;
        const dexScore = parseInt(data.scores.dexterity) || 10;
        const strMod = Math.floor((strScore - 10) / 2);
        const dexMod = Math.floor((dexScore - 10) / 2);

        const className = data.basic.class;
        // Keine Auto-Rüstung bei Unarmored Defense (PHB + Custom PreDefined)
        const canAutoEquipArmor = !classHasUnarmoredDefenseFeature(
            className,
            data.basic.level,
            data.classForm && data.classForm.subclass
        );

        let maxWeaponMod = -999;
        let maxArmorAC = -1;

        if (box.id === 1 && typeof weaponList !== 'undefined') {
            items.forEach(item => {
                const wData = weaponList.find(w => w.translationLabel === item.label);
                if (wData) {
                    const mod = calculateBestWeaponMod(wData, strMod, dexMod);
                    if (mod > maxWeaponMod) maxWeaponMod = mod;
                }
            });
        }

        if (box.id === 2 && canAutoEquipArmor && typeof armorList !== 'undefined') {
            items.forEach(item => {
                if (item.label === 'shieldLabel') return;
                const aData = armorList.find(a => a.translationLabel === item.label);
                if (aData) {
                    const ac = parseInt(aData.armorClass) || 0;
                    if (ac > maxArmorAC) maxArmorAC = ac;
                }
            });
        }

        for (let i = 0; i < box.rows; i++) {
            if (!rows[i]) break; 
            const row = rows[i];
            const inputs = row.querySelectorAll('input');

            if (i < items.length) {
                const item = items[i];
                inputs[0].value = item.amount || 1;

                let rawLabel = item.selectedVaries ? item.selectedVaries : item.label;
                let translatedName = (translations[currentLanguage] && translations[currentLanguage][rawLabel]) 
                                     ? translations[currentLanguage][rawLabel] 
                                     : rawLabel;
                
                if (box.id === 2 && typeof armorList !== 'undefined') {
                    const armorData = armorList.find(a => a.translationLabel === item.label);
                    if (armorData && armorData.translationShortLabel && armorData.translationShortLabel !== 0) {
                        const shortName = (translations[currentLanguage] && translations[currentLanguage][armorData.translationShortLabel]) 
                                          ? translations[currentLanguage][armorData.translationShortLabel] 
                                          : armorData.translationShortLabel;
                        translatedName = `${translatedName} (${shortName})`;
                    }
                }
                inputs[1].value = translatedName;

                if (box.col3 === 'checkbox') {
                    inputs[2].setAttribute('data-index', i);
                    inputs[2].setAttribute('data-creator-bound', '1');
                    
                    // --- NEU: EINDEUTIGE ID FÜR DIE KOPPLUNG AN DIE ANGRIFFSTABELLE ---
                    const sourceId = `inv-${box.id}-row-${i}`;
                    inputs[2].setAttribute('data-source-id', sourceId);
                    
                    if (box.id === 1) { // WAFFEN
                        inputs[2].setAttribute('onchange', 'updatePhysicalAttacks()');
                        let shouldCheck = false;
                        if (typeof weaponList !== 'undefined') {
                            const wData = weaponList.find(w => w.translationLabel === item.label);
                            if (wData) {
                                const thisMod = calculateBestWeaponMod(wData, strMod, dexMod);
                                if (thisMod >= maxWeaponMod) shouldCheck = true;
                            }
                        }
                        inputs[2].checked = shouldCheck;
                    } 
                    else if (box.id === 2) { // RÜSTUNG
                        let shouldCheckArmor = false;
                        if (item.label === 'shieldLabel') {
                            shouldCheckArmor = (item.equipped === true);
                        } 
                        else if (!armorAlreadyEquipped) {
                            if (item.equipped === true) {
                                shouldCheckArmor = true;
                                armorAlreadyEquipped = true;
                            } 
                            else if (canAutoEquipArmor) {
                                const aData = armorList.find(a => a.translationLabel === item.label);
                                if (aData && (parseInt(aData.armorClass) || 0) === maxArmorAC) {
                                    shouldCheckArmor = true;
                                    item.equipped = true; 
                                    armorAlreadyEquipped = true;
                                }
                            }
                        } else {
                            item.equipped = false;
                        }

                        inputs[2].checked = shouldCheckArmor;

                        if (item.label === 'shieldLabel') {
                            inputs[2].setAttribute('onchange', 'toggleShield(this, "inventory")');
                            inputs[2].classList.add('inventory-shield-checkbox'); 
                        } else {
                            inputs[2].setAttribute('onchange', 'handleArmorChange(this)');
                        }
                    }
                } else if (box.col3 === 'ability' && inputs[2]) {
                    // Werkzeuge: Attribut aus toolAbility (wie Ersteller), nicht typeLabel
                    inputs[2].value = resolveInventoryToolAbility(item);
                } else if (box.col3 === 'type' && inputs[2]) {
                    // Sonstiges: gespeichertes typeLabel (Pack/Fokus/Material); singleItem → "-"
                    inputs[2].value = resolveInventoryGearType(item);
                }
            } else {
                // Leerzeilen zurücksetzen...
                if(inputs[0]) inputs[0].value = "";
                if(inputs[1]) inputs[1].value = "";
                if(inputs[2]) {
                    if (inputs[2].type === "checkbox") {
                        inputs[2].checked = false;
                        inputs[2].removeAttribute('onchange');
                        inputs[2].removeAttribute('data-source-id');
                        inputs[2].removeAttribute('data-creator-bound');
                        inputs[2].removeAttribute('data-index');
                        inputs[2].classList.remove('inventory-shield-checkbox');
                    } else {
                        inputs[2].value = "";
                    }
                }
            }
        }
    });

    updatePhysicalAttacks();
    if (typeof applyClassFeatureLogic === 'function') applyClassFeatureLogic(data);
    updateArmorClass();
}

/**
 * Hilfsfunktion: Berechnet den besten Attributs-Modifikator für eine Waffe.
 * (Genutzt für Auto-Equip Logik)
 */
function calculateBestWeaponMod(weaponData, strMod, dexMod) {
    // Ist es eine Fernkampfwaffe? (Kat 2 = Einfach Fernkampf, Kat 4 = Kriegswaffe Fernkampf)
    const isRanged = (weaponData.weaponCategoryNumber === 2 || weaponData.weaponCategoryNumber === 4);
    
    let isFinesse = false;
    let isLight = false; 
    
    if (weaponData.weaponPropertyCategoryNumber) {
        const props = Array.isArray(weaponData.weaponPropertyCategoryNumber) 
                      ? weaponData.weaponPropertyCategoryNumber 
                      : [weaponData.weaponPropertyCategoryNumber];
        
        if (props.includes(2)) isFinesse = true; // 2 = Finesse

        // Prüfen, ob die Waffe "Leicht" ist
        if (typeof weaponProperty !== 'undefined') {
            const lightProp = weaponProperty.find(p => p.translationLabel === 'lightLabel');
            if (lightProp && props.includes(lightProp.weaponPropertyCategoryNumber)) {
                isLight = true;
            }
        }
    }

    // --- KORRIGIERTE MÖNCHS-REGEL ---
    // Gilt NUR für Nahkampfwaffen (!isRanged), die Leicht sind ODER Einfache Nahkampfwaffen (Kat 1) sind
    if (window.hasMartialArts && !isRanged && (isLight || weaponData.weaponCategoryNumber === 1)) {
        isFinesse = true; 
    }

    if (isFinesse) {
        return Math.max(strMod, dexMod);
    } else if (isRanged) {
        return dexMod;
    } else {
        return strMod;
    }
}

/**
 * Attribut-Label-Key → übersetzte Abkürzung (strengthLabel → STÄ/STR).
 * @param {string} abilityLabelKey - z. B. dexterityLabel
 * @returns {string}
 */
function getAttributeAbbrFromLabelKey(abilityLabelKey) {
    if (!abilityLabelKey) return "-";

    const labelKey = String(abilityLabelKey).trim();
    if (!labelKey) return "-";

    const abbrKey = labelKey.endsWith("Label")
        ? labelKey.replace(/Label$/, "AbbrLabel")
        : `${labelKey}AbbrLabel`;

    const lang = translations[currentLanguage] || translations.de || {};
    if (lang[abbrKey]) {
        return String(lang[abbrKey]).toUpperCase();
    }

    const full = lang[labelKey] || labelKey;
    return String(full).substring(0, 3).toUpperCase();
}

/**
 * Löst das Attribut (toolAbility) für ein Inventar-Werkzeug auf.
 * Instrumente/Spiele ohne toolAbility → "-".
 * @param {object} item - Eintrag aus equipment.tools
 * @returns {string} Attribut-Abkürzung oder "-"
 */
function resolveInventoryToolAbility(item) {
    if (!item || !item.label) return '-';

    let toolData = null;
    if (typeof toolList !== 'undefined') {
        toolData = toolList.find(t => t.translationLabel === item.label) || null;
    }
    if (!toolData && typeof instrumentList !== 'undefined') {
        toolData = instrumentList.find(t => t.translationLabel === item.label) || null;
    }
    if (!toolData && typeof gameList !== 'undefined') {
        toolData = gameList.find(t => t.translationLabel === item.label) || null;
    }

    const abilityKey = toolData && toolData.toolAbility ? toolData.toolAbility : null;
    if (!abilityKey) return '-';

    return getAttributeAbbrFromLabelKey(abilityKey);
}

/**
 * Löst den Typ-Text für Sonstiges/Gear auf (analog Ersteller-Anzeige).
 * singleItemLabel und fehlende Werte → "-".
 * @param {object} item - Eintrag aus equipment.gear
 * @returns {string} Übersetzter Typ oder "-"
 */
function resolveInventoryGearType(item) {
    if (!item) return '-';

    const typeKey = item.typeLabel;
    if (!typeKey || typeKey === 'singleItemLabel') return '-';

    const lang = translations[currentLanguage];
    return (lang && lang[typeKey]) ? lang[typeKey] : typeKey;
}

/**
 * Führt identische Items zusammen und addiert deren Mengen.
 * Ein Item gilt als identisch, wenn Label UND selectedVaries gleich sind.
 */
function mergeDuplicateItems(items) {
    const mergedMap = new Map();

    items.forEach(item => {
        // Eindeutigen Schlüssel generieren
        // Unterscheidung: "Langschwert" vs. "Kurzschwert" (auch wenn beide label="martialMelee" hätten)
        const uniqueKey = item.selectedVaries ? item.selectedVaries : item.label;

        if (mergedMap.has(uniqueKey)) {
            // Item existiert schon -> Menge addieren
            const existingItem = mergedMap.get(uniqueKey);
            existingItem.amount += (item.amount || 1);
        } else {
            // Item neu anlegen (Kopie, um Originaldaten nicht zu verändern)
            // Wir nutzen JSON parse/stringify für eine saubere Deep Copy des Objekts
            const newItem = JSON.parse(JSON.stringify(item));
            mergedMap.set(uniqueKey, newItem);
        }
    });

    // Map zurück in Array wandeln
    return Array.from(mergedMap.values());
}

/**
 * Durchsucht die Item-Liste. Wenn ein Item ein "Pack" ist, wird es entfernt
 * und durch seinen Inhalt (aus adventuringGearList) ersetzt.
 */
function expandInventoryPacks(items) {
    let flattened = [];

    items.forEach(item => {
        if (item.typeLabel === 'packLabel') {
